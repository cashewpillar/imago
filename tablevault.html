<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TableVault</title>
<script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --bg: #0e0e10;
  --bg2: #17171b;
  --bg3: #1f1f25;
  --bg4: #28282f;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #efefee;
  --muted: #7a7a88;
  --muted2: #45454f;
  --r: 14px;
  --r-sm: 8px;
  --font-h: 'Syne', sans-serif;
  --font-b: 'DM Sans', sans-serif;
  --sh: 0 4px 24px rgba(0,0,0,0.5);
}
:root.light {
  --bg: #f6f2ea;
  --bg2: #fffdf7;
  --bg3: #f1ebdf;
  --bg4: #e6dece;
  --border: rgba(52,45,30,0.09);
  --border2: rgba(52,45,30,0.16);
  --text: #1f1c16;
  --muted: #6e6658;
  --muted2: #a49a87;
  --sh: 0 12px 36px rgba(77,65,36,0.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:14px;line-height:1.5;min-height:100vh;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}

.screen{display:none;flex-direction:column;min-height:100vh;}
.screen.active{display:flex;}

.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:0 14px;height:52px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo{font-family:var(--font-h);font-size:17px;font-weight:800;letter-spacing:-0.5px;}
.back-btn{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--bg3);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;}
.back-btn:hover{color:var(--text);background:var(--bg4);}
.topbar-title{font-family:var(--font-h);font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;gap:6px;margin-left:auto;flex-shrink:0;}

.filter-bar{padding:10px 14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;}
.filter-controls{display:flex;gap:8px;align-items:center;}
.grouping-select{flex:0 0 148px;max-width:45%;}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
.search-input{width:100%;padding:8px 10px 8px 32px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:13px;font-family:var(--font-b);outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--border2);}
.search-input::placeholder{color:var(--muted2);}
.topbar-search{display:flex;align-items:center;justify-content:flex-end;overflow:hidden;max-width:0;opacity:0;transition:max-width .18s ease, opacity .12s ease;}
.topbar-search.open{max-width:220px;opacity:1;}
.topbar-search .search-wrap{width:200px;}
.topbar-search .search-input{height:32px;padding:6px 10px 6px 32px;font-size:12px;}
.tag-row{display:flex;flex-direction:column;gap:6px;}
.tag-row:empty{display:none;}
.tag-group{display:flex;gap:6px;align-items:flex-start;min-width:0;}
.tag-group-label{flex:0 0 auto;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);padding-top:5px;min-width:32px;}
.tag-group-chips{display:flex;gap:5px;flex-wrap:wrap;min-width:0;}
.tag-chip{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--muted);transition:all .12s;white-space:nowrap;user-select:none;}
.tag-chip:hover{color:var(--text);}
.tag-chip.active{border-color:transparent;color:#0e0e10;font-weight:600;}

.mosaic{padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:1;align-content:start;}

/* table cards */
.table-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 13px 12px;cursor:pointer;transition:border-color .15s,transform .12s;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;}
.table-card:hover{border-color:var(--border2);transform:translateY(-1px);}
.table-card:active{transform:scale(.98);}
.tc-stripe{position:absolute;top:0;left:0;right:0;height:3px;}
.tc-icon{font-size:28px;line-height:1;}
.tc-name{font-family:var(--font-h);font-size:14px;font-weight:700;line-height:1.2;word-break:break-word;}
.tc-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
.tc-count{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;}
.tc-menu{width:24px;height:24px;border-radius:6px;border:none;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;transition:all .12s;}
.tc-menu:hover{background:var(--bg4);color:var(--text);}
.tc-tags{display:flex;flex-wrap:wrap;gap:4px;}
.tc-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;}

/* record cards */
.rec-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px;cursor:pointer;transition:border-color .15s,transform .12s;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;}
.rec-card:hover{border-color:var(--border2);transform:translateY(-1px);}
.rec-card:active{transform:scale(.98);}
.rc-stripe{position:absolute;top:0;left:0;right:0;height:2px;opacity:.7;}
.rc-header{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
.rc-title{font-size:13px;font-weight:600;line-height:1.3;word-break:break-word;}
.rc-menu{width:22px;height:22px;border-radius:5px;border:none;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;flex-shrink:0;transition:all .12s;}
.rc-menu:hover{background:var(--bg4);color:var(--text);}
.rc-fields{display:flex;flex-direction:column;gap:4px;}
.rc-frow{display:flex;gap:6px;font-size:11px;}
.rc-fkey{color:var(--muted);flex-shrink:0;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rc-fval{color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rc-tags{display:flex;flex-wrap:wrap;gap:4px;}
.rc-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;}
.rc-meta{display:flex;flex-direction:column;gap:5px;}
.rc-meta-group{display:flex;gap:6px;align-items:flex-start;min-width:0;}
.rc-meta-label{flex:0 0 auto;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);padding-top:3px;min-width:32px;}
.rc-meta-tags{display:flex;flex-wrap:wrap;gap:4px;min-width:0;}
.rc-date{font-size:10px;color:var(--muted2);margin-top:auto;padding-top:6px;border-top:1px solid var(--border);}
.group-list{display:flex;flex-direction:column;gap:12px;grid-column:1/-1;}
.group-block{display:flex;flex-direction:column;gap:8px;}
.group-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg2);cursor:pointer;}
.group-toggle{width:18px;color:var(--muted);font-size:12px;text-align:center;flex-shrink:0;}
.group-title{font-size:12px;font-weight:700;color:var(--text);}
.group-count{margin-left:auto;font-size:10px;font-weight:700;color:var(--muted);padding:2px 7px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);}
.group-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}

.prog-wrap{width:100%;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:3px;}
.prog-fill{height:100%;border-radius:3px;transition:width .3s;}

.empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;padding:60px 20px;gap:10px;text-align:center;}
.empty-icon{font-size:40px;margin-bottom:4px;}
.empty-state h3{font-family:var(--font-h);font-size:16px;font-weight:700;}
.empty-state p{font-size:13px;color:var(--muted);max-width:220px;line-height:1.6;}

.btn{padding:7px 14px;border-radius:var(--r-sm);font-size:12px;font-weight:600;font-family:var(--font-b);cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.btn-primary{background:#b8ff57;color:#0e0e10;}
.btn-primary:hover{background:#c9ff6e;}
.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--border2);}
.btn-ghost:hover{background:var(--bg4);}
.btn-danger{background:rgba(255,92,92,.12);color:#ff5c5c;border:1px solid rgba(255,92,92,.2);}
.btn-danger:hover{background:rgba(255,92,92,.22);}
.btn-icon{padding:7px 9px;}

.fab{position:fixed;bottom:22px;right:18px;z-index:30;width:52px;height:52px;border-radius:50%;background:#b8ff57;color:#0e0e10;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:300;box-shadow:0 4px 20px rgba(184,255,87,.35);transition:transform .15s,box-shadow .15s;}
.fab:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(184,255,87,.45);}
.fab:active{transform:scale(.95);}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:100;}
.modal-backdrop.open{display:flex;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .22s cubic-bezier(.16,1,.3,1);}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:15px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-title{font-family:var(--font-h);font-size:16px;font-weight:700;}
.modal-close{width:28px;height:28px;border-radius:var(--r-sm);border:none;background:var(--bg3);color:var(--muted);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.modal-close:hover{color:var(--text);background:var(--bg4);}
.modal-body{padding:16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px;}
.modal-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;}

.fg{display:flex;flex-direction:column;gap:5px;}
.flabel{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.finput,.fselect,.ftextarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);color:var(--text);font-family:var(--font-b);font-size:13px;padding:8px 10px;outline:none;transition:border-color .15s;width:100%;}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:#b8ff57;}
.ftextarea{resize:vertical;min-height:70px;}
.fselect option{background:var(--bg3);}

.field-row{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;}
.field-row.primary{border-left:3px solid #b8ff57;}
.field-row input{flex:1;background:none;border:none;color:var(--text);font-size:13px;font-family:var(--font-b);outline:none;min-width:0;}
.field-row input::placeholder{color:var(--muted2);}
.field-row select{background:var(--bg4);border:1px solid var(--border);border-radius:5px;color:var(--muted);font-size:11px;font-family:var(--font-b);padding:3px 6px;outline:none;cursor:pointer;}
.field-row.wrap{flex-wrap:wrap;}
.field-options{width:100%;padding-left:28px;}
.field-options input{width:100%;background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;}
.field-badge{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:rgba(184,255,87,.12);color:#b8ff57;flex-shrink:0;}
.field-del{width:22px;height:22px;border-radius:5px;border:none;background:none;color:var(--muted2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all .12s;}
.field-del:hover{color:#ff5c5c;background:rgba(255,92,92,.12);}
.btn-add-field{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px dashed var(--border2);border-radius:var(--r-sm);background:none;color:var(--muted);font-size:12px;font-family:var(--font-b);cursor:pointer;width:100%;transition:all .12s;}
.btn-add-field:hover{border-color:#b8ff57;color:#b8ff57;}

.rfrow{display:flex;flex-direction:column;gap:5px;}
.rflabel{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;}
.type-badge{font-size:9px;font-weight:600;padding:1px 5px;border-radius:4px;background:var(--bg4);color:var(--muted2);text-transform:lowercase;letter-spacing:0;}

.tag-wrap{display:flex;flex-wrap:wrap;gap:5px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:6px 8px;cursor:text;min-height:40px;align-items:center;transition:border-color .15s;}
.tag-wrap:focus-within{border-color:#b8ff57;}
.tpill{display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.tpill-x{cursor:pointer;opacity:.7;font-size:13px;line-height:1;}
.tpill-x:hover{opacity:1;}
.tag-inp{border:none;background:none;outline:none;font-family:var(--font-b);font-size:12px;color:var(--text);flex:1;min-width:60px;}
.tag-inp::placeholder{color:var(--muted2);}
.tag-editor{display:flex;flex-wrap:wrap;gap:5px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:6px 8px;cursor:text;min-height:40px;align-items:center;transition:border-color .15s;}
.tag-editor:focus-within{border-color:#b8ff57;}

.cp{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
.cswatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .12s;}

.ctx-menu{position:fixed;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);box-shadow:var(--sh);z-index:200;overflow:hidden;min-width:160px;display:none;}
.ctx-item{display:flex;align-items:center;gap:8px;padding:9px 13px;font-size:13px;cursor:pointer;transition:background .1s;color:var(--text);}
.ctx-item:hover{background:var(--bg4);}
.ctx-item.danger{color:#ff5c5c;}
.ctx-item.danger:hover{background:rgba(255,92,92,.12);}
.ctx-sep{height:1px;background:var(--border);margin:3px 0;}

#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:9px 16px;font-size:13px;color:var(--text);z-index:999;opacity:0;transition:all .25s cubic-bezier(.16,1,.3,1);box-shadow:var(--sh);white-space:nowrap;display:flex;align-items:center;gap:8px;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
</style>
</head>
<body>

<!-- ══ HOME: tables mosaic ════════════════════════════════════════════ -->
<div id="screen-home" class="screen active">
  <div class="topbar">
    <div class="logo" style="color:#b8ff57;">Table<span style="color:var(--text);">Vault</span></div>
    <div class="topbar-search" id="home-top-search">
      <div class="search-wrap">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.3"/><path d="M9 9l2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <input class="search-input" id="home-search" placeholder="Search tables…" oninput="renderHome()">
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-icon" title="Search tables" onclick="toggleTopSearch('home')">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.3"/><path d="M9 9l2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" title="Import snapshot" onclick="importSnapshot()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.5v6.2M4 5.4l2.5 2.5 2.5-2.5M2 10.5h9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" title="Toggle theme" onclick="toggleTheme()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="2.4" stroke="currentColor" stroke-width="1.2"/><path d="M6.5 1v1.4M6.5 10.6V12M12 6.5h-1.4M2.4 6.5H1M10.4 2.6l-1 1M3.6 9.4l-1 1M10.4 10.4l-1-1M3.6 3.6l-1-1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <div class="filter-bar">
    <div class="tag-row" id="home-tags"></div>
  </div>
  <div class="mosaic" id="home-grid"></div>
  <button class="fab" onclick="openNewTableModal()">+</button>
</div>

<!-- ══ RECORDS: records mosaic ════════════════════════════════════════ -->
<div id="screen-records" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="goHome()">
      <svg width="14" height="12" viewBox="0 0 14 12" fill="none"><path d="M6 1L1 6l5 5M1 6h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="topbar-title" id="rec-screen-title">—</div>
    <div class="topbar-search" id="rec-top-search">
      <div class="search-wrap">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.3"/><path d="M9 9l2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <input class="search-input" id="rec-search" placeholder="Search records…" oninput="renderRecords()">
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-icon" title="Search records" onclick="toggleTopSearch('rec')">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.3"/><path d="M9 9l2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" title="Toggle theme" onclick="toggleTheme()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="2.4" stroke="currentColor" stroke-width="1.2"/><path d="M6.5 1v1.4M6.5 10.6V12M12 6.5h-1.4M2.4 6.5H1M10.4 2.6l-1 1M3.6 9.4l-1 1M10.4 10.4l-1-1M3.6 3.6l-1-1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" title="Edit fields" onclick="openFieldsModal()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x=".5" y=".5" width="12" height="12" rx="2.5" stroke="currentColor"/><path d="M3.5 6.5h6M6.5 3.5v6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" title="Table settings" onclick="openSettingsModal()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="2" stroke="currentColor" stroke-width="1.2"/><path d="M6.5 1v1.2M6.5 10.8V12M12 6.5h-1.2M2.2 6.5H1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <div class="filter-bar">
    <div class="filter-controls">
      <select class="fselect grouping-select" id="rec-group-by" onchange="handleGroupingChange()"></select>
    </div>
    <div class="tag-row" id="rec-tags"></div>
  </div>
  <div class="mosaic" id="rec-grid"></div>
  <button class="fab" onclick="openAddRecordModal()">+</button>
</div>

<!-- modal: new/edit table -->
<div id="m-table" class="modal-backdrop" onclick="bdClose(event,'m-table')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="m-table-ttl">New Table</div>
      <button class="modal-close" onclick="cm('m-table')">✕</button>
    </div>
    <div class="modal-body">
      <div class="fg"><label class="flabel">Name</label><input class="finput" id="tbl-name" placeholder="e.g. Fitness Goals, Book List…" maxlength="40"></div>
      <div style="display:flex;gap:12px;">
        <div class="fg" style="flex:0 0 auto;"><label class="flabel">Icon</label><input class="finput" id="tbl-icon" placeholder="📋" maxlength="4" style="font-size:20px;width:58px;text-align:center;"></div>
        <div class="fg" style="flex:1;"><label class="flabel">Color</label><div class="cp" id="cp1"></div></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cm('m-table')">Cancel</button>
      <button class="btn btn-primary" id="tbl-save-btn" onclick="saveTable()">Create</button>
    </div>
  </div>
</div>

<!-- modal: table settings -->
<div id="m-settings" class="modal-backdrop" onclick="bdClose(event,'m-settings')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Table Settings</div>
      <button class="modal-close" onclick="cm('m-settings')">✕</button>
    </div>
    <div class="modal-body">
      <div class="fg"><label class="flabel">Name</label><input class="finput" id="ts-name" maxlength="40"></div>
      <div style="display:flex;gap:12px;">
        <div class="fg" style="flex:0 0 auto;"><label class="flabel">Icon</label><input class="finput" id="ts-icon" maxlength="4" style="font-size:20px;width:58px;text-align:center;"></div>
        <div class="fg" style="flex:1;"><label class="flabel">Color</label><div class="cp" id="cp2"></div></div>
      </div>
      <div class="fg">
        <label class="flabel">Tags</label>
        <div class="tag-editor" onclick="document.getElementById('ts-tag-input').focus()">
          <div id="ts-tag-pills"></div>
          <input type="text" class="tag-inp" id="ts-tag-input" placeholder="Type tag, press Enter…" onkeydown="handleTableTag(event)">
        </div>
      </div>
      <div style="padding-top:12px;border-top:1px solid var(--border);">
        <button class="btn btn-danger" style="width:100%;" onclick="confirmDeleteTable()">Delete Table &amp; All Records</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cm('m-settings')">Cancel</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<!-- modal: fields editor -->
<div id="m-fields" class="modal-backdrop" onclick="bdClose(event,'m-fields')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Edit Fields</div>
      <button class="modal-close" onclick="cm('m-fields')">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:12px;color:var(--muted);line-height:1.7;">Define the columns for records. The first field is the card title.</p>
      <div id="fields-ed" style="display:flex;flex-direction:column;gap:7px;"></div>
      <button class="btn-add-field" onclick="addField()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Add Field
      </button>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cm('m-fields')">Cancel</button>
      <button class="btn btn-primary" onclick="saveFields()">Save Fields</button>
    </div>
  </div>
</div>

<!-- modal: add/edit record -->
<div id="m-record" class="modal-backdrop" onclick="bdClose(event,'m-record')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="m-rec-ttl">Add Record</div>
      <button class="modal-close" onclick="cm('m-record')">✕</button>
    </div>
    <div class="modal-body" id="rec-form"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cm('m-record')">Cancel</button>
      <button class="btn btn-primary" id="rec-save-btn" onclick="saveRecord()">Add</button>
    </div>
  </div>
</div>

<div id="ctx" class="ctx-menu"></div>
<div id="toast"><div class="tdot" id="tdot"></div><span id="tmsg"></span></div>
<input type="file" id="snapshot-file-input" accept=".json,application/json" style="display:none;" onchange="handleSnapshotFile(event)">

<script src="tablevault.js"></script>
</body>
</html>
