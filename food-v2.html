<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
<style>
  :root{
    --bg:#ffffff;
    --bg-raised:#ffffff;
    --bg-inset:#f2f4f2;
    --chalk:#1e211f;
    --chalk-dim:#585c58;
    --chalk-faint:#8a8f8a;
    --accent:#b9812e;
    --accent-dim:#f4e7c8;
    --accent-tint: rgba(185,129,46,0.12);
    --sage:#4f6a40;
    --sage-dim:#e3ead9;
    --rust:#a1454c;
    --rust-dim:#f5dcdd;
    --line: rgba(20,22,20,0.11);
    --line-strong: rgba(20,22,20,0.22);
    --on-accent: #251b06;
    --on-rust: #fdf2f2;
    --shadow: 0 8px 24px rgba(20,22,20,0.09);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:80px;
  }
  ::selection{ background:var(--accent-dim); color:var(--chalk); }

  .display{ font-family:'Kalam', cursive; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 60%, rgba(255,255,255,0.92));
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:18px 16px 14px;
  }
  .brand{
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  }
  .brand h1{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:28px;
    margin:0;
    letter-spacing:0.3px;
    color:var(--chalk);
    position:relative;
  }
  .brand h1 .underline{
    position:absolute; left:0; bottom:-4px; width:100%; height:6px;
  }
  .brand .tagline{
    font-size:11px;
    color:var(--chalk-faint);
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin-top:2px;
  }
  .icon-btn{
    background:none; border:1px solid var(--line-strong); color:var(--chalk-dim);
    width:38px; height:38px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .15s, color .15s, border-color .15s;
    flex:none;
  }
  .icon-btn:hover, .icon-btn:focus-visible{ color:var(--chalk); border-color:var(--accent); outline:none; }
  .icon-btn svg{ width:18px; height:18px; }

  .toolbar{
    display:flex; gap:8px; margin-top:14px; align-items:center;
  }
  .search-wrap{
    flex:1; position:relative;
  }
  .search-wrap svg{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color:var(--chalk-faint); pointer-events:none;
  }
  input[type="search"], input[type="text"], input[type="number"], select, textarea{
    font-family:'Work Sans', sans-serif;
    background:var(--bg-inset);
    border:1px solid var(--line);
    color:var(--chalk);
    border-radius:9px;
    padding:9px 12px 9px 34px;
    font-size:14.5px;
    width:100%;
    transition:border-color .15s;
  }
  select{ padding-left:12px; }
  input[type="text"]:not(.search-wrap input), input[type="number"], textarea{ padding-left:12px; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--accent); }
  input::placeholder{ color:var(--chalk-faint); }

  .view-toggle{
    display:flex; background:var(--bg-inset); border:1px solid var(--line);
    border-radius:9px; padding:2px; flex:none;
  }
  .view-toggle button{
    background:none; border:none; color:var(--chalk-faint);
    font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:7px;
    cursor:pointer; transition:background .15s, color .15s;
    font-family:'Work Sans',sans-serif;
  }
  .view-toggle button.active{ background:var(--accent-dim); color:var(--chalk); }

  main{ padding:16px; max-width:900px; margin:0 auto; }

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center; padding:56px 20px; color:var(--chalk-faint);
  }
  .empty .display{ font-size:22px; color:var(--chalk-dim); display:block; margin-bottom:6px;}
  .empty p{ font-size:13.5px; margin:0; }

  /* ---------- Dish table ---------- */
  table.dishes{ width:100%; border-collapse:collapse; }
  table.dishes thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:1px;
    color:var(--chalk-faint); font-weight:600; padding:0 12px 8px;
    border-bottom:1px solid var(--line);
  }
  table.dishes tbody tr{
    background:var(--bg-raised);
  }
  table.dishes tbody tr:hover{ background:var(--bg-inset); }
  table.dishes td{
    padding:14px 12px; vertical-align:top; border-bottom:1px solid var(--bg);
  }
  table.dishes tbody tr td:first-child{ border-top-left-radius:10px; border-bottom-left-radius:10px; }
  table.dishes tbody tr td:last-child{ border-top-right-radius:10px; border-bottom-right-radius:10px; }
  table.dishes tbody tr{ box-shadow: inset 0 0 0 1px var(--line); }
  table.dishes tbody tr + tr{ margin-top:8px; }
  table.dishes tbody{ display:block; }
  table.dishes thead, table.dishes tbody tr{ display:table; width:100%; table-layout:fixed; }
  table.dishes tbody tr{ margin-bottom:8px; border-radius:10px; }

  .dish-name{ font-weight:600; font-size:15px; color:var(--chalk); }
  .dish-type{
    display:inline-block; margin-top:4px; font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.8px; padding:2px 7px; border-radius:20px; font-weight:600;
  }
  .dish-type.dish{ background:rgba(139,160,119,0.18); color:var(--sage); }
  .dish-type.snack{ background:rgba(217,164,65,0.18); color:var(--accent); }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--bg-inset);
    border:1px solid var(--line-strong);
    color:var(--chalk-dim);
    font-size:12px;
    padding:4px 9px;
    border-radius:14px 4px 14px 4px;
    white-space:nowrap;
    cursor:pointer;
  }
  .chip:hover{ border-color:var(--sage); color:var(--chalk); }
  .chip .qty{ color:var(--chalk-faint); font-family:'IBM Plex Mono', monospace; font-size:10.5px; }
  .chip.shared{ border-color:var(--accent-dim); }
  .chip .tally{ display:inline-flex; align-items:flex-end; gap:1.5px; height:9px; margin-left:1px; }
  .chip .tally i{ display:block; width:1.5px; height:9px; background:var(--accent); transform:rotate(8deg); }
  .chip .tally i.diag{ width:11px; height:1.5px; transform:rotate(-35deg) translate(1px,3px); }

  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }
  .row-actions button{
    background:none; border:1px solid var(--line); color:var(--chalk-faint);
    width:30px; height:30px; border-radius:7px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .row-actions button:hover{ color:var(--chalk); border-color:var(--line-strong); }
  .row-actions button.danger:hover{ color:var(--rust); border-color:var(--rust-dim); }
  .row-actions svg{ width:14px; height:14px; }

  /* mobile card-ified table */
  @media (max-width: 640px){
    table.dishes thead{ display:none; }
    table.dishes, table.dishes tbody, table.dishes tbody tr, table.dishes td{ display:block; width:100%; }
    table.dishes tbody tr{ padding:14px 12px 12px; margin-bottom:10px; }
    table.dishes td{ border:none; padding:0; }
    table.dishes td + td{ margin-top:10px; }
    table.dishes td[data-label]::before{
      content: attr(data-label);
      display:block; font-size:10px; text-transform:uppercase; letter-spacing:1px;
      color:var(--chalk-faint); margin-bottom:4px; font-weight:600;
    }
    .row-actions{ justify-content:flex-start; margin-top:2px; }
  }

  /* ---------- Ingredients view ---------- */
  .ing-list{ display:flex; flex-direction:column; gap:8px; }
  .ing-row{
    background:var(--bg-raised); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; cursor:pointer;
  }
  .ing-row-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .ing-name{ font-weight:600; font-size:14.5px; }
  .ing-count{ display:flex; align-items:center; gap:7px; color:var(--chalk-faint); font-size:12px; }
  .ing-uses{
    max-height:0; overflow:hidden; transition:max-height .2s ease;
  }
  .ing-row.open .ing-uses{ max-height:300px; margin-top:10px; }
  .ing-uses ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; }
  .ing-uses li{
    display:flex; justify-content:space-between; font-size:13px; color:var(--chalk-dim);
    border-top:1px dashed var(--line); padding-top:6px;
  }
  .ing-uses li:first-child{ border-top:none; padding-top:0; }
  .ing-uses .qty{ font-family:'IBM Plex Mono', monospace; color:var(--chalk-faint); font-size:11.5px; }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:18px; bottom:22px; z-index:25;
    width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:var(--on-accent); border:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow); cursor:pointer;
    transition:transform .15s;
  }
  .fab:hover{ transform:scale(1.05); }
  .fab svg{ width:24px; height:24px; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(15,14,13,0.72);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
    backdrop-filter:blur(2px);
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--bg-raised); width:100%; max-width:560px;
    border-radius:18px 18px 0 0;
    max-height:92vh; overflow-y:auto;
    padding:20px 18px 24px;
    border-top:1px solid var(--line-strong);
    animation:slideUp .18s ease;
  }
  @media (min-width:640px){
    .overlay{ align-items:center; }
    .modal{ border-radius:16px; margin:20px; }
  }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .modal h2{ font-family:'Kalam',cursive; font-size:22px; margin:0 0 16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--chalk-faint); margin-bottom:6px; font-weight:600; }
  .segmented{ display:flex; gap:8px; }
  .segmented button{
    flex:1; padding:9px; border-radius:9px; border:1px solid var(--line-strong);
    background:var(--bg-inset); color:var(--chalk-dim); font-weight:600; font-size:13px;
    cursor:pointer; font-family:'Work Sans',sans-serif;
  }
  .segmented button.active.dish{ background:rgba(139,160,119,0.22); border-color:var(--sage); color:var(--sage); }
  .segmented button.active.snack{ background:rgba(217,164,65,0.22); border-color:var(--accent); color:var(--accent); }

  .ing-rows{ display:flex; flex-direction:column; gap:8px; }
  .ing-input-row{ display:grid; grid-template-columns:1fr 68px 74px 32px; gap:6px; align-items:center; }
  .ing-input-row input{ padding-left:12px; }
  .ing-input-row button{
    background:none; border:1px solid var(--line); color:var(--chalk-faint);
    height:36px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .ing-input-row button:hover{ color:var(--rust); border-color:var(--rust-dim); }
  .add-ing-btn{
    margin-top:4px; background:none; border:1px dashed var(--line-strong); color:var(--chalk-dim);
    padding:9px; border-radius:9px; cursor:pointer; font-size:13px; width:100%;
    font-family:'Work Sans',sans-serif;
  }
  .add-ing-btn:hover{ color:var(--chalk); border-color:var(--accent); }

  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .btn{
    flex:1; padding:11px; border-radius:10px; border:none; font-weight:600; font-size:14px;
    cursor:pointer; font-family:'Work Sans',sans-serif;
  }
  .btn.primary{ background:var(--accent); color:var(--on-accent); }
  .btn.primary:hover{ background:var(--accent); filter:brightness(1.1); }
  .btn.ghost{ background:none; border:1px solid var(--line-strong); color:var(--chalk-dim); }
  .btn.ghost:hover{ color:var(--chalk); }
  .btn.danger{ background:var(--rust); color:var(--on-rust); }

  /* ---------- Import/export sheet ---------- */
  .io-row{ display:flex; flex-direction:column; gap:10px; }
  .io-btn{
    display:flex; align-items:center; gap:12px;
    background:var(--bg-inset); border:1px solid var(--line);
    border-radius:10px; padding:13px 14px; cursor:pointer; text-align:left;
    color:var(--chalk); font-family:'Work Sans',sans-serif; font-size:14px; font-weight:500;
  }
  .io-btn:hover{ border-color:var(--accent); }
  .io-btn svg{ width:18px; height:18px; color:var(--accent); flex:none; }
  .io-btn small{ display:block; color:var(--chalk-faint); font-size:11.5px; font-weight:400; margin-top:2px; }
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--bg-raised); border:1px solid var(--line-strong); color:var(--chalk);
    padding:10px 18px; border-radius:30px; font-size:13px; z-index:60;
    box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-8px); }

  datalist{ display:none; }
  .hidden-file{ display:none; }
  .confirm-text{ font-size:13.5px; color:var(--chalk-dim); line-height:1.5; margin-bottom:4px; }
</style>
<meta name="theme-color" content="#f7f6f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="imago">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/imago-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

<header>
  <div class="brand">
    <div>
      <h1>The Larder</h1>
      <div class="tagline">Dish &amp; Snack Tracker </div>
    </div>
    <button class="icon-btn" id="ioBtn" title="Import / Export" aria-label="Import or export data">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
    </button>
  </div>
  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" id="searchInput" placeholder="Search dishes or ingredients…">
    </div>
    <div class="view-toggle">
      <button id="tabDishes" class="active">Dishes</button>
      <button id="tabIngredients">Ingredients</button>
    </div>
  </div>
</header>

<main id="main"></main>

<button class="fab" id="fabAdd" aria-label="Add dish">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- Dish edit modal -->
<div class="overlay" id="dishOverlay">
  <div class="modal">
    <h2 id="dishModalTitle">New dish</h2>
    <div class="field">
      <label>Name</label>
      <input type="text" id="dishNameInput" placeholder="e.g. Garlic fried rice">
    </div>
    <div class="field">
      <label>Type</label>
      <div class="segmented">
        <button type="button" class="dish active" data-type="dish">Dish</button>
        <button type="button" class="snack" data-type="snack">Snack</button>
      </div>
    </div>
    <div class="field">
      <label>Ingredients</label>
      <div class="ing-rows" id="ingRows"></div>
      <button type="button" class="add-ing-btn" id="addIngRowBtn">+ Add ingredient</button>
    </div>
    <div class="field">
      <label>Notes <span style="text-transform:none;letter-spacing:0;color:var(--chalk-faint);">(optional)</span></label>
      <textarea id="dishNotesInput" rows="2" placeholder="Prep notes, occasion, source…" style="padding-left:12px; resize:vertical;"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelDishBtn">Cancel</button>
      <button class="btn primary" id="saveDishBtn">Save dish</button>
    </div>
  </div>
</div>

<!-- Confirm delete modal -->
<div class="overlay" id="confirmOverlay">
  <div class="modal" style="border-radius:16px; max-width:380px;">
    <h2 id="confirmTitle">Delete this?</h2>
    <p class="confirm-text" id="confirmText"></p>
    <div class="modal-actions">
      <button class="btn ghost" id="confirmCancelBtn">Cancel</button>
      <button class="btn danger" id="confirmOkBtn">Delete</button>
    </div>
  </div>
</div>

<!-- Import / export sheet -->
<div class="overlay" id="ioOverlay">
  <div class="modal" style="max-width:420px;">
    <h2>Import / Export</h2>
    <div class="io-row">
      <button class="io-btn" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
        <span>Export data<small>Download every dish and ingredient as JSON</small></span>
      </button>
      <button class="io-btn" id="importBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 21V9m0 0l-4 4m4-4l4 4M5 3h14"/></svg>
        <span>Import data<small>Merge a JSON file — existing records are matched by ID and updated in place</small></span>
      </button>
      <input type="file" accept="application/json" class="hidden-file" id="importFile">
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="closeIoBtn">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<datalist id="ingredientNames"></datalist>

<script>
(function(){
  "use strict";

  /* ---------------- DB ---------------- */
  const db = new Dexie('LarderDB');
  db.version(1).stores({
    items: 'id, name, type, updatedAt',
    ingredients: 'id, &nameKey, updatedAt',
    itemIngredients: 'id, itemId, ingredientId, updatedAt'
  });

  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
    'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8);
      return v.toString(16);
    }));
  const nowISO = () => new Date().toISOString();
  const normalize = s => s.trim().toLowerCase().replace(/\s+/g,' ');

  /* ---------------- State ---------------- */
  let currentTab = 'dishes';
  let searchTerm = '';
  let editingItemId = null; // null = creating new
  let currentType = 'dish';
  let confirmAction = null;

  /* ---------------- Helpers ---------------- */
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function tallySVG(count){
    // draws chalk-style tally marks for counts of shared ingredient usage
    let html = '<span class="tally">';
    const full = Math.floor(count/5), rem = count % 5;
    for(let g=0; g<full; g++){
      html += '<i></i><i></i><i></i><i></i><i class="diag"></i>';
    }
    for(let i=0;i<rem;i++) html += '<i></i>';
    html += '</span>';
    return html;
  }

  /* ---------------- Data access ---------------- */
  async function getAllData(){
    const [items, ingredients, itemIngredients] = await Promise.all([
      db.items.toArray(), db.ingredients.toArray(), db.itemIngredients.toArray()
    ]);
    return { items, ingredients, itemIngredients };
  }

  async function findOrCreateIngredient(name){
    const key = normalize(name);
    if(!key) return null;
    let existing = await db.ingredients.where('nameKey').equals(key).first();
    if(existing) return existing;
    const rec = { id: uuid(), name: name.trim(), nameKey: key, createdAt: nowISO(), updatedAt: nowISO() };
    await db.ingredients.put(rec);
    return rec;
  }

  async function saveDish(){
    const name = document.getElementById('dishNameInput').value.trim();
    if(!name){ toast('Give the dish a name'); return; }
    const notes = document.getElementById('dishNotesInput').value.trim();
    const rows = Array.from(document.querySelectorAll('.ing-input-row')).map(row => ({
      name: row.querySelector('.ing-name-input').value.trim(),
      qty: row.querySelector('.ing-qty-input').value.trim(),
      unit: row.querySelector('.ing-unit-input').value.trim()
    })).filter(r => r.name);

    const ts = nowISO();
    const itemId = editingItemId || uuid();
    const isNew = !editingItemId;

    await db.items.put({
      id: itemId, name, type: currentType, notes,
      createdAt: isNew ? ts : (await db.items.get(itemId))?.createdAt || ts,
      updatedAt: ts
    });

    // remove old join rows for this item, then re-add current set
    const oldJoins = await db.itemIngredients.where('itemId').equals(itemId).toArray();
    await db.itemIngredients.bulkDelete(oldJoins.map(j => j.id));

    for(const row of rows){
      const ing = await findOrCreateIngredient(row.name);
      if(!ing) continue;
      await db.itemIngredients.put({
        id: uuid(), itemId, ingredientId: ing.id,
        quantity: row.qty || '', unit: row.unit || '',
        createdAt: ts, updatedAt: ts
      });
    }

    closeDishModal();
    toast(isNew ? 'Dish added' : 'Dish updated');
    render();
  }

  async function deleteDish(itemId){
    const joins = await db.itemIngredients.where('itemId').equals(itemId).toArray();
    await db.itemIngredients.bulkDelete(joins.map(j => j.id));
    await db.items.delete(itemId);
    toast('Dish deleted');
    render();
  }

  /* ---------------- Modal: add/edit dish ---------------- */
  function ingRowTemplate(name='', qty='', unit=''){
    const wrap = document.createElement('div');
    wrap.className = 'ing-input-row';
    wrap.innerHTML = `
      <input type="text" class="ing-name-input" list="ingredientNames" placeholder="Ingredient" value="${escapeHtml(name)}">
      <input type="text" class="ing-qty-input mono" placeholder="qty" value="${escapeHtml(qty)}">
      <input type="text" class="ing-unit-input" placeholder="unit" value="${escapeHtml(unit)}">
      <button type="button" class="remove-ing-row" aria-label="Remove ingredient">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>`;
    wrap.querySelector('.remove-ing-row').addEventListener('click', () => wrap.remove());
    return wrap;
  }

  function addIngRow(name, qty, unit){
    document.getElementById('ingRows').appendChild(ingRowTemplate(name, qty, unit));
  }

  async function openDishModal(itemId){
    editingItemId = itemId || null;
    document.getElementById('dishModalTitle').textContent = itemId ? 'Edit dish' : 'New dish';
    document.getElementById('dishNameInput').value = '';
    document.getElementById('dishNotesInput').value = '';
    document.getElementById('ingRows').innerHTML = '';
    currentType = 'dish';
    setSegmented('dish');

    await refreshIngredientDatalist();

    if(itemId){
      const item = await db.items.get(itemId);
      if(item){
        document.getElementById('dishNameInput').value = item.name;
        document.getElementById('dishNotesInput').value = item.notes || '';
        currentType = item.type || 'dish';
        setSegmented(currentType);
        const joins = await db.itemIngredients.where('itemId').equals(itemId).toArray();
        for(const j of joins){
          const ing = await db.ingredients.get(j.ingredientId);
          addIngRow(ing ? ing.name : '', j.quantity, j.unit);
        }
      }
    }
    if(document.querySelectorAll('#ingRows .ing-input-row').length === 0) addIngRow();
    document.getElementById('dishOverlay').classList.add('show');
    document.getElementById('dishNameInput').focus();
  }

  function closeDishModal(){
    document.getElementById('dishOverlay').classList.remove('show');
    editingItemId = null;
  }

  function setSegmented(type){
    currentType = type;
    document.querySelectorAll('.segmented button').forEach(b => {
      b.classList.toggle('active', b.dataset.type === type);
    });
  }

  async function refreshIngredientDatalist(){
    const list = document.getElementById('ingredientNames');
    const ingredients = (await db.ingredients.toArray()).sort((a,b) => a.name.localeCompare(b.name));
    list.innerHTML = ingredients.map(i => `<option value="${escapeHtml(i.name)}">`).join('');
  }

  /* ---------------- Confirm dialog ---------------- */
  function openConfirm(title, text, onConfirm){
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmText').textContent = text;
    confirmAction = onConfirm;
    document.getElementById('confirmOverlay').classList.add('show');
  }
  function closeConfirm(){
    document.getElementById('confirmOverlay').classList.remove('show');
    confirmAction = null;
  }

  /* ---------------- Render: Dishes tab ---------------- */
  async function renderDishesTab(container){
    const { items, ingredients, itemIngredients } = await getAllData();
    const ingById = Object.fromEntries(ingredients.map(i => [i.id, i]));
    const usageCount = {};
    itemIngredients.forEach(j => { usageCount[j.ingredientId] = (usageCount[j.ingredientId]||0) + 1; });

    let filtered = items;
    if(searchTerm){
      const q = normalize(searchTerm);
      const joinsByItem = {};
      itemIngredients.forEach(j => { (joinsByItem[j.itemId] ||= []).push(j); });
      filtered = items.filter(item => {
        if(normalize(item.name).includes(q)) return true;
        const joins = joinsByItem[item.id] || [];
        return joins.some(j => ingById[j.ingredientId] && normalize(ingById[j.ingredientId].name).includes(q));
      });
    }
    filtered.sort((a,b) => a.name.localeCompare(b.name));

    if(filtered.length === 0){
      container.innerHTML = `<div class="empty">
        <span class="display">${items.length === 0 ? 'Nothing on the shelf yet' : 'No matches'}</span>
        <p>${items.length === 0 ? 'Tap + to add your first dish or snack.' : 'Try a different search term.'}</p>
      </div>`;
      return;
    }

    const joinsByItem = {};
    itemIngredients.forEach(j => { (joinsByItem[j.itemId] ||= []).push(j); });

    const rowsHtml = filtered.map(item => {
      const joins = (joinsByItem[item.id] || []);
      const chips = joins.map(j => {
        const ing = ingById[j.ingredientId];
        if(!ing) return '';
        const count = usageCount[j.ingredientId] || 1;
        const shared = count > 1;
        const qtyStr = [j.quantity, j.unit].filter(Boolean).join(' ');
        return `<span class="chip${shared ? ' shared':''}" data-ing-id="${ing.id}" title="${shared ? `Used in ${count} items` : 'Used in 1 item'}">
          ${escapeHtml(ing.name)}
          ${qtyStr ? `<span class="qty">${escapeHtml(qtyStr)}</span>` : ''}
          ${shared ? tallySVG(count) : ''}
        </span>`;
      }).join('');
      return `<tr data-item-id="${item.id}">
        <td data-label="Dish">
          <div class="dish-name">${escapeHtml(item.name)}</div>
          <span class="dish-type ${item.type}">${item.type}</span>
        </td>
        <td data-label="Ingredients"><div class="chips">${chips || '<span style="color:var(--chalk-faint);font-size:12.5px;">No ingredients yet</span>'}</div></td>
        <td data-label="Actions">
          <div class="row-actions">
            <button class="edit-btn" aria-label="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>
            <button class="delete-btn danger" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg></button>
          </div>
        </td>
      </tr>`;
    }).join('');

    container.innerHTML = `<table class="dishes">
      <thead><tr><th style="width:32%">Dish</th><th>Ingredients</th><th style="width:80px">Actions</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;

    container.querySelectorAll('tr[data-item-id]').forEach(tr => {
      const id = tr.dataset.itemId;
      tr.querySelector('.edit-btn').addEventListener('click', () => openDishModal(id));
      tr.querySelector('.delete-btn').addEventListener('click', () => {
        const item = items.find(i => i.id === id);
        openConfirm('Delete dish?', `"${item?.name || 'This dish'}" will be removed. Shared ingredients stay in your list.`, () => deleteDish(id));
      });
      tr.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          currentTab = 'ingredients';
          updateTabUI();
          searchTerm = '';
          document.getElementById('searchInput').value = '';
          render(chip.dataset.ingId);
        });
      });
    });
  }

  /* ---------------- Render: Ingredients tab ---------------- */
  async function renderIngredientsTab(container, openIngId){
    const { items, ingredients, itemIngredients } = await getAllData();
    const itemsById = Object.fromEntries(items.map(i => [i.id, i]));
    const usageByIngredient = {};
    itemIngredients.forEach(j => { (usageByIngredient[j.ingredientId] ||= []).push(j); });

    let list = ingredients;
    if(searchTerm){
      const q = normalize(searchTerm);
      list = list.filter(i => normalize(i.name).includes(q));
    }
    list = [...list].sort((a,b) => (usageByIngredient[b.id]?.length||0) - (usageByIngredient[a.id]?.length||0) || a.name.localeCompare(b.name));

    if(list.length === 0){
      container.innerHTML = `<div class="empty">
        <span class="display">${ingredients.length === 0 ? 'No ingredients yet' : 'No matches'}</span>
        <p>${ingredients.length === 0 ? 'Ingredients appear here once you add them to a dish.' : 'Try a different search term.'}</p>
      </div>`;
      return;
    }

    container.innerHTML = `<div class="ing-list">${list.map(ing => {
      const uses = (usageByIngredient[ing.id] || []).slice().sort((a,b) => {
        const an = itemsById[a.itemId]?.name || '', bn = itemsById[b.itemId]?.name || '';
        return an.localeCompare(bn);
      });
      const count = uses.length;
      return `<div class="ing-row${openIngId===ing.id ? ' open':''}" data-ing-id="${ing.id}">
        <div class="ing-row-top">
          <span class="ing-name">${escapeHtml(ing.name)}</span>
          <span class="ing-count">${count} ${count===1?'dish':'dishes'} ${count>1 ? tallySVG(count) : ''}</span>
        </div>
        <div class="ing-uses"><ul>
          ${uses.map(j => {
            const it = itemsById[j.itemId];
            const qtyStr = [j.quantity, j.unit].filter(Boolean).join(' ');
            return `<li><span>${escapeHtml(it ? it.name : 'Unknown dish')}</span>${qtyStr ? `<span class="qty">${escapeHtml(qtyStr)}</span>`:''}</li>`;
          }).join('') || '<li>Not used in any dish</li>'}
        </ul></div>
      </div>`;
    }).join('')}</div>`;

    container.querySelectorAll('.ing-row').forEach(row => {
      row.addEventListener('click', () => row.classList.toggle('open'));
    });

    if(openIngId){
      const target = container.querySelector(`.ing-row[data-ing-id="${openIngId}"]`);
      if(target){ target.scrollIntoView({behavior:'smooth', block:'center'}); }
    }
  }

  /* ---------------- Master render ---------------- */
  async function render(openIngId){
    const container = document.getElementById('main');
    if(currentTab === 'dishes') await renderDishesTab(container);
    else await renderIngredientsTab(container, openIngId);
  }

  function updateTabUI(){
    document.getElementById('tabDishes').classList.toggle('active', currentTab === 'dishes');
    document.getElementById('tabIngredients').classList.toggle('active', currentTab === 'ingredients');
  }

  /* ---------------- Import / Export ---------------- */
  async function exportData(){
    const data = await getAllData();
    const payload = {
      app: 'the-larder',
      version: 1,
      exportedAt: nowISO(),
      items: data.items,
      ingredients: data.ingredients,
      itemIngredients: data.itemIngredients
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `the-larder-export-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast('Export downloaded');
  }

  async function importData(file){
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(!data || typeof data !== 'object') throw new Error('bad format');

      const items = Array.isArray(data.items) ? data.items : [];
      const ingredients = Array.isArray(data.ingredients) ? data.ingredients : [];
      const itemIngredients = Array.isArray(data.itemIngredients) ? data.itemIngredients : [];

      // idempotent upsert keyed by id (put overwrites existing record with same primary key)
      const cleanItems = items.filter(i => i && i.id && i.name).map(i => ({
        id: i.id, name: i.name, type: i.type === 'snack' ? 'snack' : 'dish',
        notes: i.notes || '', createdAt: i.createdAt || nowISO(), updatedAt: i.updatedAt || nowISO()
      }));
      const cleanIngredients = ingredients.filter(i => i && i.id && i.name).map(i => ({
        id: i.id, name: i.name, nameKey: i.nameKey || normalize(i.name),
        createdAt: i.createdAt || nowISO(), updatedAt: i.updatedAt || nowISO()
      }));
      const cleanJoins = itemIngredients.filter(j => j && j.id && j.itemId && j.ingredientId).map(j => ({
        id: j.id, itemId: j.itemId, ingredientId: j.ingredientId,
        quantity: j.quantity || '', unit: j.unit || '',
        createdAt: j.createdAt || nowISO(), updatedAt: j.updatedAt || nowISO()
      }));

      // dedupe ingredients by nameKey against existing records to avoid duplicate ingredient rows
      for(const ing of cleanIngredients){
        const existingByKey = await db.ingredients.where('nameKey').equals(ing.nameKey).first();
        if(existingByKey && existingByKey.id !== ing.id){
          // remap any incoming joins pointing at the duplicate id to the existing one
          cleanJoins.forEach(j => { if(j.ingredientId === ing.id) j.ingredientId = existingByKey.id; });
          continue; // skip inserting the duplicate ingredient record
        }
        await db.ingredients.put(ing);
      }
      await db.items.bulkPut(cleanItems);
      await db.itemIngredients.bulkPut(cleanJoins);

      toast(`Imported ${cleanItems.length} dish(es), ${cleanIngredients.length} ingredient(s)`);
      closeIo();
      render();
    }catch(err){
      console.error(err);
      toast('Import failed — check the file format');
    }
  }

  function openIo(){ document.getElementById('ioOverlay').classList.add('show'); }
  function closeIo(){ document.getElementById('ioOverlay').classList.remove('show'); }

  /* ---------------- Wire up events ---------------- */
  document.getElementById('tabDishes').addEventListener('click', () => { currentTab='dishes'; updateTabUI(); render(); });
  document.getElementById('tabIngredients').addEventListener('click', () => { currentTab='ingredients'; updateTabUI(); render(); });
  document.getElementById('searchInput').addEventListener('input', e => { searchTerm = e.target.value; render(); });

  document.getElementById('fabAdd').addEventListener('click', () => openDishModal(null));
  document.getElementById('cancelDishBtn').addEventListener('click', closeDishModal);
  document.getElementById('saveDishBtn').addEventListener('click', saveDish);
  document.getElementById('addIngRowBtn').addEventListener('click', () => addIngRow());
  document.querySelectorAll('.segmented button').forEach(b => b.addEventListener('click', () => setSegmented(b.dataset.type)));

  document.getElementById('confirmCancelBtn').addEventListener('click', closeConfirm);
  document.getElementById('confirmOkBtn').addEventListener('click', () => { const fn = confirmAction; closeConfirm(); if(fn) fn(); });

  document.getElementById('ioBtn').addEventListener('click', openIo);
  document.getElementById('closeIoBtn').addEventListener('click', closeIo);
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if(file) importData(file);
    e.target.value = '';
  });

  [document.getElementById('dishOverlay'), document.getElementById('confirmOverlay'), document.getElementById('ioOverlay')].forEach(ov => {
    ov.addEventListener('click', e => { if(e.target === ov){ ov.classList.remove('show'); } });
  });

  /* ---------------- Init ---------------- */
  render();
})();
</script>
