<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food - The Larder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
<style>
  :root{
    --bg:#ffffff;
    --bg-raised:#ffffff;
    --bg-inset:#f2f4f2;
    --chalk:#1e211f;
    --chalk-dim:#585c58;
    --chalk-faint:#8a8f8a;
    --accent:#b9812e;
    --accent-dim:#f4e7c8;
    --accent-tint: rgba(185,129,46,0.12);
    --sage:#4f6a40;
    --sage-dim:#e3ead9;
    --rust:#a1454c;
    --rust-dim:#f5dcdd;
    --line: rgba(20,22,20,0.11);
    --line-strong: rgba(20,22,20,0.22);
    --on-accent: #251b06;
    --on-rust: #fdf2f2;
    --shadow: 0 8px 24px rgba(20,22,20,0.09);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:80px;
  }
  ::selection{ background:var(--accent-dim); color:var(--chalk); }

  .display{ font-family:'Kalam', cursive; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 60%, rgba(255,255,255,0.92));
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:18px 16px 14px;
  }
  .brand{
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  }
  .brand h1{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:28px;
    margin:0;
    letter-spacing:0.3px;
    color:var(--chalk);
    position:relative;
  }
  .brand .tagline{
    font-size:11px;
    color:var(--chalk-faint);
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin-top:2px;
  }
  .icon-btn{
    background:none; border:1px solid var(--line-strong); color:var(--chalk-dim);
    width:38px; height:38px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .15s, color .15s, border-color .15s;
    flex:none;
  }
  .icon-btn:hover, .icon-btn:focus-visible{ color:var(--chalk); border-color:var(--accent); outline:none; }
  .icon-btn svg{ width:18px; height:18px; }

  .toolbar{
    display:flex; gap:8px; margin-top:14px; align-items:center; flex-wrap:wrap;
  }
  .search-wrap{
    flex:1; min-width:180px; position:relative;
  }
  .search-wrap svg{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color:var(--chalk-faint); pointer-events:none;
  }
  input[type="search"], input[type="text"], input[type="number"], select, textarea{
    font-family:'Work Sans', sans-serif;
    background:var(--bg-inset);
    border:1px solid var(--line);
    color:var(--chalk);
    border-radius:9px;
    padding:9px 12px 9px 34px;
    font-size:14.5px;
    width:100%;
    transition:border-color .15s;
  }
  select{ padding-left:12px; }
  input[type="text"]:not(.search-wrap input), input[type="number"], textarea{ padding-left:12px; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--accent); }
  input::placeholder{ color:var(--chalk-faint); }

  .view-toggle{
    display:flex; background:var(--bg-inset); border:1px solid var(--line);
    border-radius:9px; padding:2px; flex:none; overflow-x:auto;
  }
  .view-toggle button{
    background:none; border:none; color:var(--chalk-faint);
    font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:7px;
    cursor:pointer; transition:background .15s, color .15s;
    font-family:'Work Sans',sans-serif; white-space:nowrap;
    display:flex; align-items:center; gap:5px;
  }
  .view-toggle button.active{ background:var(--accent-dim); color:var(--chalk); }
  .view-toggle button .badge-count{
    background:var(--accent); color:var(--on-accent); font-size:10px; padding:1px 6px; border-radius:10px; font-weight:700;
  }

  main{ padding:16px; max-width:940px; margin:0 auto; }

  /* ---------- Sub-filter bar ---------- */
  .filter-bar{
    display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;
  }
  .filter-pill{
    background:var(--bg-inset); border:1px solid var(--line); color:var(--chalk-dim);
    font-size:12px; font-weight:600; padding:5px 12px; border-radius:20px;
    cursor:pointer; transition:all .15s; font-family:'Work Sans',sans-serif; white-space:nowrap;
    display:flex; align-items:center; gap:5px;
  }
  .filter-pill:hover{ border-color:var(--line-strong); color:var(--chalk); }
  .filter-pill.active{ background:var(--chalk); color:var(--bg); border-color:var(--chalk); }

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center; padding:56px 20px; color:var(--chalk-faint);
  }
  .empty .display{ font-size:22px; color:var(--chalk-dim); display:block; margin-bottom:6px;}
  .empty p{ font-size:13.5px; margin:0; }

  /* ---------- Dish table ---------- */
  table.dishes{
    width:100%;
    border-collapse:separate;
    border-spacing:0 6px;
  }
  table.dishes thead th{
    text-align:left;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:1.1px;
    color:var(--chalk-faint);
    font-weight:700;
    padding:4px 14px 10px;
    border-bottom:2px solid var(--line);
    white-space:nowrap;
  }
  table.dishes thead th:not(:last-child){
    border-right:1px solid var(--line);
  }
  table.dishes tbody tr{
    background:var(--bg-raised);
    transition:background .15s;
  }
  table.dishes tbody tr:hover{
    background:var(--bg-inset);
  }
  /* Row outline via td borders */
  table.dishes tbody td{
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  table.dishes tbody td:first-child{
    border-left:1px solid var(--line);
  }
  table.dishes tbody td:last-child{
    border-right:1px solid var(--line);
  }
  /* Planned rows: amber border on all sides, no inner column dividers */
  table.dishes tbody tr.is-planned{
    background:rgba(185,129,46,0.04);
  }
  table.dishes tbody tr.is-planned td{
    border-top:1.5px solid var(--accent);
    border-bottom:1.5px solid var(--accent);
    border-right:none;
  }
  table.dishes tbody tr.is-planned td:first-child{
    border-left:1.5px solid var(--accent);
  }
  table.dishes tbody tr.is-planned td:last-child{
    border-right:1.5px solid var(--accent);
  }
  table.dishes td{
    padding:13px 14px;
    vertical-align:top;
  }
  table.dishes td:not(:last-child){
    border-right:1px solid var(--line);
  }
  table.dishes tbody tr td:first-child{ border-radius:10px 0 0 10px; }
  table.dishes tbody tr td:last-child{ border-radius:0 10px 10px 0; }

  .dish-title-wrap{ display:flex; flex-direction:column; gap:4px; }
  .dish-name{ font-weight:600; font-size:15px; color:var(--chalk); line-height:1.3; }
  .dish-pills{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .dish-last-cooked{ font-size:11.5px; color:var(--chalk-faint); margin-top:2px; }

  /* Collapsible ingredients cell */
  .ing-cell{ cursor:pointer; }
  .ing-cell-collapsed{
    display:flex; align-items:center; gap:8px;
  }
  .ing-cell-expanded{ display:none; margin-top:8px; }
  .dish-row.expanded .ing-cell-collapsed{ margin-bottom:0; }
  .dish-row.expanded .ing-cell-expanded{ display:block; }
  .ing-count-pill{
    display:inline-flex; align-items:center;
    background:var(--bg-inset); border:1px solid var(--line);
    color:var(--chalk-dim); font-size:12px; font-weight:600;
    padding:3px 10px; border-radius:20px;
  }
  .dish-row.expanded .ing-count-pill{
    background:var(--chalk); color:var(--bg); border-color:var(--chalk);
  }
  .expand-chevron{
    width:14px; height:14px; color:var(--chalk-faint);
    transition:transform .2s; flex:none;
  }
  .dish-row.expanded .expand-chevron{ transform:rotate(180deg); }

  /* On mobile, always show the expanded view — no toggle */
  @media (max-width: 640px){
    .ing-cell{ cursor:default; }
    .ing-cell-collapsed{ display:none; }
    .ing-cell-expanded{ display:block !important; margin-top:0; }
    .expand-chevron{ display:none; }
  }
  .dish-type{
    display:inline-block; font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.8px; padding:2px 7px; border-radius:20px; font-weight:600;
  }
  .dish-type.dish{ background:rgba(139,160,119,0.18); color:var(--sage); }
  .dish-type.snack{ background:rgba(217,164,65,0.18); color:var(--accent); }

  .planned-badge{
    display:inline-flex; align-items:center; gap:4px;
    background:var(--accent-dim); color:var(--on-accent);
    font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:12px;
    letter-spacing:0.3px; text-transform:uppercase;
  }
  .planned-badge svg{ width:11px; height:11px; }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--bg-inset);
    border:1px solid var(--line-strong);
    color:var(--chalk-dim);
    font-size:12px;
    padding:4px 9px;
    border-radius:14px 4px 14px 4px;
    white-space:nowrap;
    cursor:pointer;
  }
  .chip:hover{ border-color:var(--sage); color:var(--chalk); }
  .chip .qty{ color:var(--chalk-faint); font-family:'IBM Plex Mono', monospace; font-size:10.5px; }
  .chip.shared{ border-color:var(--accent-dim); }
  .chip .tally{ display:inline-flex; align-items:flex-end; gap:1.5px; height:9px; margin-left:1px; }
  .chip .tally i{ display:block; width:1.5px; height:9px; background:var(--accent); transform:rotate(8deg); }
  .chip .tally i.diag{ width:11px; height:1.5px; transform:rotate(-35deg) translate(1px,3px); }

  /* stock pills on chips */
  .stock-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .stock-dot.in_stock{ background:var(--sage); }
  .stock-dot.low{ background:var(--accent); }
  .stock-dot.out{ background:var(--rust); }

  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }
  .row-actions button{
    background:none; border:1px solid var(--line); color:var(--chalk-faint);
    width:32px; height:32px; border-radius:7px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .row-actions button:hover{ color:var(--chalk); border-color:var(--line-strong); }
  .row-actions button.plan-btn.active{
    background:var(--accent-dim); color:var(--chalk); border-color:var(--accent);
  }
  .row-actions button.danger:hover{ color:var(--rust); border-color:var(--rust-dim); }
  .row-actions svg{ width:15px; height:15px; }

  /* mobile card-ified table */
  @media (max-width: 640px){
    table.dishes{ border-spacing:0; }
    table.dishes thead{ display:none; }
    table.dishes, table.dishes tbody, table.dishes tbody tr, table.dishes td{ display:block; width:100%; }
    table.dishes tbody tr{ padding:18px 14px 16px; border-radius:10px; margin-bottom:14px; }
    table.dishes td{ border:none !important; padding:0; }
    table.dishes td + td{ margin-top:14px; }
    table.dishes td[data-label]::before{
      content: attr(data-label);
      display:block; font-size:10px; text-transform:uppercase; letter-spacing:1px;
      color:var(--chalk-faint); margin-bottom:4px; font-weight:600;
    }
    .row-actions{ justify-content:flex-start; margin-top:2px; }
  }

  /* ---------- Ingredients / Pantry View ---------- */
  .ing-list{ display:flex; flex-direction:column; gap:8px; }
  .ing-row{
    background:var(--bg-raised); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; transition:all .15s ease;
  }
  .ing-row.is-draggable{ cursor:grab; }
  .ing-row.is-draggable:active{ cursor:grabbing; }
  .ing-row.dragging{ opacity:0.4; transform:scale(0.98); }
  .drag-handle{ color:var(--chalk-faint); margin-right:4px; font-weight:bold; cursor:grab; user-select:none; font-size:14px; }
  .tag-group{ border:2px dashed transparent; border-radius:12px; padding:4px; transition:all .15s ease; }
  .tag-group.drag-over{ border-color:var(--accent); background:var(--accent-dim); }
  .ing-row-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .ing-info{ display:flex; align-items:center; gap:8px; }
  .ing-name{ font-weight:600; font-size:14.5px; }

  /* Stock Status Selector Buttons */
  .stock-toggle-group{
    display:inline-flex; background:var(--bg-inset); border:1px solid var(--line);
    border-radius:8px; padding:2px; gap:2px; flex:none;
  }
  .stock-toggle-btn{
    background:none; border:none; color:var(--chalk-faint);
    font-size:11px; font-weight:600; padding:4px 8px; border-radius:6px;
    cursor:pointer; transition:all .15s; font-family:'Work Sans',sans-serif;
  }
  .stock-toggle-btn.active.in_stock{ background:var(--sage-dim); color:var(--sage); font-weight:700; }
  .stock-toggle-btn.active.low{ background:var(--accent-dim); color:var(--accent); font-weight:700; }
  .stock-toggle-btn.active.out{ background:var(--rust-dim); color:var(--rust); font-weight:700; }

  /* ---------- Pantry View ---------- */
  .grocery-stats{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin-bottom:16px;
  }
  .stat-card{
    background:var(--bg-raised); border:1px solid var(--line); border-radius:10px; padding:12px;
    text-align:center;
  }
  .stat-card .num{ font-family:'Kalam', cursive; font-size:24px; font-weight:700; color:var(--chalk); line-height:1; }
  .stat-card .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--chalk-faint); margin-top:4px; font-weight:600; }
  .stat-card.highlight-buy .num{ color:var(--rust); }
  .stat-card.highlight-plan .num{ color:var(--accent); }
  .stat-card.highlight-stock .num{ color:var(--sage); }

  .grocery-section{
    background:var(--bg-raised); border:1px solid var(--line); border-radius:12px;
    padding:16px; margin-bottom:16px;
  }
  .grocery-section-title{
    font-family:'Kalam', cursive; font-size:19px; font-weight:700; margin:0 0 12px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .grocery-section-title .count-badge{
    font-family:'Work Sans', sans-serif; font-size:12px; font-weight:600;
    background:var(--bg-inset); color:var(--chalk-dim); padding:2px 8px; border-radius:12px;
  }

  /* Planned meals horizontal strip */
  .planned-strip{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .planned-chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--accent-dim); border:1px solid var(--accent); color:var(--chalk);
    font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:20px;
  }
  .planned-chip button{
    background:none; border:none; color:var(--chalk-dim); cursor:pointer; padding:0;
    display:flex; align-items:center; font-size:14px; line-height:1;
  }
  .planned-chip button:hover{ color:var(--rust); }

  /* Grocery shopping list items */
  .buy-list{ display:flex; flex-direction:column; gap:8px; }
  .buy-item-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--bg-inset); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; transition:all .15s;
  }
  .buy-item-row.is-bought{
    opacity:0.55; background:var(--bg); border-style:dashed;
  }
  .buy-item-left{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .buy-item-check{
    width:22px; height:22px; border-radius:6px; border:1.8px solid var(--line-strong);
    background:var(--bg-raised); cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:transparent; flex:none; transition:all .15s;
  }
  .buy-item-row.is-bought .buy-item-check{
    background:var(--sage); border-color:var(--sage); color:#fff;
  }
  .buy-item-check svg{ width:14px; height:14px; stroke-width:3; }
  .buy-item-details{ flex:1; min-width:0; }
  .buy-item-name{ font-weight:600; font-size:14.5px; color:var(--chalk); }
  .buy-item-row.is-bought .buy-item-name{ text-decoration:line-through; }
  .buy-item-meta{ font-size:12px; color:var(--chalk-faint); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .buy-item-meta .needed-for{ color:var(--accent); font-weight:500; }

  .add-custom-buy{ display:flex; gap:8px; margin-top:12px; }
  .add-custom-buy input{ flex:1; }

  /* Pantry inventory list */
  .pantry-grid{ display:flex; flex-direction:column; gap:8px; }
  .pantry-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--bg-inset); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; flex-wrap:wrap;
  }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:18px; bottom:22px; z-index:25;
    width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:var(--on-accent); border:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow); cursor:pointer;
    transition:transform .15s;
  }
  .fab:hover{ transform:scale(1.05); }
  .fab svg{ width:24px; height:24px; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(15,14,13,0.72);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
    backdrop-filter:blur(2px);
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--bg-raised); width:100%; max-width:560px;
    border-radius:18px 18px 0 0;
    max-height:92vh; overflow-y:auto;
    padding:20px 18px 24px;
    border-top:1px solid var(--line-strong);
    animation:slideUp .18s ease;
  }
  @media (min-width:640px){
    .overlay{ align-items:center; }
    .modal{ border-radius:16px; margin:20px; }
  }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .modal h2{ font-family:'Kalam',cursive; font-size:22px; margin:0 0 16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--chalk-faint); margin-bottom:6px; font-weight:600; }
  
  .checkbox-label{
    display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px; font-weight:500;
    user-select:none; background:var(--bg-inset); border:1px solid var(--line); padding:10px 12px; border-radius:9px;
  }
  .checkbox-label input[type="checkbox"]{ width:17px; height:17px; accent-color:var(--accent); cursor:pointer; }

  .segmented{ display:flex; gap:8px; }
  .segmented button{
    flex:1; padding:9px; border-radius:9px; border:1px solid var(--line-strong);
    background:var(--bg-inset); color:var(--chalk-dim); font-weight:600; font-size:13px;
    cursor:pointer; font-family:'Work Sans',sans-serif;
  }
  .segmented button.active.dish{ background:rgba(139,160,119,0.22); border-color:var(--sage); color:var(--sage); }
  .segmented button.active.snack{ background:rgba(217,164,65,0.22); border-color:var(--accent); color:var(--accent); }
  .segmented button.active.in_stock{ background:var(--sage-dim); border-color:var(--sage); color:var(--sage); }
  .segmented button.active.low{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .segmented button.active.out{ background:var(--rust-dim); border-color:var(--rust); color:var(--rust); }

  .ing-rows{ display:flex; flex-direction:column; gap:8px; }
  .ing-input-row{ display:grid; grid-template-columns:1fr 68px 74px 32px; gap:6px; align-items:center; }
  .ing-input-row input{ padding-left:12px; }
  .ing-input-row button{
    background:none; border:1px solid var(--line); color:var(--chalk-faint);
    height:36px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .ing-input-row button:hover{ color:var(--rust); border-color:var(--rust-dim); }
  .add-ing-btn{
    margin-top:4px; background:none; border:1px dashed var(--line-strong); color:var(--chalk-dim);
    padding:9px; border-radius:9px; cursor:pointer; font-size:13px; width:100%;
    font-family:'Work Sans',sans-serif;
  }
  .add-ing-btn:hover{ color:var(--chalk); border-color:var(--accent); }

  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .btn{
    flex:1; padding:11px; border-radius:10px; border:none; font-weight:600; font-size:14px;
    cursor:pointer; font-family:'Work Sans',sans-serif;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn.primary{ background:var(--accent); color:var(--on-accent); }
  .btn.primary:hover{ background:var(--accent); filter:brightness(1.1); }
  .btn.ghost{ background:none; border:1px solid var(--line-strong); color:var(--chalk-dim); }
  .btn.ghost:hover{ color:var(--chalk); }
  .btn.danger{ background:var(--rust); color:var(--on-rust); }

  /* ---------- Import/export sheet ---------- */
  .io-row{ display:flex; flex-direction:column; gap:10px; }
  .io-btn{
    display:flex; align-items:center; gap:12px;
    background:var(--bg-inset); border:1px solid var(--line);
    border-radius:10px; padding:13px 14px; cursor:pointer; text-align:left;
    color:var(--chalk); font-family:'Work Sans',sans-serif; font-size:14px; font-weight:500;
  }
  .io-btn:hover{ border-color:var(--accent); }
  .io-btn svg{ width:18px; height:18px; color:var(--accent); flex:none; }
  .io-btn small{ display:block; color:var(--chalk-faint); font-size:11.5px; font-weight:400; margin-top:2px; }
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--bg-raised); border:1px solid var(--line-strong); color:var(--chalk);
    padding:10px 18px; border-radius:30px; font-size:13px; z-index:60;
    box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-8px); }

  datalist{ display:none; }
  .hidden-file{ display:none; }
  .confirm-text{ font-size:13.5px; color:var(--chalk-dim); line-height:1.5; margin-bottom:4px; }
</style>

<body>

<div class="overlay" id="dishOverlay">
  <div class="modal">

    <div class="field">
      <label>Type</label>
      <div class="segmented">

        <button type="button" class="snack" data-type="snack">Snack</button>

    </div>

    <div class="field">
      <label>Ingredients</label>
      <div class="ing-rows" id="ingRows"></div>

<!-- Ingredient edit modal -->
<div class="overlay" id="ingOverlay">
  <div class="modal" style="max-width:420px;">

<!-- Import / export sheet -->
<div class="overlay" id="ioOverlay">
  <div class="modal" style="max-width:420px;">
    <h2>Import / Export</h2>
    <div class="io-row">
      <button class="io-btn" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 21V9m0 0l-4 4m4-4l4 4M5 3h14"/></svg>
        <span>Import data<small>Merge a JSON file — existing records are updated in place</small></span>

<div class="toast" id="toast"></div>
<datalist id="ingredientNames"></datalist>

<script>
(function(){
  "use strict";

  /* ---------------- DB Setup & Migration ---------------- */
  const db = new Dexie('LarderDB');
  db.version(1).stores({
    items: 'id, name, type, updatedAt',
    ingredients: 'id, &nameKey, updatedAt',
    itemIngredients: 'id, itemId, ingredientId, updatedAt'
  });
  
  db.version(2).stores({
    items: 'id, name, type, isPlanned, updatedAt',
    ingredients: 'id, &nameKey, stockStatus, updatedAt',
    itemIngredients: 'id, itemId, ingredientId, updatedAt',
    customGrocery: 'id, name, bought, updatedAt'
  }).upgrade(tx => {
    return Promise.all([
      tx.items.toCollection().modify(item => {
        if(item.isPlanned === undefined) item.isPlanned = false;
      }),
      tx.ingredients.toCollection().modify(ing => {
        if(!ing.stockStatus) ing.stockStatus = 'out';
      })
    ]);
  });

  db.version(3).stores({
    items: 'id, name, type, isPlanned, updatedAt',
    ingredients: 'id, &nameKey, stockStatus, tag, updatedAt',
    itemIngredients: 'id, itemId, ingredientId, updatedAt',
    customGrocery: 'id, name, bought, updatedAt'
  }).upgrade(tx => {
    return tx.ingredients.toCollection().modify(ing => {
      if(ing.tag === undefined) ing.tag = '';
    });
  });

  db.version(4).stores({
    items: 'id, name, type, isPlanned, lastCooked, updatedAt',
    ingredients: 'id, &nameKey, stockStatus, tag, updatedAt',
    itemIngredients: 'id, itemId, ingredientId, updatedAt',
    customGrocery: 'id, name, bought, updatedAt'
  }).upgrade(tx => {
    return tx.items.toCollection().modify(item => {
      if(item.lastCooked === undefined) item.lastCooked = '';
    });
  });

  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
    'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8);
      return v.toString(16);
    }));
  const nowISO = () => new Date().toISOString();
  const normalize = s => s.trim().toLowerCase().replace(/\s+/g,' ');

  /* ---------------- State ---------------- */
  let currentTab = 'dishes'; // 'dishes', 'ingredients', 'grocery'
  let dishFilter = 'all'; // 'all', 'planned', 'dishes', 'snacks'
  let pantryFilter = 'all'; // 'all', 'planned', 'in_stock', 'low', 'out'
  let groupByTag = true;
  const collapsedTags = new Set();
  const collapsedGroceryTags = new Set();
  const expandedDishRows = new Set();
  let searchTerm = '';
  let editingItemId = null;
  let editingIngId = null;
  let currentType = 'dish';
  let confirmAction = null;

  /* ---------------- Helpers ---------------- */
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function tallySVG(count){
    let html = '<span class="tally">';
    const full = Math.floor(count/5), rem = count % 5;
    for(let g=0; g<full; g++){
      html += '<i></i><i></i><i></i><i></i><i class="diag"></i>';
    }
    for(let i=0;i<rem;i++) html += '<i></i>';
    html += '</span>';
    return html;
  }

  /* ---------------- Data access ---------------- */
  async function getAllData(){
    const [items, ingredients, itemIngredients, customGrocery] = await Promise.all([
      db.items.toArray(),
      db.ingredients.toArray(),
      db.itemIngredients.toArray(),
      db.customGrocery ? db.customGrocery.toArray() : Promise.resolve([])
    ]);
    return { items, ingredients, itemIngredients, customGrocery };
  }

  async function findOrCreateIngredient(name){
    const key = normalize(name);
    if(!key) return null;
    let existing = await db.ingredients.where('nameKey').equals(key).first();
    if(existing) return existing;
    const rec = { id: uuid(), name: name.trim(), nameKey: key, stockStatus: 'out', createdAt: nowISO(), updatedAt: nowISO() };
    await db.ingredients.put(rec);
    return rec;
  }

  async function toggleDishPlanned(itemId, e){
    if(e) e.stopPropagation();
    const item = await db.items.get(itemId);
    if(!item) return;
    const nextState = !item.isPlanned;
    await db.items.update(itemId, { isPlanned: nextState, updatedAt: nowISO() });
    toast(nextState ? `"${item.name}" added to meal plan` : `"${item.name}" removed from plan`);
    updateHeaderBadge();
    render();
  }

  async function updateStockStatus(ingredientId, newStatus, e){
    if(e) e.stopPropagation();
    await db.ingredients.update(ingredientId, { stockStatus: newStatus, updatedAt: nowISO() });
    const ing = await db.ingredients.get(ingredientId);
    const labelMap = { in_stock: 'In Stock', low: 'Low Stock', out: 'Out of Stock' };
    toast(`${ing ? ing.name : 'Item'} marked as ${labelMap[newStatus] || newStatus}`);
    updateHeaderBadge();
    render();
  }

  async function saveDish(){
    const name = document.getElementById('dishNameInput').value.trim();
    if(!name){ toast('Give the dish a name'); return; }
    const notes = document.getElementById('dishNotesInput').value.trim();
    const isPlanned = document.getElementById('dishPlannedInput').checked;
    const lastCooked = document.getElementById('dishLastCookedInput').value || '';
    const rows = Array.from(document.querySelectorAll('.ing-input-row')).map(row => ({
      name: row.querySelector('.ing-name-input').value.trim(),
      qty: row.querySelector('.ing-qty-input').value.trim(),
      unit: row.querySelector('.ing-unit-input').value.trim()
    })).filter(r => r.name);

    const ts = nowISO();
    const itemId = editingItemId || uuid();
    const isNew = !editingItemId;

    await db.items.put({
      id: itemId, name, type: currentType, notes, isPlanned: isPlanned ? 1 : 0,
      lastCooked,
      createdAt: isNew ? ts : (await db.items.get(itemId))?.createdAt || ts,
      updatedAt: ts
    });

    const oldJoins = await db.itemIngredients.where('itemId').equals(itemId).toArray();
    await db.itemIngredients.bulkDelete(oldJoins.map(j => j.id));

    for(const row of rows){
      const ing = await findOrCreateIngredient(row.name);
      if(!ing) continue;
      await db.itemIngredients.put({
        id: uuid(), itemId, ingredientId: ing.id,
        quantity: row.qty || '', unit: row.unit || '',
        createdAt: ts, updatedAt: ts
      });
    }

    closeDishModal();
    toast(isNew ? 'Dish added' : 'Dish updated');
    updateHeaderBadge();
    render();
  }

  async function deleteDish(itemId){
    const joins = await db.itemIngredients.where('itemId').equals(itemId).toArray();
    await db.itemIngredients.bulkDelete(joins.map(j => j.id));
    await db.items.delete(itemId);
    toast('Dish deleted');
    updateHeaderBadge();
    render();
  }

  /* ---------------- Ingredient Edit / Delete ---------------- */
  async function openIngModal(ingId){
    editingIngId = ingId || null;
    document.getElementById('ingModalTitle').textContent = ingId ? 'Edit ingredient' : 'New ingredient';

    const allIngs = await db.ingredients.toArray();
    const uniqueTags = Array.from(new Set(allIngs.map(i => i.tag).filter(Boolean))).sort();
    const datalist = document.getElementById('pantryTagList');
    if(datalist){
      datalist.innerHTML = uniqueTags.map(t => `<option value="${escapeHtml(t)}">`).join('');
    }
    
    if(ingId){
      const ing = await db.ingredients.get(ingId);
      if(ing){
        document.getElementById('ingNameInput').value = ing.name;
        document.getElementById('ingTagInput').value = ing.tag || '';
        setIngStockSegmented(ing.stockStatus || 'out');
      }
    } else {
      document.getElementById('ingNameInput').value = '';
      document.getElementById('ingTagInput').value = '';
      setIngStockSegmented('out');
    }

    document.getElementById('ingOverlay').classList.add('show');
    document.getElementById('ingNameInput').focus();
  }

  function closeIngModal(){
    document.getElementById('ingOverlay').classList.remove('show');
    editingIngId = null;
  }

  function setIngStockSegmented(status){
    document.querySelectorAll('#ingStockSegmented button').forEach(b => {
      b.classList.toggle('active', b.dataset.status === status);
    });
  }

  async function saveIngredient(){
    const name = document.getElementById('ingNameInput').value.trim();
    if(!name){ toast('Provide an ingredient name'); return; }

    const tag = document.getElementById('ingTagInput').value.trim();
    const activeBtn = document.querySelector('#ingStockSegmented button.active');
    const stockStatus = activeBtn ? activeBtn.dataset.status : 'out';
    const key = normalize(name);
    const ts = nowISO();

    if(!editingIngId){
      // Creating brand new ingredient directly
      let existing = await db.ingredients.where('nameKey').equals(key).first();
      if(existing){
        await db.ingredients.update(existing.id, { stockStatus, tag, updatedAt: ts });
        toast(`Updated existing "${existing.name}"`);
      } else {
        await db.ingredients.put({
          id: uuid(), name, nameKey: key, stockStatus, tag, createdAt: ts, updatedAt: ts
        });
        toast('Ingredient added');
      }
    } else {
      // Editing existing ingredient
      const existing = await db.ingredients.where('nameKey').equals(key).first();
      if(existing && existing.id !== editingIngId){
        // Name collision: offer to merge
        openConfirm('Merge ingredients?', `An ingredient named "${existing.name}" already exists. Merge "${name}" into "${existing.name}"?`, async () => {
          const joins = await db.itemIngredients.where('ingredientId').equals(editingIngId).toArray();
          for(const j of joins){
            await db.itemIngredients.update(j.id, { ingredientId: existing.id, updatedAt: ts });
          }
          await db.ingredients.update(existing.id, { stockStatus, tag: tag || existing.tag || '', updatedAt: ts });
          await db.ingredients.delete(editingIngId);
          closeIngModal();
          toast(`Merged into "${existing.name}"`);
          updateHeaderBadge();
          render();
        });
        return;
      }

      await db.ingredients.update(editingIngId, {
        name, nameKey: key, stockStatus, tag, updatedAt: ts
      });
      toast('Ingredient updated');
    }

    closeIngModal();
    updateHeaderBadge();
    render();
  }

  async function deleteIngredient(ingId, e){
    if(e) e.stopPropagation();
    const ing = await db.ingredients.get(ingId);
    if(!ing) return;
    const joins = await db.itemIngredients.where('ingredientId').equals(ingId).toArray();
    const usageCount = joins.length;

    openConfirm('Delete ingredient?', `"${ing.name}" will be removed. ${usageCount > 0 ? `It is used in ${usageCount} dish(es).` : ''}`, async () => {
      await db.itemIngredients.bulkDelete(joins.map(j => j.id));
      await db.ingredients.delete(ingId);
      toast(`Deleted "${ing.name}"`);
      updateHeaderBadge();
      render();
    });
  }

  /* ---------------- Custom Grocery Items ---------------- */
  async function addCustomGrocery(name){
    if(!name.trim()) return;
    await db.customGrocery.put({
      id: uuid(), name: name.trim(), bought: false, updatedAt: nowISO()
    });
    toast('Added to shopping list');
    updateHeaderBadge();
    render();
  }

  async function toggleCustomGrocery(id, currentBought){
    await db.customGrocery.update(id, { bought: !currentBought, updatedAt: nowISO() });
    updateHeaderBadge();
    render();
  }

  async function deleteCustomGrocery(id){
    await db.customGrocery.delete(id);
    updateHeaderBadge();
    render();
  }

  /* ---------------- Badge counter ---------------- */
  async function updateHeaderBadge(){
    const { items, ingredients, itemIngredients, customGrocery } = await getAllData();
    const plannedItems = items.filter(i => i.isPlanned);
    const plannedItemIds = new Set(plannedItems.map(i => i.id));
    const ingById = Object.fromEntries(ingredients.map(i => [i.id, i]));
    
    const neededIngIds = new Set();
    itemIngredients.forEach(j => {
      if(plannedItemIds.has(j.itemId)){
        const ing = ingById[j.ingredientId];
        if(ing && ing.stockStatus !== 'in_stock'){
          neededIngIds.add(ing.id);
        }
      }
    });

    const customToBuy = customGrocery.filter(g => !g.bought).length;
    const totalToBuy = neededIngIds.size + customToBuy;

    const badge = document.getElementById('toBuyBadge');
    if(badge){
      badge.textContent = totalToBuy;
      badge.style.display = totalToBuy > 0 ? 'inline-block' : 'none';
    }
  }

  /* ---------------- Modal: add/edit dish ---------------- */
  function ingRowTemplate(name='', qty='', unit=''){
    const wrap = document.createElement('div');
    wrap.className = 'ing-input-row';
    wrap.innerHTML = `
      <input type="text" class="ing-name-input" list="ingredientNames" placeholder="Ingredient" value="${escapeHtml(name)}">
      <input type="text" class="ing-qty-input mono" placeholder="qty" value="${escapeHtml(qty)}">
      <input type="text" class="ing-unit-input" placeholder="unit" value="${escapeHtml(unit)}">
      <button type="button" class="remove-ing-row" aria-label="Remove ingredient">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>`;
    wrap.querySelector('.remove-ing-row').addEventListener('click', () => wrap.remove());
    return wrap;
  }

  function addIngRow(name, qty, unit){
    document.getElementById('ingRows').appendChild(ingRowTemplate(name, qty, unit));
  }

  async function openDishModal(itemId){
    editingItemId = itemId || null;
    document.getElementById('dishModalTitle').textContent = itemId ? 'Edit dish' : 'New dish';
    document.getElementById('dishNameInput').value = '';
    document.getElementById('dishNotesInput').value = '';
    document.getElementById('dishPlannedInput').checked = false;
    document.getElementById('dishLastCookedInput').value = '';
    document.getElementById('ingRows').innerHTML = '';
    currentType = 'dish';
    setSegmented('dish');

    await refreshIngredientDatalist();

    if(itemId){
      const item = await db.items.get(itemId);
      if(item){
        document.getElementById('dishNameInput').value = item.name;
        document.getElementById('dishNotesInput').value = item.notes || '';
        document.getElementById('dishPlannedInput').checked = !!item.isPlanned;
        document.getElementById('dishLastCookedInput').value = item.lastCooked || '';
        currentType = item.type || 'dish';
        setSegmented(currentType);
        const joins = await db.itemIngredients.where('itemId').equals(itemId).toArray();
        for(const j of joins){
          const ing = await db.ingredients.get(j.ingredientId);
          addIngRow(ing ? ing.name : '', j.quantity, j.unit);
        }
      }
    }
    if(document.querySelectorAll('#ingRows .ing-input-row').length === 0) addIngRow();
    document.getElementById('dishOverlay').classList.add('show');
    document.getElementById('dishNameInput').focus();
  }

  function closeDishModal(){

    editingItemId = null;
  }

  function setSegmented(type){
    currentType = type;
    document.querySelectorAll('.segmented button').forEach(b => {
      b.classList.toggle('active', b.dataset.type === type);

    list.innerHTML = ingredients.map(i => `<option value="${escapeHtml(i.name)}">`).join('');

  /* ---------------- Confirm dialog ---------------- */

    document.getElementById('confirmText').textContent = text;
    confirmAction = onConfirm;
    document.getElementById('confirmOverlay').classList.add('show');

  function closeConfirm(){

  /* ---------------- Render: Dishes tab ---------------- */
  async function renderDishesTab(container){
    const { items, ingredients, itemIngredients } = await getAllData();
    const ingById = Object.fromEntries(ingredients.map(i => [i.id, i]));
    const usageCount = {};
    itemIngredients.forEach(j => { usageCount[j.ingredientId] = (usageCount[j.ingredientId]||0) + 1; });

    const plannedCount = items.filter(i => i.isPlanned).length;

    let filterHtml = `
      <div class="filter-bar">
        <button class="filter-pill ${dishFilter==='all'?'active':''}" data-filter="all">All (${items.length})</button>
        <button class="filter-pill ${dishFilter==='planned'?'active':''}" data-filter="planned">📋 Planned (${plannedCount})</button>
        <button class="filter-pill ${dishFilter==='dish'?'active':''}" data-filter="dish">Dishes</button>
        <button class="filter-pill ${dishFilter==='snack'?'active':''}" data-filter="snack">Snacks</button>
      </div>`;

    let filtered = items;
    if(dishFilter === 'planned') filtered = filtered.filter(i => i.isPlanned);
    else if(dishFilter === 'dish') filtered = filtered.filter(i => i.type === 'dish');
    else if(dishFilter === 'snack') filtered = filtered.filter(i => i.type === 'snack');

    if(searchTerm){
      const q = normalize(searchTerm);
      const joinsByItem = {};
      itemIngredients.forEach(j => { (joinsByItem[j.itemId] ||= []).push(j); });
      filtered = filtered.filter(item => {
        if(normalize(item.name).includes(q)) return true;
        const joins = joinsByItem[item.id] || [];
        return joins.some(j => ingById[j.ingredientId] && normalize(ingById[j.ingredientId].name).includes(q));
      });
    }
    filtered.sort((a,b) => a.name.localeCompare(b.name));

    if(filtered.length === 0){
      container.innerHTML = filterHtml + `<div class="empty">
        <span class="display">${items.length === 0 ? 'Nothing on the shelf yet' : 'No matching dishes'}</span>
        <p>${items.length === 0 ? 'Tap + to add your first dish or snack.' : 'Try changing your search or filter.'}</p>
      </div>`;
      wireDishFilterEvents(container);
      return;
    }

    const joinsByItem = {};
    itemIngredients.forEach(j => { (joinsByItem[j.itemId] ||= []).push(j); });

    const rowsHtml = filtered.map(item => {
      const joins = (joinsByItem[item.id] || []);
      const chips = joins.map(j => {
        const ing = ingById[j.ingredientId];
        if(!ing) return '';
        const count = usageCount[j.ingredientId] || 1;
        const shared = count > 1;
        const stock = ing.stockStatus || 'out';
        const qtyStr = [j.quantity, j.unit].filter(Boolean).join(' ');
        return `<span class="chip${shared ? ' shared':''}" data-ing-id="${ing.id}" title="${shared ? `Used in ${count} items` : 'Used in 1 item'} — Stock: ${stock.replace('_',' ')}">
          <span class="stock-dot ${stock}"></span>
          ${escapeHtml(ing.name)}
          ${qtyStr ? `<span class="qty">${escapeHtml(qtyStr)}</span>` : ''}
          ${shared ? tallySVG(count) : ''}
        </span>`;
      }).join('');

      const isPlanned = !!item.isPlanned;

      const isExpanded = expandedDishRows.has(item.id);
      const ingCount = joins.length;
      const lastCookedStr = item.lastCooked
        ? (() => {
            const parts = item.lastCooked.split('-').map(Number);
            if(parts.length === 3) return new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
            return item.lastCooked;
          })()
        : null;

      return `<tr data-item-id="${item.id}" class="dish-row ${isPlanned ? 'is-planned' : ''} ${isExpanded ? 'expanded' : ''}">
        <td data-label="Dish">
          <div class="dish-title-wrap">
            <span class="dish-name">${escapeHtml(item.name)}</span>
            <div class="dish-pills">
              <span class="dish-type ${item.type}">${item.type}</span>
              ${isPlanned ? `<span class="planned-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> Planned</span>` : ''}
            </div>
            ${item.notes ? `<div style="font-size:12px; color:var(--chalk-faint); margin-top:2px;">${escapeHtml(item.notes)}</div>` : ''}
          </div>
        </td>
        <td data-label="Ingredients" class="ing-cell">
          <div class="ing-cell-collapsed">
            ${ingCount > 0
              ? `<span class="ing-count-pill">${ingCount} ingredient${ingCount === 1 ? '' : 's'}</span>`
              : `<span style="color:var(--chalk-faint);font-size:12px;">None</span>`
            }
            <svg class="expand-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="ing-cell-expanded"><div class="chips">${chips || '<span style="color:var(--chalk-faint);font-size:12.5px;">No ingredients yet</span>'}</div></div>
        </td>
        <td data-label="Last Cooked">
          ${lastCookedStr ? `<span style="font-size:12.5px; color:var(--chalk-dim); font-weight:500;">🍳 ${escapeHtml(lastCookedStr)}</span>` : `<span style="font-size:12px; color:var(--chalk-faint);">Never</span>`}
        </td>
        <td data-label="Actions">
          <div class="row-actions">
            <button class="plan-btn ${isPlanned ? 'active':''}" title="${isPlanned ? 'Remove from plan':'Mark as planned meal'}" aria-label="Toggle Planned">
              <svg viewBox="0 0 24 24" fill="${isPlanned?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            </button>
            <button class="edit-btn" aria-label="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>
            <button class="delete-btn danger" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg></button>
          </div>
        </td>
      </tr>`;
    }).join('');

    container.innerHTML = filterHtml + `<table class="dishes">
      <thead><tr><th style="width:30%">Dish</th><th>Ingredients</th><th style="width:130px">Last Cooked</th><th style="width:110px">Actions</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;

    wireDishFilterEvents(container);

    container.querySelectorAll('tr[data-item-id]').forEach(tr => {
      const id = tr.dataset.itemId;
      tr.querySelector('.plan-btn').addEventListener('click', e => { e.stopPropagation(); toggleDishPlanned(id, e); });
      tr.querySelector('.edit-btn').addEventListener('click', e => { e.stopPropagation(); openDishModal(id); });
      tr.querySelector('.delete-btn').addEventListener('click', e => {
        e.stopPropagation();
        const item = items.find(i => i.id === id);
        openConfirm('Delete dish?', `"${item?.name || 'This dish'}" will be removed. Shared ingredients stay in your list.`, () => deleteDish(id));
      });
      tr.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', e => {
          e.stopPropagation();
          currentTab = 'ingredients';
          updateTabUI();
          searchTerm = '';
          document.getElementById('searchInput').value = '';
          render(chip.dataset.ingId);
        });
      });
      // Row click = toggle ingredients expand (desktop only via CSS, but state tracked for all)
      tr.addEventListener('click', e => {
        if(e.target.closest('button') || e.target.closest('.chip')) return;
        if(expandedDishRows.has(id)) expandedDishRows.delete(id);
        else expandedDishRows.add(id);
        render();
      });
    });
  }

  function wireDishFilterEvents(container){
    container.querySelectorAll('.filter-bar .filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        dishFilter = btn.dataset.filter;
        render();
      });
    });
  }

  /* ---------------- Render: Pantry Stock Tracker (Ingredients) tab ---------------- */
  async function renderIngredientsTab(container, openIngId){
    const { items, ingredients, itemIngredients } = await getAllData();
    const itemsById = Object.fromEntries(items.map(i => [i.id, i]));
    const plannedDishes = items.filter(i => i.isPlanned);
    const plannedDishIds = new Set(plannedDishes.map(i => i.id));

    const plannedDemand = {};
    const usageByIngredient = {};
    itemIngredients.forEach(j => {
      (usageByIngredient[j.ingredientId] ||= []).push(j);
      if(plannedDishIds.has(j.itemId)){
        (plannedDemand[j.ingredientId] ||= []).push({
          dishName: itemsById[j.itemId]?.name || 'Dish',
          qty: j.quantity,
          unit: j.unit
        });
      }
    });

    const totalCount = ingredients.length;
    const plannedCount = ingredients.filter(i => !!plannedDemand[i.id]).length;
    const inStockCount = ingredients.filter(i => i.stockStatus === 'in_stock').length;
    const lowCount = ingredients.filter(i => i.stockStatus === 'low').length;
    const outCount = ingredients.filter(i => (i.stockStatus || 'out') === 'out').length;

    let list = ingredients;
    if(searchTerm){
      const q = normalize(searchTerm);
      list = list.filter(i => normalize(i.name).includes(q));
    }
    if(pantryFilter === 'planned'){
      list = list.filter(i => !!plannedDemand[i.id]);
    } else if(pantryFilter !== 'all'){
      list = list.filter(i => (i.stockStatus || 'out') === pantryFilter);
    }

    list = [...list].sort((a,b) => (usageByIngredient[b.id]?.length||0) - (usageByIngredient[a.id]?.length||0) || a.name.localeCompare(b.name));

    const headerOpen = `
      <div class="grocery-section" style="margin-bottom:14px; padding:14px 16px;">
        <div class="grocery-section-title" style="margin-bottom:8px;">
          <div style="display:flex; align-items:center; gap:8px;">
            <span>📦 Pantry Stock Tracker</span>
            <span class="count-badge">${totalCount} total items</span>
          </div>
          <button class="filter-pill ${groupByTag ? 'active' : ''}" id="toggleGroupTagBtn" style="font-size:12px; height:auto; padding:4px 10px; cursor:pointer;">🏷️ Group by Tag</button>
        </div>
        <div class="filter-bar" style="margin:0 0 12px;">
          <button class="filter-pill ${pantryFilter==='all'?'active':''}" data-pfilter="all">All (${totalCount})</button>
          <button class="filter-pill ${pantryFilter==='planned'?'active':''}" data-pfilter="planned">📋 Planned (${plannedCount})</button>
          <button class="filter-pill ${pantryFilter==='in_stock'?'active':''}" data-pfilter="in_stock">In Stock (${inStockCount})</button>
          <button class="filter-pill ${pantryFilter==='low'?'active':''}" data-pfilter="low">Low Stock (${lowCount})</button>
          <button class="filter-pill ${pantryFilter==='out'?'active':''}" data-pfilter="out">Out of Stock (${outCount})</button>
        </div>`;
    const headerClose = `</div>`;

    if(list.length === 0){
      container.innerHTML = headerOpen + `
        <div class="empty" style="margin:0;">
          <span class="display">${ingredients.length === 0 ? 'No ingredients yet' : 'No matching pantry items'}</span>
          <p>${ingredients.length === 0 ? 'Click the + button to add your first pantry ingredient.' : 'Try adjusting your search or filter.'}</p>
        </div>` + headerClose;

      container.querySelectorAll('.filter-pill[data-pfilter]').forEach(btn => {
        btn.addEventListener('click', () => {
          pantryFilter = btn.dataset.pfilter;
          render();
        });
      });
      const groupBtn = container.querySelector('#toggleGroupTagBtn');
      if(groupBtn){ groupBtn.addEventListener('click', () => { groupByTag = !groupByTag; render(); }); }
      return;
    }

    function renderIngRow(ing){
      const stock = ing.stockStatus || 'out';
      const reqForPlan = plannedDemand[ing.id];

      return `<div class="ing-row ${groupByTag ? 'is-draggable' : ''}" data-ing-id="${ing.id}" ${groupByTag ? 'draggable="true"' : ''}>
        <div class="ing-row-top">
          <div class="ing-info">
            ${groupByTag ? `<span class="drag-handle" title="Drag to reorder tag">⋮⋮</span>` : ''}
            <span class="stock-dot ${stock}"></span>
            <div>
              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                <span class="ing-name">${escapeHtml(ing.name)}</span>
                ${ing.tag ? `<span class="ing-tag-chip" style="font-size:10px; font-weight:600; padding:1px 6px; border-radius:10px; background:var(--bg-inset); border:1px solid var(--line); color:var(--chalk-dim);">🏷️ ${escapeHtml(ing.tag)}</span>` : ''}
              </div>
              ${reqForPlan ? `<div style="font-size:11px; color:var(--accent); font-weight:600; margin-top:2px;">Needed for: ${escapeHtml(reqForPlan.map(d=>d.dishName).join(', '))}</div>` : ''}
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <div class="stock-toggle-group">
              <button class="stock-toggle-btn ${stock==='in_stock'?'active in_stock':''}" data-status="in_stock" title="In Stock">In Stock</button>
              <button class="stock-toggle-btn ${stock==='low'?'active low':''}" data-status="low" title="Low Stock">Low</button>
              <button class="stock-toggle-btn ${stock==='out'?'active out':''}" data-status="out" title="Out of Stock">Out</button>
            </div>
            <div class="row-actions">
              <button class="edit-ing-btn" title="Edit ingredient" aria-label="Edit ingredient">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
              </button>
              <button class="delete-ing-btn danger" title="Delete ingredient" aria-label="Delete ingredient">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>`;
    }

    if(openIngId){
      const targetIng = ingredients.find(i => i.id === openIngId);
      if(targetIng){
        const tName = targetIng.tag ? targetIng.tag.trim() : 'Untagged';
        collapsedTags.delete(tName);
      }
    }

    let itemsListHtml = '';
    if(!groupByTag){
      itemsListHtml = `<div class="ing-list">${list.map(renderIngRow).join('')}</div>`;
    } else {
      const groups = {};
      list.forEach(ing => {
        const t = ing.tag ? ing.tag.trim() : 'Untagged';
        (groups[t] ||= []).push(ing);
      });

      const sortedTagNames = Object.keys(groups).sort((a,b) => {
        if(a === 'Untagged') return 1;
        if(b === 'Untagged') return -1;
        return a.localeCompare(b);
      });

      itemsListHtml = sortedTagNames.map(tagName => {
        const itemsInGroup = groups[tagName];
        const isCollapsed = collapsedTags.has(tagName);
        return `<div class="tag-group ${isCollapsed ? 'collapsed' : ''}" data-tag="${escapeHtml(tagName)}" style="margin-bottom:14px;">
          <div class="tag-group-title" data-tag-title="${escapeHtml(tagName)}" style="font-family:'Kalam', cursive; font-size:16px; font-weight:700; color:var(--chalk); margin:10px 0 8px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px dashed var(--line); padding-bottom:4px; cursor:pointer; user-select:none;">
            <div style="display:flex; align-items:center; gap:6px;">
              <span class="chevron" style="font-size:11px; font-family:'Work Sans',sans-serif; color:var(--chalk-faint); font-weight:600; width:12px; display:inline-block;">${isCollapsed ? '▶' : '▼'}</span>
              <span>🏷️ ${escapeHtml(tagName)}</span>
            </div>
            <span style="font-family:'Work Sans',sans-serif; font-size:11px; color:var(--chalk-faint); font-weight:600;">${itemsInGroup.length} ${itemsInGroup.length===1?'item':'items'}</span>
          </div>
          <div class="ing-list" style="${isCollapsed ? 'display:none;' : ''}">${itemsInGroup.map(renderIngRow).join('')}</div>
        </div>`;
      }).join('');
    }

    container.innerHTML = headerOpen + itemsListHtml + headerClose;

    container.querySelectorAll('.filter-pill[data-pfilter]').forEach(btn => {
      btn.addEventListener('click', () => {
        pantryFilter = btn.dataset.pfilter;
        render();
      });
    });

    const groupBtn = container.querySelector('#toggleGroupTagBtn');
    if(groupBtn){
      groupBtn.addEventListener('click', () => {
        groupByTag = !groupByTag;
        render();
      });
    }

    container.querySelectorAll('.tag-group-title').forEach(title => {
      title.addEventListener('click', () => {
        const tag = title.dataset.tagTitle;
        if(collapsedTags.has(tag)) collapsedTags.delete(tag);
        else collapsedTags.add(tag);
        render();
      });
    });

    container.querySelectorAll('.ing-row').forEach(row => {
      const id = row.dataset.ingId;
      row.querySelectorAll('.stock-toggle-btn').forEach(btn => {
        btn.addEventListener('click', e => updateStockStatus(id, btn.dataset.status, e));
      });
      const editBtn = row.querySelector('.edit-ing-btn');
      if(editBtn) editBtn.addEventListener('click', e => { e.stopPropagation(); openIngModal(id); });
      const delBtn = row.querySelector('.delete-ing-btn');
      if(delBtn) delBtn.addEventListener('click', e => deleteIngredient(id, e));
    });

    if(groupByTag){
      container.querySelectorAll('.ing-row[draggable="true"]').forEach(row => {
        row.addEventListener('dragstart', e => {
          e.dataTransfer.setData('text/plain', row.dataset.ingId);
          e.dataTransfer.effectAllowed = 'move';
          row.classList.add('dragging');
        });

        row.addEventListener('dragend', () => {
          row.classList.remove('dragging');
          container.querySelectorAll('.tag-group').forEach(g => g.classList.remove('drag-over'));
        });
      });

      container.querySelectorAll('.tag-group').forEach(group => {
        group.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          group.classList.add('drag-over');
        });

        group.addEventListener('dragleave', e => {
          if(!group.contains(e.relatedTarget)){
            group.classList.remove('drag-over');
          }
        });

        group.addEventListener('drop', async e => {
          e.preventDefault();
          group.classList.remove('drag-over');
          const ingId = e.dataTransfer.getData('text/plain');
          if(!ingId) return;

          const targetTag = group.dataset.tag === 'Untagged' ? '' : group.dataset.tag;
          const ing = ingredients.find(i => i.id === ingId);

          if(ing && (ing.tag || '') !== targetTag){
            await db.ingredients.update(ingId, { tag: targetTag, updatedAt: nowISO() });
            collapsedTags.delete(group.dataset.tag);
            toast(`Moved "${ing.name}" to ${targetTag || 'Untagged'}`);
            render();
          }
        });
      });
    }

    if(openIngId){
      const target = container.querySelector(`.ing-row[data-ing-id="${openIngId}"]`);
      if(target){
        target.scrollIntoView({behavior:'smooth', block:'center'});
        target.style.borderColor = 'var(--accent)';
        setTimeout(() => { target.style.borderColor = ''; }, 2000);
      }
    }
  }

  /* ---------------- Render: Grocery Tab ---------------- */
  async function renderGroceryTab(container){
    const { items, ingredients, itemIngredients, customGrocery } = await getAllData();
    const itemsById = Object.fromEntries(items.map(i => [i.id, i]));
    const ingById = Object.fromEntries(ingredients.map(i => [i.id, i]));

    const plannedDishes = items.filter(i => i.isPlanned);
    const plannedDishIds = new Set(plannedDishes.map(i => i.id));

    const plannedDemand = {};
    itemIngredients.forEach(j => {
      if(plannedDishIds.has(j.itemId)){
        (plannedDemand[j.ingredientId] ||= []).push({
          dishName: itemsById[j.itemId]?.name || 'Dish',
          qty: j.quantity,
          unit: j.unit
        });
      }
    });

    const toBuyIngredients = [];
    const inStockIngredientsForPlan = [];

    Object.keys(plannedDemand).forEach(ingId => {
      const ing = ingById[ingId];
      if(!ing) return;
      const demandList = plannedDemand[ingId];
      const reqInfo = { ing, demandList };
      if(ing.stockStatus === 'in_stock'){
        inStockIngredientsForPlan.push(reqInfo);
      } else {
        toBuyIngredients.push(reqInfo);
      }
    });

    let activeCustomToBuy = customGrocery.filter(g => !g.bought);
    if(searchTerm){
      const q = normalize(searchTerm);
      activeCustomToBuy = activeCustomToBuy.filter(g => normalize(g.name).includes(q));
    }

    const totalToBuyCount = toBuyIngredients.length + activeCustomToBuy.length;

    const groceryGroups = {};

    toBuyIngredients.forEach(item => {
      const t = item.ing.tag ? item.ing.tag.trim() : 'Untagged';
      const dishNames = item.demandList.map(d => d.dishName).join(', ');
      const qtys = item.demandList.map(d => [d.qty, d.unit].filter(Boolean).join(' ')).filter(Boolean).join(' + ');

      (groceryGroups[t] ||= []).push({
        html: `<div class="buy-item-row" data-ing-id="${item.ing.id}">
          <div class="buy-item-left">
            <button class="buy-item-check mark-bought-btn" title="Mark as bought (adds to pantry stock)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5"/></svg>
            </button>
            <div class="buy-item-details">
              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                <span class="buy-item-name">${escapeHtml(item.ing.name)}</span>
                ${item.ing.tag ? `<span class="ing-tag-chip" style="font-size:10px; font-weight:600; padding:1px 6px; border-radius:10px; background:var(--bg-inset); border:1px solid var(--line); color:var(--chalk-dim);">🏷️ ${escapeHtml(item.ing.tag)}</span>` : ''}
              </div>
              <div class="buy-item-meta">
                <span class="needed-for">Needed for: ${escapeHtml(dishNames)}</span>
                ${qtys ? `<span class="mono">(${escapeHtml(qtys)})</span>` : ''}
                <span class="stock-pill ${item.ing.stockStatus}" style="font-size:10.5px; padding:1px 6px; border-radius:10px; font-weight:600; text-transform:capitalize;">${item.ing.stockStatus.replace('_',' ')}</span>
              </div>
            </div>
          </div>
        </div>`
      });
    });

    activeCustomToBuy.forEach(g => {
      const t = 'Extra Grocery Items';
      (groceryGroups[t] ||= []).push({
        html: `<div class="buy-item-row" data-custom-id="${g.id}">
          <div class="buy-item-left">
            <button class="buy-item-check toggle-custom-btn" title="Toggle bought">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5"/></svg>
            </button>
            <div class="buy-item-details">
              <div class="buy-item-name">${escapeHtml(g.name)}</div>
              <div class="buy-item-meta"><span>Extra item</span></div>
            </div>
          </div>
          <button class="delete-custom-btn" style="background:none; border:none; color:var(--chalk-faint); cursor:pointer;" title="Delete item">&times;</button>
        </div>`
      });
    });

    const sortedGroceryTags = Object.keys(groceryGroups).sort((a,b) => {
      if(a === 'Extra Grocery Items') return 1;
      if(b === 'Extra Grocery Items') return -1;
      if(a === 'Untagged') return 1;
      if(b === 'Untagged') return -1;
      return a.localeCompare(b);
    });

    const shoppingListItemsHtml = totalToBuyCount === 0 ? `
      <div style="text-align:center; padding:14px; color:var(--sage); font-weight:600; font-size:14px;">
        🎉 All ingredients for your planned meals are currently in stock!
      </div>` : sortedGroceryTags.map(tagName => {
        const itemsInGroup = groceryGroups[tagName];
        const isCollapsed = collapsedGroceryTags.has(tagName);
        return `<div class="grocery-tag-group ${isCollapsed ? 'collapsed' : ''}" style="margin-bottom:14px;">
          <div class="grocery-tag-title" data-grocery-tag="${escapeHtml(tagName)}" style="font-family:'Kalam', cursive; font-size:15px; font-weight:700; color:var(--chalk); margin:10px 0 6px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px dashed var(--line); padding-bottom:4px; cursor:pointer; user-select:none;">
            <div style="display:flex; align-items:center; gap:6px;">
              <span class="chevron" style="font-size:11px; font-family:'Work Sans',sans-serif; color:var(--chalk-faint); font-weight:600; width:12px; display:inline-block;">${isCollapsed ? '▶' : '▼'}</span>
              <span>🏷️ ${escapeHtml(tagName)}</span>
            </div>
            <span style="font-family:'Work Sans',sans-serif; font-size:11px; color:var(--chalk-faint); font-weight:600;">${itemsInGroup.length} ${itemsInGroup.length===1?'item':'items'}</span>
          </div>
          <div class="buy-list" style="${isCollapsed ? 'display:none;' : ''}">
            ${itemsInGroup.map(i => i.html).join('')}
          </div>
        </div>`;
      }).join('');

    const shoppingListHtml = `
      <div class="grocery-section">
        <div class="grocery-section-title">
          <span>🛒 Grocery Shopping List</span>
          <span class="count-badge">${totalToBuyCount} items needed</span>
        </div>

        ${shoppingListItemsHtml}

        <form class="add-custom-buy" id="addCustomForm">
          <input type="text" id="customBuyInput" placeholder="+ Add extra grocery item (e.g. Olive oil, Paper towels)">
          <button type="submit" class="btn primary" style="flex:none; width:auto; padding:0 16px;">Add</button>
        </form>

        ${inStockIngredientsForPlan.length > 0 ? `
          <details style="margin-top:16px; font-size:13px; color:var(--chalk-dim);">
            <summary style="cursor:pointer; font-weight:600; padding:6px 0;">✓ Already in stock for planned meals (${inStockIngredientsForPlan.length})</summary>
            <div style="display:flex; flex-direction:column; gap:6px; margin-top:8px;">
              ${inStockIngredientsForPlan.map(item => `<div style="display:flex; justify-content:space-between; background:var(--bg-inset); padding:8px 12px; border-radius:6px; font-size:12.5px;">
                <span>${escapeHtml(item.ing.name)} <small style="color:var(--chalk-faint);">(${escapeHtml(item.demandList.map(d=>d.dishName).join(', '))})</small></span>
                <span class="stock-dot in_stock" title="In Stock"></span>
              </div>`).join('')}
            </div>
          </details>` : ''}
      </div>`;

    container.innerHTML = shoppingListHtml;

    container.querySelectorAll('.grocery-tag-title').forEach(title => {
      title.addEventListener('click', () => {
        const tag = title.dataset.groceryTag;
        if(collapsedGroceryTags.has(tag)) collapsedGroceryTags.delete(tag);
        else collapsedGroceryTags.add(tag);
        render();
      });
    });

    container.querySelectorAll('[data-unplan-id]').forEach(btn => {
      btn.addEventListener('click', e => toggleDishPlanned(btn.dataset.unplan-id, e));
    });

    container.querySelectorAll('.mark-bought-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        const row = btn.closest('[data-ing-id]');
        if(row) updateStockStatus(row.dataset.ingId, 'in_stock', e);
      });
    });

    container.querySelectorAll('.toggle-custom-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = btn.closest('[data-custom-id]');
        const item = customGrocery.find(g => g.id === row.dataset.customId);
        if(item) toggleCustomGrocery(item.id, item.bought);
      });
    });

    container.querySelectorAll('.delete-custom-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = btn.closest('[data-custom-id]');
        if(row) deleteCustomGrocery(row.dataset.customId);
      });
    });

    const addForm = container.querySelector('#addCustomForm');
    if(addForm){
      addForm.addEventListener('submit', e => {
        e.preventDefault();
        const input = container.querySelector('#customBuyInput');
        if(input && input.value.trim()){
          addCustomGrocery(input.value.trim());
        }
      });
    }
  }

  /* ---------------- Master render ---------------- */
  async function render(openIngId){
    const container = document.getElementById('main');
    if(currentTab === 'dishes') await renderDishesTab(container);
    else if(currentTab === 'ingredients') await renderIngredientsTab(container, openIngId);
    else if(currentTab === 'grocery') await renderGroceryTab(container);
    await updateHeaderBadge();
  }

  function updateTabUI(){
    document.getElementById('tabDishes').classList.toggle('active', currentTab === 'dishes');
    document.getElementById('tabIngredients').classList.toggle('active', currentTab === 'ingredients');
    document.getElementById('tabGrocery').classList.toggle('active', currentTab === 'grocery');
  }

  /* ---------------- Import / Export ---------------- */
  async function exportData(){
    const data = await getAllData();
    const payload = {
      app: 'the-larder',
      version: 2,
      exportedAt: nowISO(),
      items: data.items,
      ingredients: data.ingredients,
      itemIngredients: data.itemIngredients,
      customGrocery: data.customGrocery
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `the-larder-export-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast('Export downloaded');
  }

  async function importData(file){
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(!data || typeof data !== 'object') throw new Error('bad format');

      const items = Array.isArray(data.items) ? data.items : [];
      const ingredients = Array.isArray(data.ingredients) ? data.ingredients : [];
      const itemIngredients = Array.isArray(data.itemIngredients) ? data.itemIngredients : [];
      const customGrocery = Array.isArray(data.customGrocery) ? data.customGrocery : [];

      const cleanItems = items.filter(i => i && i.id && i.name).map(i => ({
        id: i.id, name: i.name, type: i.type === 'snack' ? 'snack' : 'dish',
        isPlanned: i.isPlanned ? 1 : 0, notes: i.notes || '', createdAt: i.createdAt || nowISO(), updatedAt: i.updatedAt || nowISO()
      }));
      const cleanIngredients = ingredients.filter(i => i && i.id && i.name).map(i => ({
        id: i.id, name: i.name, nameKey: i.nameKey || normalize(i.name),
        stockStatus: i.stockStatus || 'out',
        tag: i.tag || '',
        createdAt: i.createdAt || nowISO(), updatedAt: i.updatedAt || nowISO()
      }));
      const cleanJoins = itemIngredients.filter(j => j && j.id && j.itemId && j.ingredientId).map(j => ({
        id: j.id, itemId: j.itemId, ingredientId: j.ingredientId,
        quantity: j.quantity || '', unit: j.unit || '',
        createdAt: j.createdAt || nowISO(), updatedAt: j.updatedAt || nowISO()
      }));
      const cleanCustom = customGrocery.filter(g => g && g.id && g.name).map(g => ({
        id: g.id, name: g.name, bought: !!g.bought, updatedAt: g.updatedAt || nowISO()
      }));

      for(const ing of cleanIngredients){
        const existingByKey = await db.ingredients.where('nameKey').equals(ing.nameKey).first();
        if(existingByKey && existingByKey.id !== ing.id){
          cleanJoins.forEach(j => { if(j.ingredientId === ing.id) j.ingredientId = existingByKey.id; });
          continue;
        }
        await db.ingredients.put(ing);
      }
      await db.items.bulkPut(cleanItems);
      await db.itemIngredients.bulkPut(cleanJoins);
      if(db.customGrocery && cleanCustom.length > 0) await db.customGrocery.bulkPut(cleanCustom);

      toast(`Imported ${cleanItems.length} dish(es), ${cleanIngredients.length} ingredient(s)`);
      closeIo();
      updateHeaderBadge();
      render();
    }catch(err){
      console.error(err);
      toast('Import failed — check the file format');
    }
  }

  function openIo(){ document.getElementById('ioOverlay').classList.add('show'); }
  function closeIo(){ document.getElementById('ioOverlay').classList.remove('show'); }

  /* ---------------- Wire up events ---------------- */
  document.getElementById('tabDishes').addEventListener('click', () => { currentTab='dishes'; updateTabUI(); render(); });
  document.getElementById('tabIngredients').addEventListener('click', () => { currentTab='ingredients'; updateTabUI(); render(); });
  document.getElementById('tabGrocery').addEventListener('click', () => { currentTab='grocery'; updateTabUI(); render(); });
  document.getElementById('searchInput').addEventListener('input', e => { searchTerm = e.target.value; render(); });

  document.getElementById('fabAdd').addEventListener('click', () => {
    if(currentTab === 'ingredients') openIngModal(null);
    else openDishModal(null);
  });

  document.getElementById('cancelDishBtn').addEventListener('click', closeDishModal);
  document.getElementById('saveDishBtn').addEventListener('click', saveDish);
  document.getElementById('addIngRowBtn').addEventListener('click', () => addIngRow());
  document.getElementById('dishSetTodayBtn').addEventListener('click', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dishLastCookedInput').value = today;
  });
  document.querySelectorAll('.segmented button').forEach(b => b.addEventListener('click', () => setSegmented(b.dataset.type)));

  document.getElementById('cancelIngBtn').addEventListener('click', closeIngModal);
  document.getElementById('saveIngBtn').addEventListener('click', saveIngredient);
  document.querySelectorAll('#ingStockSegmented button').forEach(b => {
    b.addEventListener('click', () => setIngStockSegmented(b.dataset.status));
  });

  document.getElementById('confirmCancelBtn').addEventListener('click', closeConfirm);
  document.getElementById('confirmOkBtn').addEventListener('click', () => { const fn = confirmAction; closeConfirm(); if(fn) fn(); });

  document.getElementById('ioBtn').addEventListener('click', openIo);
  document.getElementById('closeIoBtn').addEventListener('click', closeIo);
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if(file) importData(file);
    e.target.value = '';
  });

  [document.getElementById('dishOverlay'), document.getElementById('ingOverlay'), document.getElementById('confirmOverlay'), document.getElementById('ioOverlay')].forEach(ov => {
    ov.addEventListener('click', e => { if(e.target === ov){ ov.classList.remove('show'); } });
  });

  /* ---------------- Init ---------------- */
  updateHeaderBadge();
  render();
})();
</script>
  <script src="pwa-register.js"></script>
</body>
</html>
