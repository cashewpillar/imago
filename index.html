<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imago</title>
    <style>
        :root {
            --bg: #f7f6f2;
            --text: #1a1a18;
            --muted: #6b6b67;
            --border: rgba(0,0,0,0.09);
            --surface: #ffffff;
            --radius: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a18;
                --text: #f0efe9;
                --muted: #a0a09b;
                --border: rgba(255,255,255,0.07);
                --surface: #232321;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        main {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin-bottom: 0.75rem;
        }

        a {
            display: block;
            padding: 1rem 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--text);
            transition: transform 0.1s, border-color 0.1s;
        }

        a:hover {
            border-color: var(--text);
            transform: translateY(-1px);
        }

        .meta {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 0.25rem;
            display: block;
        }
    </style>
</head>
<body>
    <main>
        <h1>imago</h1>
        <ul>
            <li>
                <a href="story.html">
                    <span>story</span>
                    <span class="meta">vicarious motherfucker</span>
                </a>
            </li>
            <li>
                <a href="day.html">
                    <span>day</span>
                    <span class="meta">a fraction of a day</span>
                </a>
            </li>
        </ul>
    </main>
</body>
</html>
