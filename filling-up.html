<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>filling up</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --color-background-primary:#ffffff;
  --color-background-secondary:#f5f5f3;
  --color-text-primary:#1a1a18;
  --color-text-secondary:#6b6b67;
  --color-text-tertiary:#a0a09a;
  --color-border-primary:rgba(0,0,0,0.4);
  --color-border-secondary:rgba(0,0,0,0.3);
  --color-border-tertiary:rgba(0,0,0,0.15);
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --color-background-primary:#1c1c1a;
  --color-background-secondary:#252523;
  --color-text-primary:#f0efe9;
  --color-text-secondary:#9a9a94;
  --color-text-tertiary:#6b6b65;
  --color-border-primary:rgba(255,255,255,0.4);
  --color-border-secondary:rgba(255,255,255,0.3);
  --color-border-tertiary:rgba(255,255,255,0.15);
}}
body{background:var(--color-background-secondary);min-height:100vh;display:flex;justify-content:center;font-family:var(--font-sans);}
.app{max-width:400px;width:100%;background:var(--color-background-primary);min-height:100vh;padding:1.25rem 1rem 3rem;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
.hdr{margin-bottom:1rem;}
.hdr-title{font-size:17px;font-weight:500;color:var(--color-text-primary);}
.hdr-sub{font-size:12px;color:var(--color-text-tertiary);margin-top:2px;}
.day-nav{display:flex;align-items:center;gap:8px;margin-bottom:1rem;}
.nav-arrow{background:none;border:0.5px solid var(--color-border-secondary);border-radius:8px;width:32px;height:36px;cursor:pointer;font-size:15px;color:var(--color-text-secondary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-arrow:hover{background:var(--color-background-secondary);}
.nav-arrow:disabled{opacity:0.28;cursor:default;}
.nav-center{flex:1;min-width:0;}
.nav-label{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--color-background-secondary);border-radius:8px;border:0.5px solid var(--color-border-primary);}
.nav-label-main{font-size:13px;font-weight:500;color:var(--color-text-primary);}
.nav-label-date{font-size:11px;color:var(--color-text-tertiary);}
.nav-dots{display:flex;gap:4px;justify-content:center;margin-top:5px;}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--color-border-secondary);cursor:pointer;}
.nav-dot.on{background:var(--color-text-primary);}
.add-day-btn{font-size:11px;padding:4px 9px;border-radius:8px;border:0.5px dashed var(--color-border-secondary);background:transparent;color:var(--color-text-tertiary);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.add-day-btn:hover{color:var(--color-text-secondary);}
.endpoints{display:flex;align-items:center;gap:8px;margin-bottom:.9rem;}
.ep-group{display:flex;align-items:center;gap:5px;flex:1;}
.ep-lbl{font-size:12px;color:var(--color-text-tertiary);white-space:nowrap;}
.ep-btn{background:none;border:0.5px solid var(--color-border-secondary);border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:13px;color:var(--color-text-secondary);display:flex;align-items:center;justify-content:center;}
.ep-btn:hover{background:var(--color-background-secondary);}
.ep-val{font-size:12px;font-weight:500;color:var(--color-text-primary);min-width:32px;text-align:center;}
.ep-sep{font-size:12px;color:var(--color-text-tertiary);}
.stats-row{display:flex;gap:6px;margin-bottom:1rem;}
.stat{flex:1;background:var(--color-background-secondary);border-radius:8px;padding:7px 9px;}
.stat-lbl{font-size:10px;color:var(--color-text-tertiary);}
.stat-val{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-top:1px;}
.tl-outer{border-radius:10px;border:0.5px solid var(--color-border-tertiary);overflow:hidden;}
.tl-scroll{overflow-y:scroll;height:280px;position:relative;}
.tl-scroll::-webkit-scrollbar{width:3px;}
.tl-scroll::-webkit-scrollbar-thumb{background:var(--color-border-secondary);border-radius:2px;}
.timeline-wrap{display:flex;}
.time-axis{width:40px;flex-shrink:0;position:relative;}
.time-tick{position:absolute;right:6px;font-size:10px;color:var(--color-text-tertiary);transform:translateY(-50%);white-space:nowrap;pointer-events:none;line-height:1;}
.tl-col{flex:1;position:relative;background:var(--color-background-secondary);}
.hour-line{position:absolute;left:0;right:0;height:0.5px;background:var(--color-border-tertiary);pointer-events:none;}
.half-line{position:absolute;left:0;right:0;height:0.5px;background:var(--color-border-tertiary);opacity:0.35;pointer-events:none;}
.now-line{position:absolute;left:0;right:0;height:2px;z-index:20;pointer-events:none;}
.now-dot{position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;}
.now-label{position:absolute;left:6px;top:-9px;font-size:9px;font-weight:500;line-height:1;}
.block{position:absolute;left:4px;right:4px;border-radius:6px;overflow:hidden;z-index:5;}
.block-inner{position:absolute;inset:0;padding:4px 24px 4px 7px;display:flex;flex-direction:column;justify-content:center;cursor:grab;}
.block-inner:active{cursor:grabbing;}
.block-name{font-size:11px;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.block-dur{font-size:10px;line-height:1.3;opacity:0.75;}
.block-rm{position:absolute;right:3px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:11px;cursor:pointer;padding:3px;line-height:1;z-index:6;}
.rh{position:absolute;left:0;right:0;height:12px;cursor:ns-resize;z-index:7;}
.rh.top{top:0;}.rh.bot{bottom:0;}
.divider-line{height:0.5px;background:var(--color-border-tertiary);margin:1rem 0;}
.section-lbl{font-size:11px;color:var(--color-text-tertiary);letter-spacing:.04em;text-transform:uppercase;margin-bottom:.5rem;}
.tags-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:.9rem;}
.tag{font-size:12px;padding:4px 8px;border-radius:20px;border:0.5px solid var(--color-border-secondary);cursor:default;color:var(--color-text-secondary);background:transparent;display:inline-flex;align-items:center;gap:4px;line-height:1;user-select:none;}
.tag.sel{background:var(--color-background-secondary);color:var(--color-text-primary);}
.tag-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.tag-lbl{cursor:pointer;}
.tag-x{font-size:9px;color:var(--color-text-tertiary);cursor:pointer;padding:1px 2px;line-height:1;}
.tag-x:hover{color:var(--color-text-primary);}
.custom-row{display:flex;gap:6px;}
.custom-input{flex:1;font-size:13px;font-family:var(--font-sans);padding:5px 8px;border-radius:8px;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-primary);outline:none;}
.custom-input:focus{border-color:var(--color-border-primary);}
.custom-add{font-size:12px;padding:5px 11px;border-radius:8px;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;white-space:nowrap;}
.custom-add:hover{background:var(--color-background-secondary);}
</style>
</head>
<body>
<div class="app">
<h2 class="sr-only">A fraction of a day — schedule activity blocks across your waking hours</h2>
<div class="hdr">
  <div class="hdr-title">a fraction of a day</div>
  <div class="hdr-sub" id="hdr-sub"></div>
</div>
<div class="day-nav">
  <button class="nav-arrow" id="nav-prev">&#8592;</button>
  <div class="nav-center">
    <div class="nav-label">
      <span class="nav-label-main" id="nav-main"></span>
      <span class="nav-label-date" id="nav-date"></span>
    </div>
    <div class="nav-dots" id="nav-dots"></div>
  </div>
  <button class="nav-arrow" id="nav-next">&#8594;</button>
  <button class="add-day-btn" id="add-day-btn">+ day</button>
</div>
<div class="endpoints">
  <div class="ep-group">
    <span class="ep-lbl">wake</span>
    <button class="ep-btn" id="wake-dn">&#8722;</button>
    <span class="ep-val" id="wake-val"></span>
    <button class="ep-btn" id="wake-up">+</button>
  </div>
  <span class="ep-sep">&#183;</span>
  <div class="ep-group" style="justify-content:flex-end;">
    <button class="ep-btn" id="bed-dn">&#8722;</button>
    <span class="ep-val" id="bed-val"></span>
    <button class="ep-btn" id="bed-up">+</button>
    <span class="ep-lbl">sleep</span>
  </div>
</div>
<div class="stats-row">
  <div class="stat"><div class="stat-lbl">awake</div><div class="stat-val" id="st-awake">—</div></div>
  <div class="stat"><div class="stat-lbl">scheduled</div><div class="stat-val" id="st-sched">—</div></div>
  <div class="stat"><div class="stat-lbl">free</div><div class="stat-val" id="st-free">—</div></div>
</div>
<div class="tl-outer">
  <div class="tl-scroll" id="tl-scroll">
    <div class="timeline-wrap" id="tl-wrap">
      <div class="time-axis" id="time-axis"></div>
      <div class="tl-col" id="tl-col"></div>
    </div>
  </div>
</div>
<div class="divider-line"></div>
<div class="section-lbl">select then tap timeline to place</div>
<div class="tags-row" id="tags-row"></div>
<div class="custom-row">
  <input class="custom-input" id="custom-input" placeholder="new activity" maxlength="24"/>
  <button class="custom-add" onclick="addCustomTag()">+ add</button>
</div>
</div>
<script>
const PALETTE=['#7F77DD','#1D9E75','#D85A30','#378ADD','#BA7517','#D4537E','#639922','#5DCAA5','#888780','#ED93B1'];
const PRESETS=['work','focus','break','lunch','exercise','commute','personal','social','reading','rest'];
const CMAP={work:'#7F77DD',focus:'#378ADD',break:'#888780',lunch:'#1D9E75',exercise:'#D85A30',commute:'#BA7517',personal:'#5DCAA5',social:'#D4537E',reading:'#639922',rest:'#888780'};
const PX_H=56,SNAP=0.5,NOW_COL='#D85A30',SCROLL_H=280;
let allTags=[...PRESETS],selTag='work',isDragging=false;
const tday=new Date();
function fmtDate(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function prevDate(n){const x=new Date(tday);x.setDate(x.getDate()-n);return x;}
function dayLabel(i){return i===0?'today':i===1?'yesterday':i+'d ago';}
function mkDay(i){return{label:dayLabel(i),date:fmtDate(prevDate(i)),wake:6,bed:22,blocks:[]};}
function snapH(h){return Math.round(h/SNAP)*SNAP;}
function fmtH(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60),ap=hh>=12?'pm':'am',d=hh%12||12;return mm?d+':'+(mm<10?'0':'')+mm+ap:d+ap;}
function fmtDur(h){if(h<=0)return'0m';if(h<1)return Math.round(h*60)+'m';if(h%1===0)return h+'h';return Math.floor(h)+'h'+Math.round((h%1)*60)+'m';}
function tagColor(n){return CMAP[n]||(CMAP[n]=PALETTE[Object.keys(CMAP).length%PALETTE.length]);}
function nowH(){const n=new Date();return n.getHours()+n.getMinutes()/60;}
function yFor(h,d){return(h-d.wake)*PX_H;}
function hFor(y,d){return d.wake+y/PX_H;}
function tlH(d){return(d.bed-d.wake)*PX_H;}
let state=(()=>{try{const r=localStorage.getItem('daytl_v4');if(r)return JSON.parse(r);}catch(e){}return null;})();
let days,cur;
if(state&&state.days&&state.days.length){
  days=state.days;cur=state.cur||0;
  if(state.allTags)allTags=state.allTags;
  if(state.cmap)Object.assign(CMAP,state.cmap);
}else{
  days=[mkDay(0),mkDay(1)];
  days[1].blocks=[{name:'work',start:9,end:12},{name:'lunch',start:12,end:13},{name:'work',start:13,end:17},{name:'exercise',start:18,end:19}];
  cur=0;
}
function D(){return days[cur];}
function save(){try{localStorage.setItem('daytl_v4',JSON.stringify({days,cur,allTags,cmap:CMAP}));}catch(e){}}
function overlaps(blocks,start,end,skip){
  for(let i=0;i<blocks.length;i++){if(i===skip)continue;if(start<blocks[i].end-0.01&&end>blocks[i].start+0.01)return blocks[i];}
  return null;
}
function findFreeSlot(d,start,dur){
  let s=snapH(start);
  for(let t=0;t<60;t++){
    const e=snapH(s+dur);if(e>d.bed)return null;
    if(!overlaps(d.blocks,s,e,-1))return{start:s,end:e};
    const hit=overlaps(d.blocks,s,e,-1);s=snapH(hit.end);
  }
  return null;
}
function clampNoOverlap(blocks,idx,ns,ne){
  const dur=ne-ns;
  let s=Math.max(D().wake,Math.min(D().bed-dur,snapH(ns)));
  let e=snapH(s+dur);
  const hit=overlaps(blocks,s,e,idx);
  if(!hit)return{start:s,end:e};
  if(ns>blocks[idx].start){s=snapH(hit.end);e=snapH(s+dur);}
  else{e=snapH(hit.start);s=snapH(e-dur);}
  s=Math.max(D().wake,s);e=Math.min(D().bed,snapH(s+dur));
  if(overlaps(blocks,s,e,idx))return{start:blocks[idx].start,end:blocks[idx].end};
  return{start:s,end:e};
}
function renderNav(){
  document.getElementById('nav-main').textContent=D().label;
  document.getElementById('nav-date').textContent=D().date;
  document.getElementById('nav-prev').disabled=cur===0;
  document.getElementById('nav-next').disabled=cur===days.length-1;
  const dots=document.getElementById('nav-dots');dots.innerHTML='';
  days.forEach((_,i)=>{const d=document.createElement('span');d.className='nav-dot'+(i===cur?' on':'');d.onclick=()=>{cur=i;save();renderAll();scrollToNow();};dots.appendChild(d);});
}
document.getElementById('nav-prev').onclick=()=>{if(cur>0){cur--;save();renderAll();scrollToNow();}};
document.getElementById('nav-next').onclick=()=>{if(cur<days.length-1){cur++;save();renderAll();scrollToNow();}};
document.getElementById('add-day-btn').onclick=()=>{days.push(mkDay(days.length));cur=days.length-1;save();renderAll();scrollToNow();};
function renderEndpoints(){
  document.getElementById('wake-val').textContent=fmtH(D().wake);
  document.getElementById('bed-val').textContent=fmtH(D().bed);
  const aw=D().bed-D().wake;
  const sc=D().blocks.reduce((s,b)=>s+(b.end-b.start),0);
  document.getElementById('st-awake').textContent=fmtDur(aw);
  document.getElementById('st-sched').textContent=fmtDur(Math.min(sc,aw));
  document.getElementById('st-free').textContent=fmtDur(Math.max(0,aw-sc));
  document.getElementById('hdr-sub').textContent=fmtH(D().wake)+' — '+fmtH(D().bed)+' · '+fmtDur(aw);
}
['wake-dn','wake-up','bed-dn','bed-up'].forEach(id=>{
  document.getElementById(id).onclick=()=>{
    const d=D();
    if(id==='wake-dn'&&d.wake>0)d.wake=snapH(d.wake-.5);
    else if(id==='wake-up'&&d.wake<d.bed-1)d.wake=snapH(d.wake+.5);
    else if(id==='bed-dn'&&d.bed>d.wake+1)d.bed=snapH(d.bed-.5);
    else if(id==='bed-up'&&d.bed<24)d.bed=snapH(d.bed+.5);
    d.blocks.forEach(b=>{b.start=Math.max(d.wake,b.start);b.end=Math.min(d.bed,b.end);if(b.end-b.start<SNAP)b.end=b.start+SNAP;});
    save();renderAll();
  };
});
function scrollToNow(){
  const sc=document.getElementById('tl-scroll');if(!sc)return;
  const nh=cur===0?nowH():(D().wake+D().bed)/2;
  const cy=yFor(Math.max(D().wake,Math.min(D().bed,nh)),D());
  sc.scrollTop=Math.max(0,cy-SCROLL_H/2);
}
function renderAxis(){
  const ax=document.getElementById('time-axis');
  ax.style.height=tlH(D())+'px';ax.innerHTML='';
  for(let t=D().wake;t<=D().bed;t++){
    const tk=document.createElement('div');tk.className='time-tick';
    tk.style.top=yFor(t,D())+'px';tk.textContent=fmtH(t);ax.appendChild(tk);
  }
}
function renderTimeline(){
  const col=document.getElementById('tl-col');
  col.style.height=tlH(D())+'px';col.innerHTML='';
  document.getElementById('tl-wrap').style.minHeight=tlH(D())+'px';
  for(let t=D().wake;t<=D().bed;t++){
    const ln=document.createElement('div');ln.className='hour-line';ln.style.top=yFor(t,D())+'px';col.appendChild(ln);
    if(t<D().bed){const hl=document.createElement('div');hl.className='half-line';hl.style.top=yFor(t+.5,D())+'px';col.appendChild(hl);}
  }
  if(cur===0){
    const nh=nowH();
    if(nh>=D().wake&&nh<=D().bed){
      const nl=document.createElement('div');nl.className='now-line';nl.style.cssText='top:'+yFor(nh,D())+'px;background:'+NOW_COL+';';
      const nd=document.createElement('div');nd.className='now-dot';nd.style.background=NOW_COL;
      const lb=document.createElement('div');lb.className='now-label';lb.style.color=NOW_COL;lb.textContent=fmtH(nh);
      nl.appendChild(nd);nl.appendChild(lb);col.appendChild(nl);
    }
  }
  D().blocks.forEach((b,i)=>buildBlock(col,b,i));
}
document.getElementById('tl-col').onclick=e=>{
  if(isDragging)return;
  const col=document.getElementById('tl-col');
  let t=e.target;while(t&&t!==col){if(t.dataset.blockIdx!==undefined)return;t=t.parentElement;}
  const rect=col.getBoundingClientRect();
  const y=e.clientY-rect.top;
  const slot=findFreeSlot(D(),snapH(hFor(y,D())),1);
  if(!slot)return;
  D().blocks.push({name:selTag,start:slot.start,end:slot.end});
  save();renderAll();
};
function buildBlock(col,b,idx){
  const color=tagColor(b.name);
  const top=yFor(b.start,D());
  const height=Math.max(18,(b.end-b.start)*PX_H);
  const el=document.createElement('div');
  el.className='block';el.dataset.blockIdx=idx;
  el.style.cssText='top:'+top+'px;height:'+height+'px;background:'+color+'25;border:1.5px solid '+color+'99;';
  const inner=document.createElement('div');inner.className='block-inner';inner.dataset.blockIdx=idx;
  const nm=document.createElement('div');nm.className='block-name';nm.style.color=color;nm.textContent=b.name;nm.dataset.blockIdx=idx;
  const dur=document.createElement('div');dur.className='block-dur';dur.style.color=color;dur.textContent=fmtDur(b.end-b.start);dur.dataset.blockIdx=idx;
  inner.appendChild(nm);inner.appendChild(dur);
  const rm=document.createElement('button');rm.className='block-rm';rm.textContent='\u2715';rm.style.color=color;
  rm.onclick=e=>{e.stopPropagation();D().blocks.splice(idx,1);save();renderAll();};
  el.appendChild(inner);el.appendChild(rm);
  const rTop=document.createElement('div');rTop.className='rh top';
  const rBot=document.createElement('div');rBot.className='rh bot';
  attachResize(rTop,'top',idx);attachResize(rBot,'bot',idx);
  el.appendChild(rTop);el.appendChild(rBot);
  attachDrag(inner,idx);col.appendChild(el);
}
function attachDrag(inner,idx){
  let sy,ss,se;
  function mv(y){
    isDragging=true;const dy=(y-sy)/PX_H,dur=se-ss;
    const{start:ns,end:ne}=clampNoOverlap(D().blocks,idx,ss+dy,ss+dy+dur);
    D().blocks[idx].start=ns;D().blocks[idx].end=ne;
    renderAxis();renderTimeline();renderEndpoints();
  }
  function end(){save();setTimeout(()=>{isDragging=false;},50);}
  inner.addEventListener('mousedown',e=>{
    if(e.button!==0)return;e.preventDefault();e.stopPropagation();
    sy=e.clientY;ss=D().blocks[idx].start;se=D().blocks[idx].end;isDragging=false;
    const mm=e2=>mv(e2.clientY);
    const mu=()=>{end();document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);};
    document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
  });
  inner.addEventListener('touchstart',e=>{
    e.preventDefault();e.stopPropagation();
    sy=e.touches[0].clientY;ss=D().blocks[idx].start;se=D().blocks[idx].end;isDragging=false;
    const tm=e2=>{e2.preventDefault();mv(e2.touches[0].clientY);};
    const tu=()=>{end();document.removeEventListener('touchmove',tm);document.removeEventListener('touchend',tu);};
    document.addEventListener('touchmove',tm,{passive:false});document.addEventListener('touchend',tu);
  },{passive:false});
}
function attachResize(handle,edge,idx){
  let sy,sv;
  function mv(y){
    isDragging=true;const dy=(y-sy)/PX_H;const blocks=D().blocks;
    if(edge==='top'){
      let ns=Math.max(D().wake,Math.min(blocks[idx].end-SNAP,snapH(sv+dy)));
      const hit=overlaps(blocks,ns,blocks[idx].end,idx);if(hit)ns=Math.max(D().wake,snapH(hit.end));
      blocks[idx].start=ns;
    }else{
      let ne=Math.min(D().bed,Math.max(blocks[idx].start+SNAP,snapH(sv+dy)));
      const hit=overlaps(blocks,blocks[idx].start,ne,idx);if(hit)ne=Math.min(D().bed,snapH(hit.start));
      blocks[idx].end=ne;
    }
    renderAxis();renderTimeline();renderEndpoints();
  }
  function end(){save();setTimeout(()=>{isDragging=false;},50);}
  handle.addEventListener('mousedown',e=>{
    e.preventDefault();e.stopPropagation();
    sy=e.clientY;sv=edge==='top'?D().blocks[idx].start:D().blocks[idx].end;isDragging=false;
    const mm=e2=>mv(e2.clientY);
    const mu=()=>{end();document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);};
    document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
  });
  handle.addEventListener('touchstart',e=>{
    e.preventDefault();e.stopPropagation();
    sy=e.touches[0].clientY;sv=edge==='top'?D().blocks[idx].start:D().blocks[idx].end;isDragging=false;
    const tm=e2=>{e2.preventDefault();mv(e2.touches[0].clientY);};
    const tu=()=>{end();document.removeEventListener('touchmove',tm);document.removeEventListener('touchend',tu);};
    document.addEventListener('touchmove',tm,{passive:false});document.addEventListener('touchend',tu);
  },{passive:false});
}
function renderTags(){
  const row=document.getElementById('tags-row');row.innerHTML='';
  allTags.forEach(p=>{
    const tag=document.createElement('span');tag.className='tag'+(p===selTag?' sel':'');
    if(p===selTag)tag.style.borderColor=tagColor(p);
    const dot=document.createElement('span');dot.className='tag-dot';dot.style.background=tagColor(p);
    const lbl=document.createElement('span');lbl.className='tag-lbl';lbl.textContent=p;
    lbl.onclick=()=>{selTag=p;renderTags();};
    const x=document.createElement('span');x.className='tag-x';x.textContent='\u2715';
    x.onclick=e=>{e.stopPropagation();allTags=allTags.filter(t=>t!==p);if(selTag===p)selTag=allTags[0]||'';save();renderTags();};
    tag.appendChild(dot);tag.appendChild(lbl);tag.appendChild(x);row.appendChild(tag);
  });
}
function addCustomTag(){
  const inp=document.getElementById('custom-input');
  const val=inp.value.trim().toLowerCase();if(!val)return;
  if(!allTags.includes(val)){allTags.push(val);if(!CMAP[val])CMAP[val]=PALETTE[Object.keys(CMAP).length%PALETTE.length];}
  selTag=val;inp.value='';save();renderTags();
}
document.getElementById('custom-input').onkeydown=e=>{if(e.key==='Enter')addCustomTag();};
function renderAll(){renderNav();renderEndpoints();renderAxis();renderTimeline();renderTags();}
renderAll();
setTimeout(scrollToNow,80);
</script>
