<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>filling up</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --color-background-primary:#ffffff;
  --color-background-secondary:#f5f5f3;
  --color-text-primary:#1a1a18;
  --color-text-secondary:#6b6b67;
  --color-text-tertiary:#a0a09a;
  --color-border-primary:rgba(0,0,0,0.4);
  --color-border-secondary:rgba(0,0,0,0.3);
  --color-border-tertiary:rgba(0,0,0,0.15);
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --border-radius-lg:12px;
}
@media(prefers-color-scheme:dark){:root{
  --color-background-primary:#1c1c1a;
  --color-background-secondary:#252523;
  --color-text-primary:#f0efe9;
  --color-text-secondary:#9a9a94;
  --color-text-tertiary:#6b6b65;
  --color-border-primary:rgba(255,255,255,0.4);
  --color-border-secondary:rgba(255,255,255,0.3);
  --color-border-tertiary:rgba(255,255,255,0.15);
}}
body{background:var(--color-background-primary);max-height:100vh;display:flex;justify-content:center;font-family:var(--font-sans);-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
input{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text;}
.app{max-width:400px;width:100%;background:var(--color-background-primary);min-height:100vh;padding:1.25rem 1rem 3rem;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
.hdr{margin-bottom:1rem;}
.hdr-title{font-size:17px;font-weight:500;color:var(--color-text-primary);}
.hdr-sub{font-size:12px;color:var(--color-text-tertiary);margin-top:2px;}
.day-nav{display:flex;align-items:center;gap:8px;margin-bottom:1rem;}
.nav-arrow{background:none;border:0.5px solid var(--color-border-secondary);border-radius:8px;width:32px;height:36px;cursor:pointer;font-size:15px;color:var(--color-text-secondary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-arrow:hover{background:var(--color-background-secondary);}
.nav-arrow:disabled{opacity:0.28;cursor:default;}
.nav-center{flex:1;min-width:0;}
.nav-label{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--color-background-secondary);border-radius:8px;border:0.5px solid var(--color-border-primary);}
.nav-label-main{font-size:13px;font-weight:500;color:var(--color-text-primary);}
.nav-label-date{font-size:11px;color:var(--color-text-tertiary);}
.nav-dots{display:flex;gap:4px;justify-content:center;margin-top:5px;}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--color-border-secondary);cursor:pointer;}
.nav-dot.on{background:var(--color-text-primary);}
.add-day-btn{font-size:11px;padding:4px 9px;border-radius:8px;border:0.5px dashed var(--color-border-secondary);background:transparent;color:var(--color-text-tertiary);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.add-day-btn:hover{color:var(--color-text-secondary);}
.endpoints{display:flex;align-items:center;gap:8px;margin-bottom:.9rem;}
.ep-group{display:flex;align-items:center;gap:5px;flex:1;}
.ep-lbl{font-size:12px;color:var(--color-text-tertiary);white-space:nowrap;}
.ep-btn{background:none;border:0.5px solid var(--color-border-secondary);border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:13px;color:var(--color-text-secondary);display:flex;align-items:center;justify-content:center;}
.ep-btn:hover{background:var(--color-background-secondary);}
.ep-val{font-size:12px;font-weight:500;color:var(--color-text-primary);min-width:56px;text-align:center;}
.ep-sep{font-size:12px;color:var(--color-text-tertiary);}
.tl-outer{border-radius:10px;border:0.5px solid var(--color-border-tertiary);overflow:hidden;}
.tl-scroll{overflow-y:scroll;height:280px;position:relative;}
.tl-scroll::-webkit-scrollbar{width:3px;}
.tl-scroll::-webkit-scrollbar-thumb{background:var(--color-border-secondary);border-radius:2px;}
.timeline-wrap{display:flex;}
.time-axis{width:40px;flex-shrink:0;position:relative;}
.time-tick{position:absolute;right:6px;font-size:10px;color:var(--color-text-tertiary);transform:translateY(-50%);white-space:nowrap;pointer-events:none;line-height:1;}
.tl-col{flex:1;position:relative;background:var(--color-background-secondary);}
.hour-line{position:absolute;left:0;right:0;height:0.5px;background:var(--color-border-tertiary);pointer-events:none;}
.half-line{position:absolute;left:0;right:0;height:0.5px;background:var(--color-border-tertiary);opacity:0.35;pointer-events:none;}
.now-line{position:absolute;left:0;right:0;height:2px;z-index:20;pointer-events:none;}
.now-dot{position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;}
.now-label{position:absolute;left:50%;top:-9px;font-size:9px;font-weight:500;line-height:1;transform:translateX(-50%);padding:0 4px;}
.summary-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--color-border-tertiary);margin-bottom:1.5rem;gap:1px;}
.summary-seg{height:100%;transition:width 0.3s ease;}
.block{position:absolute;left:4px;right:4px;border-radius:6px;overflow:hidden;z-index:5;}
.block-inner{position:absolute;inset:0;padding:4px 24px 4px 7px;display:flex;flex-direction:column;justify-content:center;touch-action:pan-y;}
.block-name{font-size:11px;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.block-dur{font-size:10px;line-height:1.3;opacity:0.75;}
.block.small .block-inner{flex-direction:row;justify-content:flex-start;align-items:center;gap:6px;}
.block.small .block-dur::before{content:'(';}.block.small .block-dur::after{content:')';}
.block-rm{position:absolute;right:3px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:11px;cursor:pointer;padding:3px;line-height:1;z-index:6;opacity:0.6;}
.block-rm:hover{opacity:1;}
.divider-line{height:0.5px;background:var(--color-border-tertiary);margin:1rem 0;}
.section-lbl{font-size:11px;color:var(--color-text-tertiary);letter-spacing:.04em;text-transform:uppercase;margin-bottom:.5rem;}
.tags-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:.9rem;}
.tag{font-size:12px;padding:4px 8px;border-radius:20px;border:0.5px solid var(--color-border-secondary);cursor:pointer;color:var(--color-text-secondary);background:transparent;display:inline-flex;align-items:center;gap:4px;line-height:1;user-select:none;}
.tag.sel{background:var(--color-background-secondary);color:var(--color-text-primary);}
.tag-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.tag-lbl{cursor:pointer;}
.tag-edit-btn{font-size:11px;color:var(--color-text-tertiary);cursor:pointer;padding:1px 2px;line-height:1;display:inline-flex;align-items:center;justify-content:center;min-width:12px;}
.tag-edit-btn:hover{color:var(--color-text-primary);}
.custom-row{display:flex;gap:6px;}
.custom-input{flex:1;font-size:13px;font-family:var(--font-sans);padding:5px 8px;border-radius:8px;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-primary);outline:none;}
.custom-input:focus{border-color:var(--color-border-primary);}
.custom-add{font-size:12px;padding:5px 11px;border-radius:8px;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;white-space:nowrap;}
.custom-add:hover{background:var(--color-background-secondary);}

/* Modal Styles */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:1000;color:var(--color-text-primary);}
.modal-backdrop.active{display:flex;}
.modal-card{width:min(100%,420px);background:var(--color-background-primary);border-radius:20px 20px 14px 14px;border:0.5px solid var(--color-border-secondary);padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 20px 40px rgba(0,0,0,0.18);font-family:var(--font-sans);}
.modal-handle{width:44px;height:5px;border-radius:999px;background:var(--color-border-tertiary);margin:0 auto 12px;}
.modal-title{font-size:13px;font-weight:600;color:var(--color-text-primary);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em;}
.modal-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px;}
.color-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;justify-content:center;}
.color-opt{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.1s;}
.color-opt.selected{border-color:var(--color-text-primary);transform:scale(1.1);}
.modal-input{width:100%;font-size:16px;font-family:var(--font-sans);padding:12px 12px;border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);outline:none;}
.modal-actions{display:flex;gap:8px;}
.modal-btn{flex:1;font-size:14px;padding:11px 12px;border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;}
.modal-btn.primary{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary);}
.modal-btn.danger{border-color:#c55a5a;color:#c55a5a;}
.settings-row{display:none;align-items:center;gap:12px;margin-bottom:1rem;font-size:11px;color:var(--color-text-tertiary);}
.settings-row.open{display:flex;}
.settings-btn{background:none;border:none;cursor:pointer;font-size:11px;color:var(--color-text-tertiary);text-decoration:underline;}
.settings-btn:hover{color:var(--color-text-primary);}
</style>
<script src="imago-export.js"></script>
</head>
<body>
<div class="app">
<h2 class="sr-only">filling up — water your day</h2>
<div class="hdr" style="display:flex;justify-content:space-between;align-items:flex-start;">
  <div>
    <div class="hdr-title">a fraction of a day</div>
    <div class="hdr-sub" id="hdr-sub"></div>
  </div>
  <button class="settings-btn" style="text-decoration:none;font-size:14px;" onclick="document.getElementById('settings-row').classList.toggle('open')">⚙️</button>
</div>
<div class="settings-row" id="settings-row">
  <span>Data:</span>
  <button class="settings-btn" onclick="ImagoExport.exportJSON('daytl_v4', 'filling-up-backup.json')">Export</button>
  <button class="settings-btn" onclick="ImagoExport.importJSON('daytl_v4')">Import</button>
</div>
<div class="day-nav">
  <button class="nav-arrow" id="nav-prev">&#8592;</button>
  <div class="nav-center">
    <div class="nav-label">
      <span class="nav-label-main" id="nav-main"></span>
      <span class="nav-label-date" id="nav-date"></span>
    </div>
    <div class="nav-dots" id="nav-dots"></div>
  </div>
  <button class="nav-arrow" id="nav-next">&#8594;</button>
  <button class="add-day-btn" id="add-day-btn">+ day</button>
</div>
<div class="endpoints">
  <div class="ep-group">
    <span class="ep-lbl">wake</span>
    <button class="ep-btn" id="wake-dn">&#8722;</button>
    <span class="ep-val" id="wake-val"></span>
    <button class="ep-btn" id="wake-up">+</button>
  </div>
  <span class="ep-sep">&#183;</span>
  <div class="ep-group" style="justify-content:flex-end;">
    <button class="ep-btn" id="bed-dn">&#8722;</button>
    <span class="ep-val" id="bed-val"></span>
    <button class="ep-btn" id="bed-up">+</button>
    <span class="ep-lbl">sleep</span>
  </div>
</div>
<div>
<div class="section-lbl">select then click and drag on timeline to place</div>
<div class="tags-row" id="tags-row"></div>
<div class="custom-row">
  <input type="text" autocomplete="off" class="custom-input" id="custom-input" placeholder="new activity" maxlength="24"/>
  <button class="custom-add" onclick="addCustomTag()">+ add</button>
</div>
<div class="divider-line"></div>
<div class="summary-bar" id="summary-bar"></div>
<div class="tl-outer">
  <div class="tl-scroll" id="tl-scroll">
    <div class="timeline-wrap" id="tl-wrap">
      <div class="time-axis" id="time-axis"></div>
      <div class="tl-col" id="tl-col"></div>
    </div>
  </div>
</div>
</div>

<div class="modal-backdrop" id="block-editor-modal" onclick="handleModalBackdrop(event)">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">edit block</div>
    <div class="modal-grid">
      <input type="text" autocomplete="off" class="modal-input" id="edit-name-input" maxlength="24" placeholder="activity name"/>
    </div>
    <div class="color-grid" id="edit-color-grid"></div>
    <div class="modal-actions">
      <button class="modal-btn danger" onclick="deleteEditedBlock()">delete</button>
      <button class="modal-btn" onclick="cancelBlockEdit()">cancel</button>
      <button class="modal-btn primary" onclick="saveBlockEdit()">save</button>
    </div>
  </div>
</div>

<script>
const PALETTE=['#7F77DD','#1D9E75','#D85A30','#378ADD','#BA7517','#D4537E','#639922','#5DCAA5','#ED93B1','#0EA5E9','#FACC15','#F59E0B','#EF4444','#F97316','#8B5CF6','#A855F7','#06B6D4','#10B981'];
const PRESETS=['work','rest','exercise','commute','personal','social','reading','rest'];
const CMAP={work:'#7F77DD',rest:'#378ADD',exercise:'#D85A30',commute:'#BA7517',personal:'#5DCAA5',social:'#D4537E',reading:'#639922'};
const PX_H=56,SNAP=0.25,NOW_COL='#D85A30',SCROLL_H=280;
let allTags=[...PRESETS],selTag='work';
let editingBlockIdx=-1, editingTagName='', modalColor='';
const tday=new Date();
function fmtDate(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function prevDate(n){const x=new Date(tday);x.setDate(x.getDate()-n);return x;}
function dayLabel(i){return i===0?'today':i===1?'yesterday':i+'d ago';}
function mkDay(i){return{label:dayLabel(i),date:fmtDate(prevDate(i)),wake:6,bed:22,blocks:[]};}
function snapH(h){return Math.round(h/SNAP)*SNAP;}
function fmtH(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60),ap=hh>=12?'pm':'am',d=hh%12||12;return mm?d+':'+(mm<10?'0':'')+mm+ap:d+ap;}
function fmtDur(h){if(h<=0)return'0m';if(h<1)return Math.round(h*60)+'m';if(h%1===0)return h+'h';return Math.floor(h)+'h'+Math.round((h%1)*60)+'m';}
function tagColor(n){return CMAP[n]||(CMAP[n]=PALETTE[Object.keys(CMAP).length%PALETTE.length]);}
function nowH(){const n=new Date();return n.getHours()+n.getMinutes()/60;}
function yFor(h,d){return(h-d.wake)*PX_H;}
function hFor(y,d){return d.wake+y/PX_H;}
function tlH(d){return(d.bed-d.wake)*PX_H;}
let state=(()=>{try{const r=localStorage.getItem('daytl_v4');if(r)return JSON.parse(r);}catch(e){}return null;})();
let days,cur;
if(state&&state.days&&state.days.length){
  days=state.days;cur=state.cur||0;
  if(state.allTags)allTags=state.allTags;
  if(state.cmap)Object.assign(CMAP,state.cmap);
  
  // Date check: insert missing days if today changed
  const todayStr = fmtDate(tday);
  if(days[0].date !== todayStr){
    const missing = [];
    for(let i=0; i<14; i++){
      const d = prevDate(i);
      const dStr = fmtDate(d);
      if(dStr === days[0].date) break;
      missing.push(mkDay(i));
    }
    if(missing.length > 0){
      days.unshift(...missing);
      if(days.length > 20) days.splice(20);
      cur = 0; // jump to today
    }
  }
  // Refresh labels
  days.forEach((d,i) => d.label = dayLabel(i));
}else{
  days=[mkDay(0),mkDay(1)];
  days[1].blocks=[{name:'work',start:9,end:12},{name:'lunch',start:12,end:13},{name:'work',start:13,end:17},{name:'exercise',start:18,end:19}];
  cur=0;
}
function D(){return days[cur];}
function save(){try{localStorage.setItem('daytl_v4',JSON.stringify({days,cur,allTags,cmap:CMAP}));}catch(e){}}
function mergeBlocks(d){
  d.blocks.sort((a,b)=>a.start-b.start);
  for(let i=0;i<d.blocks.length-1;i++){
    const b1=d.blocks[i],b2=d.blocks[i+1];
    if(b1.name===b2.name && b1.end>=b2.start-0.01){
      b1.end=Math.max(b1.end,b2.end);
      d.blocks.splice(i+1,1);i--;
    }
  }
}
function renderNav(){
  document.getElementById('nav-main').textContent=D().label;
  document.getElementById('nav-date').textContent=D().date;
  document.getElementById('nav-prev').disabled=cur===0;
  document.getElementById('nav-next').disabled=cur===days.length-1;
  const dots=document.getElementById('nav-dots');dots.innerHTML='';
  days.forEach((_,i)=>{const d=document.createElement('span');d.className='nav-dot'+(i===cur?' on':'');d.onclick=()=>{cur=i;save();renderAll();scrollToNow();};dots.appendChild(d);});
}
document.getElementById('nav-prev').onclick=()=>{if(cur>0){cur--;save();renderAll();scrollToNow();}};
document.getElementById('nav-next').onclick=()=>{if(cur<days.length-1){cur++;save();renderAll();scrollToNow();}};
document.getElementById('add-day-btn').onclick=()=>{days.push(mkDay(days.length));cur=days.length-1;save();renderAll();scrollToNow();};
function renderEndpoints(){
  const d=D();
  document.getElementById('wake-val').textContent=fmtH(d.wake);
  document.getElementById('bed-val').textContent=fmtH(d.bed);
  const aw=d.bed-d.wake;
  let sl = 24-aw;
  if(cur+1<days.length){
    const p=days[cur+1];
    sl = (24-p.bed)+d.wake;
  }
  document.getElementById('hdr-sub').textContent=`${aw}h to fill \u00b7 sleep ${sl}h`;
}
['wake-dn','wake-up','bed-dn','bed-up'].forEach(id=>{
  document.getElementById(id).onclick=()=>{
    const d=D();
    if(id==='wake-dn'&&d.wake>0)d.wake=snapH(d.wake-0.25);
    else if(id==='wake-up'&&d.wake<d.bed-1)d.wake=snapH(d.wake+0.25);
    else if(id==='bed-dn'&&d.bed>d.wake+1)d.bed=snapH(d.bed-0.25);
    else if(id==='bed-up'&&d.bed<24)d.bed=snapH(d.bed+0.25);
    d.blocks.forEach(b=>{b.start=Math.max(d.wake,b.start);b.end=Math.min(d.bed,b.end);if(b.end-b.start<SNAP)b.end=b.start+SNAP;});
    mergeBlocks(d);save();renderAll();
  };
});
function scrollToNow(){
  const sc=document.getElementById('tl-scroll');if(!sc)return;
  const nh=cur===0?nowH():(D().wake+D().bed)/2;
  const cy=yFor(Math.max(D().wake,Math.min(D().bed,nh)),D());
  sc.scrollTop=Math.max(0,cy-SCROLL_H/2);
}
function renderAxis(){
  const ax=document.getElementById('time-axis');
  ax.style.height=tlH(D())+'px';ax.innerHTML='';
  for(let t=D().wake;t<=D().bed;t++){
    const tk=document.createElement('div');tk.className='time-tick';
    tk.style.top=yFor(t,D())+'px';tk.textContent=fmtH(t);ax.appendChild(tk);
  }
}
function renderTimeline(){
  const col=document.getElementById('tl-col');
  col.style.height=tlH(D())+'px';col.innerHTML='';
  document.getElementById('tl-wrap').style.minHeight=tlH(D())+'px';
  for(let t=D().wake;t<=D().bed;t++){
    const ln=document.createElement('div');ln.className='hour-line';ln.style.top=yFor(t,D())+'px';col.appendChild(ln);
    if(t<D().bed){const hl=document.createElement('div');hl.className='half-line';hl.style.top=yFor(t+.5,D())+'px';col.appendChild(hl);}
  }
  if(cur===0){
    const nh=nowH();
    if(nh>=D().wake&&nh<=D().bed){
      const nl=document.createElement('div');nl.className='now-line';nl.style.cssText='top:'+yFor(nh,D())+'px;background:'+NOW_COL+';';
      const nd=document.createElement('div');nd.className='now-dot';nd.style.background=NOW_COL;
      const lb=document.createElement('div');lb.className='now-label';lb.style.color=NOW_COL;lb.textContent=fmtH(nh);
      nl.appendChild(nd);nl.appendChild(lb);col.appendChild(nl);
    }
  }
  D().blocks.forEach((b,i)=>buildBlock(col,b,i));
}
(function(){
  const col=document.getElementById('tl-col');
  function begin(y){
    const rect=col.getBoundingClientRect();
    const startH=snapH(hFor(y-rect.top,D()));
    let preview=document.createElement('div');
    preview.className='block';
    const color=tagColor(selTag);
    preview.style.cssText=`background:${color}25;border:1.5px dashed ${color}99;z-index:100;pointer-events:none;display:none;`;
    col.appendChild(preview);

    function mv(y2){
      const curH=snapH(hFor(y2-rect.top,D()));
      const s=Math.min(startH,curH),e=Math.max(startH,curH);
      if(e-s<SNAP){ preview.style.display='none'; }
      else {
        preview.style.display='block';
        preview.style.top=yFor(s,D())+'px';
        preview.style.height=(e-s)*PX_H+'px';
      }
    }
    function mu(y2){
      const curH=snapH(hFor(y2-rect.top,D()));
      const s=Math.min(startH,curH),e=Math.max(startH,curH);
      preview.remove();
      if(e-s<SNAP) return;

      const d=D();
      let isEraser=false;
      for(const b of d.blocks){
        if(b.name===selTag && s<b.end-0.01 && e>b.start+0.01){ isEraser=true; break; }
      }

      const nb=[];
      for(const b of d.blocks){
        if(b.end<=s+0.01 || b.start>=e-0.01){ nb.push(b); continue; }
        if(b.start<s-0.01) nb.push({name:b.name,start:b.start,end:s});
        if(b.end>e+0.01) nb.push({name:b.name,start:e,end:b.end});
      }
      if(!isEraser) nb.push({name:selTag,start:s,end:e});
      d.blocks=nb;
      mergeBlocks(d);save();renderAll();
    }
    return {mv,mu};
  }

  col.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    let t=e.target;while(t&&t!==col){if(t.classList.contains('block-rm'))return;t=t.parentElement;}
    const {mv,mu}=begin(e.clientY);
    const _mv=e2=>mv(e2.clientY);
    const _mu=e2=>{mu(e2.clientY);document.removeEventListener('mousemove',_mv);document.removeEventListener('mouseup',_mu);};
    document.addEventListener('mousemove',_mv);
    document.addEventListener('mouseup',_mu);
  });

  let pressTimer=null, creationMode=false, handlers=null, startY=0, startX=0;
  col.addEventListener('touchstart',e=>{
    let t=e.target;while(t&&t!==col){if(t.classList.contains('block-rm'))return;t=t.parentElement;}
    startX=e.touches[0].clientX; startY=e.touches[0].clientY;
    creationMode=false;
    pressTimer=setTimeout(()=>{
      creationMode=true;
      handlers=begin(startY);
      if(window.navigator.vibrate) window.navigator.vibrate(20);
    },350);
  },{passive:true});

  col.addEventListener('touchmove',e=>{
    if(!creationMode){
      const dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY;
      if(Math.abs(dx)>10 || Math.abs(dy)>10) clearTimeout(pressTimer);
      return;
    }
    if(e.cancelable) e.preventDefault();
    handlers.mv(e.touches[0].clientY);
  },{passive:false});

  col.addEventListener('touchend',e=>{
    clearTimeout(pressTimer);
    if(creationMode && handlers){
      handlers.mu(e.changedTouches[0].clientY);
      creationMode=false; handlers=null;
    }
  });
})();
function buildBlock(col,b,idx){
  const color=tagColor(b.name);
  const top=yFor(b.start,D());
  const durH=b.end-b.start;
  const height=Math.max(18,durH*PX_H);
  const el=document.createElement('div');
  el.className='block';
  if(durH<=0.5) el.classList.add('small');
  el.style.cssText='top:'+top+'px;height:'+height+'px;background:'+color+'25;border:1.5px solid '+color+'99;';
  const inner=document.createElement('div');inner.className='block-inner';
  const nm=document.createElement('div');nm.className='block-name';nm.style.color=color;nm.textContent=b.name;
  const dur=document.createElement('div');dur.className='block-dur';dur.style.color=color;dur.textContent=fmtDur(durH);
  inner.appendChild(nm);inner.appendChild(dur);
  const rm=document.createElement('button');rm.className='block-rm';rm.textContent='\u2715';rm.style.color=color;
  rm.onclick=e=>{e.stopPropagation();D().blocks.splice(idx,1);save();renderAll();};
  el.appendChild(inner);el.appendChild(rm);
  col.appendChild(el);
}
function renderTags(){
  const row=document.getElementById('tags-row');row.innerHTML='';
  allTags.forEach(p=>{
    const tag=document.createElement('span');tag.className='tag'+(p===selTag?' sel':'');
    if(p===selTag)tag.style.borderColor=tagColor(p);
    const dot=document.createElement('span');dot.className='tag-dot';dot.style.background=tagColor(p);
    const lbl=document.createElement('span');lbl.className='tag-lbl';lbl.textContent=p;
    lbl.onclick=()=>{selTag=p;renderTags();};
    const edit=document.createElement('span');edit.className='tag-edit-btn';edit.textContent='\u270e';
    edit.onclick=e=>{e.stopPropagation();startTagEdit(p);};
    tag.appendChild(dot);tag.appendChild(lbl);tag.appendChild(edit);row.appendChild(tag);
  });
}
function addCustomTag(){
  const inp=document.getElementById('custom-input');
  const val=inp.value.trim().toLowerCase();if(!val)return;
  if(!allTags.includes(val)){allTags.push(val);if(!CMAP[val])CMAP[val]=PALETTE[Object.keys(CMAP).length%PALETTE.length];}
  selTag=val;inp.value='';save();renderTags();
}
document.getElementById('custom-input').onkeydown=e=>{if(e.key==='Enter')addCustomTag();};
function renderSummary(){
  const bar=document.getElementById('summary-bar');
  const d=D(); if(!bar||!d)return;
  const totals={}; let tSched=0;
  d.blocks.forEach(b=>{
    const dur=b.end-b.start; totals[b.name]=(totals[b.name]||0)+dur; tSched+=dur;
  });
  const tAwake=d.bed-d.wake;
  bar.innerHTML='';
  Object.keys(totals).forEach(name=>{
    const seg=document.createElement('div');
    seg.className='summary-seg';
    seg.style.width=(totals[name]/tAwake*100)+'%';
    seg.style.background=tagColor(name);
    seg.title=`${name}: ${fmtDur(totals[name])}`;
    bar.appendChild(seg);
  });
}

function startBlockEdit(i){
  editingBlockIdx=i;
  editingTagName=D().blocks[i]?.name||'';
  modalColor=tagColor(editingTagName);
  renderEditor();
}
function startTagEdit(name){
  editingTagName=name;
  editingBlockIdx=D().blocks.findIndex(b=>b.name===name);
  modalColor=tagColor(editingTagName);
  renderEditor();
}
function cancelBlockEdit(){
  editingBlockIdx=-1;
  editingTagName='';
  modalColor='';
  renderEditor();
}
function renderEditor(){
  const modal=document.getElementById('block-editor-modal');
  if(!editingTagName){
    modal.classList.remove('active');
    document.body.style.overflow='';
    return;
  }
  document.getElementById('edit-name-input').value=editingTagName;
  
  const grid=document.getElementById('edit-color-grid');
  grid.innerHTML='';
  PALETTE.forEach(c=>{
    const opt=document.createElement('div');
    opt.className='color-opt'+(c===modalColor?' selected':'');
    opt.style.background=c;
    opt.onclick=()=>{modalColor=c;renderEditor();};
    grid.appendChild(opt);
  });

  modal.classList.add('active');
  document.body.style.overflow='hidden';
  setTimeout(()=>document.getElementById('edit-name-input').focus(),10);
}
function saveBlockEdit(){
  const nextName=document.getElementById('edit-name-input').value.trim().toLowerCase();
  if(!nextName)return;
  const prevName=editingTagName;
  
  if(prevName!==nextName){
    if(!allTags.includes(nextName)){
      allTags.push(nextName);
    }
    allTags=allTags.filter(t=>t!==prevName);
    if(selTag===prevName)selTag=nextName;
    days.forEach(day=>{
      day.blocks.forEach(b=>{if(b.name===prevName)b.name=nextName;});
      mergeBlocks(day);
    });
    // Migrate color to new name if it was changed or use current
    CMAP[nextName]=modalColor;
    if(prevName in CMAP) delete CMAP[prevName];
  } else {
    CMAP[nextName]=modalColor;
  }
  
  cancelBlockEdit();save();renderAll();
}
function deleteEditedBlock(){
  if(!editingTagName)return;
  const name=editingTagName;
  if(editingBlockIdx!==-1){
    D().blocks.splice(editingBlockIdx,1);
  }else{
    allTags=allTags.filter(t=>t!==name);
    if(selTag===name)selTag=allTags[0]||'';
  }
  cancelBlockEdit();save();renderAll();
}
function handleModalBackdrop(e){if(e.target===e.currentTarget)cancelBlockEdit();}
document.getElementById('edit-name-input').onkeydown=e=>{
  if(e.key==='Enter')saveBlockEdit();
  if(e.key==='Escape')cancelBlockEdit();
};

function renderAll(){renderNav();renderEndpoints();renderAxis();renderTimeline();renderSummary();renderTags();renderEditor();}
renderAll();
setTimeout(scrollToNow,80);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    renderAll();
    scrollToNow();
  }
});
</script>
