<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ulam Spiral — Prime Explorer</title>
<style>
  :root{
    --paper: #EEF1EA;
    --paper-deep: #E3E8DF;
    --grid-line: #CDD5C6;
    --ink: #1B241F;
    --ink-soft: #5B6960;
    --ink-faint: #8A968C;
    --prime: #A6321B;
    --prime-text: #FBF3EF;
    --accent: #256D63;
    --accent-soft: #DCE9E4;
    --accent-press: #1B534B;
    --line: #C4CDBD;
    --diag-ne: #7B4B94;
    --diag-se: #C08A28;
    --diag-nw: #2B7A6F;
    --diag-sw: #3A5B9E;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; margin:0; overscroll-behavior:none; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    display:flex; flex-direction:column;
    height: 100dvh; height:100vh;
    overflow:hidden;
    user-select:none;
  }

  /* ---------- HEADER / INSTRUMENT READOUT ---------- */
  header{
    padding: calc(10px + var(--safe-t)) 14px 8px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .eyebrow{
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom: 8px;
  }
  .eyebrow b{ color: var(--ink-soft); font-weight:600; }
  .readout{
    display:flex;
    gap: 8px;
  }
  .stat{
    flex:1;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    min-width:0;
  }
  .stat .lbl{
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    text-transform:uppercase;
  }
  .stat .val{
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:2px;
  }
  .stat.prime .val{ color: var(--prime); }

  /* ---------- CANVAS AREA ---------- */
  main{
    position:relative;
    flex: 1 1 auto;
    min-height: 0;
    background: var(--paper);
    touch-action: none;
  }
  canvas{ display:block; width:100%; height:100%; }

  .zoom-controls{
    position:absolute;
    right: 12px;
    bottom: 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .round-btn{
    width:42px; height:42px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(238,241,234,0.92);
    backdrop-filter: blur(3px);
    font-family: var(--font-mono);
    font-size: 20px;
    color: var(--ink);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .round-btn:active{ background: var(--accent-soft); }

  .recenter-btn{
    position:absolute;
    left: 12px;
    bottom: 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 9px 12px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: rgba(238,241,234,0.92);
    color: var(--ink-soft);
  }
  .recenter-btn:active{ background: var(--accent-soft); color:var(--accent-press); }

  .cell-info{
    position:absolute;
    top: 10px; left: 10px; right: 10px;
    background: rgba(238,241,234,0.95);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--ink);
    pointer-events:none;
    opacity:0;
    transform: translateY(-4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .cell-info.show{ opacity:1; transform:translateY(0); }
  .cell-info .tag{
    font-weight:700;
    padding: 1px 6px;
    border-radius:4px;
    margin-left:6px;
    font-size:10.5px;
    letter-spacing:0.06em;
  }
  .cell-info .tag.prime{ background: var(--prime); color: var(--prime-text); }
  .cell-info .tag.comp{ background: var(--paper-deep); color: var(--ink-soft); border:1px solid var(--line); }

  /* ---------- CONTROL PANEL ---------- */
  #panelToggle{
    flex: 0 0 auto;
    display:flex; align-items:center; justify-content:center;
    padding: 6px 0 4px;
    background: var(--paper);
    border-top: 1px solid var(--line);
  }
  #panelToggle .handle{
    width:36px; height:4px;
    border-radius:3px;
    background: var(--line);
  }
  #panelToggle span{
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--ink-faint);
    margin-left:8px;
  }

  #controls{
    flex: 0 0 auto;
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 4px 14px calc(12px + var(--safe-b));
    max-height: 62vh;
    overflow-y:auto;
    transition: max-height 0.22s ease, padding 0.22s ease, opacity 0.18s ease;
  }
  #controls.collapsed{
    max-height:0;
    padding-top:0; padding-bottom:0;
    overflow:hidden;
    opacity:0;
  }

  .field-row{
    display:flex;
    gap:10px;
    margin: 10px 0;
    align-items:center;
  }
  .field{
    flex:1;
    min-width:0;
  }
  .field label{
    display:block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--ink-faint);
    margin-bottom:4px;
  }
  input[type="number"]{
    width:100%;
    font-family: var(--font-mono);
    font-size: 15px;
    padding: 9px 10px;
    border-radius:6px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
  }
  input[type="number"]:focus, button:focus-visible, .switch:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset:1px;
  }
  input[type="range"]{
    width:100%;
    accent-color: var(--accent);
  }

  .btn{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding: 9px 12px;
    border-radius:6px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    white-space:nowrap;
  }
  .btn:active{ background: var(--accent-soft); }
  .btn.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn.primary:active{ background: var(--accent-press); }
  .btn-row{ display:flex; gap:8px; }
  .btn-row .btn{ flex:1; }

  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .toggle-row:first-of-type{ border-top:none; margin-top:4px; }
  .toggle-row .t-label{ font-size:13.5px; color: var(--ink); font-weight:600; }
  .toggle-row .t-sub{ font-size:11.5px; color: var(--ink-faint); margin-top:1px; }

  .switch{
    position:relative;
    width:44px; height:26px;
    border-radius:14px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    flex-shrink:0;
  }
  .switch::after{
    content:"";
    position:absolute;
    top:2px; left:2px;
    width:20px; height:20px;
    border-radius:50%;
    background:#fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    transition: transform 0.15s ease;
  }
  .switch.on{ background: var(--accent); border-color:var(--accent); }
  .switch.on::after{ transform: translateX(18px); }

  .legend{
    display:none;
    flex-direction:column;
    gap:6px;
    margin: 4px 0 12px;
    padding: 10px;
    background: var(--paper-deep);
    border-radius:8px;
    border: 1px solid var(--line);
  }
  .legend.show{ display:flex; }
  .legend-item{ display:flex; align-items:center; gap:8px; font-family: var(--font-mono); font-size:11.5px; color: var(--ink-soft); }
  .swatch{ width:10px; height:10px; border-radius:2px; flex-shrink:0; }

  .zoom-readout{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    min-width: 34px;
    text-align:center;
  }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
<meta name="theme-color" content="#f7f6f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="imago">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/imago-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
</head>
<body>

<header>
  <div class="eyebrow">
    <span>Ulam Spiral</span>
    <span>ring <b id="ringLbl">0</b></span>
  </div>
  <div class="readout">
    <div class="stat">
      <div class="lbl">In view</div>
      <div class="val" id="rangeLbl">1 – 1</div>
    </div>
    <div class="stat prime">
      <div class="lbl">Primes</div>
      <div class="val" id="primeCountLbl">0</div>
    </div>
    <div class="stat">
      <div class="lbl">Density</div>
      <div class="val" id="densityLbl">0%</div>
    </div>
  </div>
</header>

<main id="canvasWrap">
  <canvas id="spiral"></canvas>
  <div class="cell-info" id="cellInfo"></div>
  <button class="recenter-btn" id="recenterBtn">Center on start</button>
  <div class="zoom-controls">
    <button class="round-btn" id="zoomIn" aria-label="Zoom in">+</button>
    <button class="round-btn" id="zoomOut" aria-label="Zoom out">−</button>
  </div>
</main>

<div id="panelToggle">
  <div class="handle"></div>
  <span id="panelToggleLbl">Controls</span>
</div>

<section id="controls">

  <div class="field-row">
    <div class="field">
      <label for="startInput">Start number</label>
      <input type="number" id="startInput" min="1" max="10000000" step="1" value="1">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="eulerBtn">41 (Euler)</button>
    <button class="btn" id="randomBtn">Random</button>
    <button class="btn" id="oneBtn">1</button>
  </div>

  <div class="field-row" style="margin-top:16px;">
    <div class="field">
      <label>Zoom — cell size</label>
      <div style="display:flex; align-items:center; gap:10px;">
        <input type="range" id="zoomSlider" min="3" max="60" step="1" value="16">
        <span class="zoom-readout" id="zoomVal">16px</span>
      </div>
    </div>
  </div>

  <div class="toggle-row" id="labelsToggleRow">
    <div>
      <div class="t-label">Show numbers</div>
      <div class="t-sub">Digits appear once cells are large enough</div>
    </div>
    <div class="switch" id="labelsSwitch" role="switch" aria-checked="false" tabindex="0"></div>
  </div>

  <div class="toggle-row" id="diagToggleRow">
    <div>
      <div class="t-label">Highlight diagonals</div>
      <div class="t-sub">The 4 rays from the start number</div>
    </div>
    <div class="switch" id="diagSwitch" role="switch" aria-checked="false" tabindex="0"></div>
  </div>

  <div class="legend" id="diagLegend">
    <div class="legend-item"><span class="swatch" style="background:var(--diag-ne)"></span><span id="legNE"></span></div>
    <div class="legend-item"><span class="swatch" style="background:var(--diag-se)"></span><span id="legSE"></span></div>
    <div class="legend-item"><span class="swatch" style="background:var(--diag-nw)"></span><span id="legNW"></span></div>
    <div class="legend-item"><span class="swatch" style="background:var(--diag-sw)"></span><span id="legSW"></span></div>
  </div>

  <div class="btn-row" style="margin-top:6px;">
    <button class="btn primary" id="resetBtn">Reset view</button>
  </div>

</section>

<script>
(function(){
  "use strict";

  // ---------------- STATE ----------------
  const MIN_CELL = 3, MAX_CELL = 60;
  const state = {
    start: 1,
    originX: 0, originY: 0,   // world grid coords shown at screen center
    cellSize: 16,
    showLabels: false,
    showDiagonals: false,
    selected: null,
  };

  // ---------------- MATH ----------------
  // spiral index (1-based) at integer grid coords (0,0) = 1
  function coordToNum(x, y){
    if (x === 0 && y === 0) return 1;
    const r = Math.max(Math.abs(x), Math.abs(y));
    const base = (2*r - 1) * (2*r - 1);
    if (x === r && y > -r)      return base + y + r;
    else if (y === r)           return base + 2*r + (r - x);
    else if (x === -r)          return base + 4*r + (r - y);
    else                        return base + 6*r + (x + r);
  }

  const primeCache = new Map();
  function isPrime(n){
    if (n < 2) return false;
    const cached = primeCache.get(n);
    if (cached !== undefined) return cached;
    let result;
    if (n === 2 || n === 3) result = true;
    else if (n % 2 === 0 || n % 3 === 0) result = false;
    else {
      result = true;
      for (let i = 5; i*i <= n; i += 6){
        if (n % i === 0 || n % (i+2) === 0){ result = false; break; }
      }
    }
    if (primeCache.size > 400000) primeCache.clear();
    primeCache.set(n, result);
    return result;
  }

  function smallestFactor(n){
    if (n % 2 === 0) return 2;
    if (n % 3 === 0) return 3;
    for (let i = 5; i*i <= n; i += 6){
      if (n % i === 0) return i;
      if (n % (i+2) === 0) return i+2;
    }
    return n;
  }

  // ---------------- CANVAS SETUP ----------------
  const canvas = document.getElementById('spiral');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('canvasWrap');
  let cssW = 0, cssH = 0, dpr = 1;

  function resizeCanvas(){
    dpr = window.devicePixelRatio || 1;
    cssW = wrap.clientWidth;
    cssH = wrap.clientHeight;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    render();
  }

  function worldToScreen(x, y){
    return {
      sx: cssW/2 + (x - state.originX) * state.cellSize,
      sy: cssH/2 - (y - state.originY) * state.cellSize
    };
  }
  function screenToWorld(sx, sy){
    return {
      x: state.originX + (sx - cssW/2) / state.cellSize,
      y: state.originY - (sy - cssH/2) / state.cellSize
    };
  }

  // diagonal helpers: value formulas (k>=1), before start offset (n=1 based)
  function diagFormulaStr(a,b,c, start){
    // n = a*k^2 + b*k + c ; value = n + start - 1
    const cc = c + start - 1;
    let s = (a===1?"":a) + "k²";
    if (b !== 0) s += (b>0?" + ":" − ") + Math.abs(b) + "k";
    s += (cc>=0?" + ":" − ") + Math.abs(cc);
    return s;
  }

  function updateLegend(){
    document.getElementById('legNE').textContent = "NE  n = " + diagFormulaStr(4,-2,1,state.start);
    document.getElementById('legSE').textContent = "SE  n = " + diagFormulaStr(4, 4,1,state.start);
    document.getElementById('legNW').textContent = "NW  n = " + diagFormulaStr(4, 0,1,state.start);
    document.getElementById('legSW').textContent = "SW  n = " + diagFormulaStr(4, 2,1,state.start);
  }

  // ---------------- RENDER ----------------
  function render(){
    ctx.fillStyle = getCss('--paper');
    ctx.fillRect(0,0,cssW,cssH);

    const half = state.cellSize;
    const xmin = Math.floor(screenToWorld(0,0).x) - 1;
    const xmax = Math.ceil(screenToWorld(cssW,0).x) + 1;
    const ymin = Math.floor(screenToWorld(0,cssH).y) - 1;
    const ymax = Math.ceil(screenToWorld(0,0).y) + 1;

    // grid
    if (state.cellSize >= 7){
      ctx.strokeStyle = getCss('--grid-line');
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = xmin; x <= xmax; x++){
        const p = worldToScreen(x - 0.5, 0);
        ctx.moveTo(Math.round(p.sx)+0.5, 0);
        ctx.lineTo(Math.round(p.sx)+0.5, cssH);
      }
      for (let y = ymin; y <= ymax; y++){
        const p = worldToScreen(0, y + 0.5);
        ctx.moveTo(0, Math.round(p.sy)+0.5);
        ctx.lineTo(cssW, Math.round(p.sy)+0.5);
      }
      ctx.stroke();
    }

    const showLabels = state.showLabels && state.cellSize >= 22;
    const cs = state.cellSize;
    let primeCount = 0, cellCount = 0;
    let minVal = Infinity, maxVal = -Infinity;

    ctx.font = Math.max(8, cs*0.34) + "px " + getCss('--font-mono').trim();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let x = xmin; x <= xmax; x++){
      for (let y = ymin; y <= ymax; y++){
        const n = coordToNum(x,y);
        const value = n + state.start - 1;
        cellCount++;
        if (value < minVal) minVal = value;
        if (value > maxVal) maxVal = value;

        const { sx, sy } = worldToScreen(x,y);
        const onDiag = state.showDiagonals && x !== 0 && Math.abs(x) === Math.abs(y);
        let diagColor = null;
        if (onDiag){
          if (x>0 && y>0) diagColor = getCss('--diag-ne');
          else if (x>0 && y<0) diagColor = getCss('--diag-se');
          else if (x<0 && y>0) diagColor = getCss('--diag-nw');
          else diagColor = getCss('--diag-sw');
        }
        if (diagColor){
          ctx.fillStyle = hexAlpha(diagColor, 0.16);
          ctx.fillRect(sx-cs/2, sy-cs/2, cs, cs);
        }

        const prime = isPrime(value);
        if (prime) primeCount++;

        if (x===0 && y===0){
          ctx.strokeStyle = getCss('--ink');
          ctx.lineWidth = 1.5;
          ctx.strokeRect(sx-cs*0.38, sy-cs*0.38, cs*0.76, cs*0.76);
        }

        if (prime){
          ctx.beginPath();
          ctx.fillStyle = diagColor || getCss('--prime');
          const rad = showLabels ? cs*0.44 : Math.max(1.3, cs*0.30);
          ctx.arc(sx, sy, rad, 0, Math.PI*2);
          ctx.fill();
          if (showLabels){
            ctx.fillStyle = getCss('--prime-text');
            ctx.fillText(String(value), sx, sy+0.5);
          }
        } else if (showLabels){
          ctx.fillStyle = getCss('--ink-soft');
          ctx.fillText(String(value), sx, sy+0.5);
        } else if (cs >= 7 && !onDiag){
          ctx.fillStyle = getCss('--ink-faint');
          ctx.globalAlpha = 0.35;
          ctx.beginPath();
          ctx.arc(sx, sy, Math.max(0.6, cs*0.05), 0, Math.PI*2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }

    // selection marker
    if (state.selected){
      const { sx, sy } = worldToScreen(state.selected.x, state.selected.y);
      ctx.strokeStyle = getCss('--accent');
      ctx.lineWidth = 2;
      ctx.strokeRect(sx-cs/2+1, sy-cs/2+1, cs-2, cs-2);
    }

    // header readouts
    document.getElementById('ringLbl').textContent = Math.max(Math.abs(xmin),Math.abs(xmax),Math.abs(ymin),Math.abs(ymax));
    document.getElementById('rangeLbl').textContent = fmt(minVal) + " – " + fmt(maxVal);
    document.getElementById('primeCountLbl').textContent = fmt(primeCount);
    document.getElementById('densityLbl').textContent = cellCount ? ((primeCount/cellCount)*100).toFixed(1) + "%" : "0%";
  }

  function fmt(n){ return n.toLocaleString('en-US'); }
  function getCss(varName){ return getComputedStyle(document.documentElement).getPropertyValue(varName); }
  function hexAlpha(hex, a){
    hex = hex.trim();
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  // ---------------- POINTER INTERACTION ----------------
  const pointers = new Map();
  let dragLast = null, isDragging = false, downTime = 0, downPos = null;
  let pinch = null;

  canvas.addEventListener('pointerdown', (e)=>{
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1){
      dragLast = { x: e.clientX, y: e.clientY };
      downPos = { x: e.clientX, y: e.clientY };
      downTime = Date.now();
      isDragging = false;
    } else if (pointers.size === 2){
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      const midClient = { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 };
      const rect = canvas.getBoundingClientRect();
      const midLocal = { x: midClient.x-rect.left, y: midClient.y-rect.top };
      pinch = { dist, cellSize: state.cellSize, worldPt: screenToWorld(midLocal.x, midLocal.y) };
      isDragging = true;
    }
  });

  canvas.addEventListener('pointermove', (e)=>{
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 1 && dragLast){
      const dx = e.clientX - dragLast.x, dy = e.clientY - dragLast.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) isDragging = true;
      state.originX -= dx / state.cellSize;
      state.originY += dy / state.cellSize;
      dragLast = { x: e.clientX, y: e.clientY };
      render();
    } else if (pointers.size === 2 && pinch){
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      const scale = dist / pinch.dist;
      const newCell = clamp(pinch.cellSize * scale, MIN_CELL, MAX_CELL);
      const midClient = { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 };
      const rect = canvas.getBoundingClientRect();
      const midLocal = { x: midClient.x-rect.left, y: midClient.y-rect.top };
      state.cellSize = newCell;
      // keep the pinch world point fixed under the fingers
      state.originX = pinch.worldPt.x - (midLocal.x - cssW/2) / state.cellSize;
      state.originY = pinch.worldPt.y + (midLocal.y - cssH/2) / state.cellSize;
      document.getElementById('zoomSlider').value = Math.round(state.cellSize);
      document.getElementById('zoomVal').textContent = Math.round(state.cellSize) + "px";
      render();
    }
  });

  function endPointer(e){
    const wasSingle = pointers.size === 1;
    pointers.delete(e.pointerId);
    if (pointers.size === 0){
      if (wasSingle && !isDragging && downPos && Date.now()-downTime < 500){
        const rect = canvas.getBoundingClientRect();
        selectAt(downPos.x-rect.left, downPos.y-rect.top);
      }
      dragLast = null; downPos = null; isDragging = false; pinch = null;
    } else if (pointers.size === 1){
      const remaining = [...pointers.entries()][0];
      dragLast = { x: remaining[1].x, y: remaining[1].y };
      pinch = null;
      isDragging = true;
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const local = { x: e.clientX-rect.left, y: e.clientY-rect.top };
    const before = screenToWorld(local.x, local.y);
    const factor = e.deltaY < 0 ? 1.12 : 0.892;
    state.cellSize = clamp(state.cellSize * factor, MIN_CELL, MAX_CELL);
    const after = screenToWorld(local.x, local.y);
    state.originX += before.x - after.x;
    state.originY += before.y - after.y;
    document.getElementById('zoomSlider').value = Math.round(state.cellSize);
    document.getElementById('zoomVal').textContent = Math.round(state.cellSize) + "px";
    render();
  }, { passive:false });

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function selectAt(sx, sy){
    const w = screenToWorld(sx, sy);
    const x = Math.round(w.x), y = Math.round(w.y);
    const n = coordToNum(x,y);
    const value = n + state.start - 1;
    state.selected = { x, y, value };
    showCellInfo(value);
    render();
  }

  function showCellInfo(value){
    const info = document.getElementById('cellInfo');
    const prime = isPrime(value);
    if (prime){
      info.innerHTML = `n = ${fmt(value)} <span class="tag prime">PRIME</span>`;
    } else if (value < 2) {
      info.innerHTML = `n = ${fmt(value)} <span class="tag comp">—</span>`;
    } else {
      const f = smallestFactor(value);
      info.innerHTML = `n = ${fmt(value)} <span class="tag comp">${f} × ${fmt(value/f)}</span>`;
    }
    info.classList.add('show');
  }

  // ---------------- CONTROLS WIRING ----------------
  const startInput = document.getElementById('startInput');
  const zoomSlider = document.getElementById('zoomSlider');
  const zoomVal = document.getElementById('zoomVal');
  const labelsSwitch = document.getElementById('labelsSwitch');
  const diagSwitch = document.getElementById('diagSwitch');
  const diagLegend = document.getElementById('diagLegend');

  function setStart(v){
    v = clamp(Math.round(v)||1, 1, 10000000);
    state.start = v;
    startInput.value = v;
    updateLegend();
    render();
  }

  startInput.addEventListener('change', ()=> setStart(parseInt(startInput.value,10)));
  document.getElementById('eulerBtn').addEventListener('click', ()=> setStart(41));
  document.getElementById('oneBtn').addEventListener('click', ()=> setStart(1));
  document.getElementById('randomBtn').addEventListener('click', ()=> setStart(1 + Math.floor(Math.random()*999999)));

  zoomSlider.addEventListener('input', ()=>{
    state.cellSize = parseInt(zoomSlider.value,10);
    zoomVal.textContent = state.cellSize + "px";
    render();
  });
  document.getElementById('zoomIn').addEventListener('click', ()=>{
    state.cellSize = clamp(state.cellSize+4, MIN_CELL, MAX_CELL);
    zoomSlider.value = state.cellSize; zoomVal.textContent = state.cellSize+"px";
    render();
  });
  document.getElementById('zoomOut').addEventListener('click', ()=>{
    state.cellSize = clamp(state.cellSize-4, MIN_CELL, MAX_CELL);
    zoomSlider.value = state.cellSize; zoomVal.textContent = state.cellSize+"px";
    render();
  });

  function toggleSwitch(el, cb){
    const on = !el.classList.contains('on');
    el.classList.toggle('on', on);
    el.setAttribute('aria-checked', on);
    cb(on);
  }
  labelsSwitch.addEventListener('click', ()=> toggleSwitch(labelsSwitch, on=>{ state.showLabels = on; render(); }));
  labelsSwitch.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); labelsSwitch.click(); }});
  diagSwitch.addEventListener('click', ()=> toggleSwitch(diagSwitch, on=>{
    state.showDiagonals = on;
    diagLegend.classList.toggle('show', on);
    render();
  }));
  diagSwitch.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); diagSwitch.click(); }});

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    state.originX = 0; state.originY = 0; state.cellSize = 16; state.selected = null;
    zoomSlider.value = 16; zoomVal.textContent = "16px";
    document.getElementById('cellInfo').classList.remove('show');
    render();
  });
  document.getElementById('recenterBtn').addEventListener('click', ()=>{
    state.originX = 0; state.originY = 0;
    render();
  });

  // panel collapse
  const panelToggle = document.getElementById('panelToggle');
  const controls = document.getElementById('controls');
  const panelToggleLbl = document.getElementById('panelToggleLbl');
  panelToggle.addEventListener('click', ()=>{
    const collapsed = controls.classList.toggle('collapsed');
    panelToggleLbl.textContent = collapsed ? "Show controls" : "Controls";
    setTimeout(resizeCanvas, 230);
  });

  // ---------------- INIT ----------------
  window.addEventListener('resize', resizeCanvas);
  updateLegend();
  resizeCanvas();
})();
</script>
  <script src="pwa-register.js"></script>
</body>
