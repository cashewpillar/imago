<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trigger Collector</title>
<script src="../scripts/dexie.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e10;
    --surface: #18181c;
    --surface2: #222228;
    --border: #2e2e38;
    --text: #f0f0f4;
    --muted: #7a7a90;
    --accent: #c8f060;
    --accent2: #f06090;
    --accent3: #60c0f0;
    --accent4: #f0b060;
    --pill-h: 34px;
    --r: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 80px;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 4px;
  }
  .subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 28px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* HABIT TABS */
  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    align-items: center;
  }
  .tab {
    padding: 7px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0e0e10;
  }
  .tab-add {
    padding: 7px 10px;
    border-radius: 999px;
    border: 1.5px dashed var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1;
  }
  .tab-add:hover { border-color: var(--accent); color: var(--accent); }

  /* TRIGGER GRID */
  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .triggers-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
    min-height: 44px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: var(--pill-h);
    padding: 0 12px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    position: relative;
  }
  .pill:hover { border-color: var(--accent3); color: var(--accent3); }
  .pill.selected {
    background: var(--surface2);
    border-color: var(--accent);
    color: var(--accent);
  }
  .pill .del {
    opacity: 0;
    font-size: 0.7rem;
    color: var(--accent2);
    transition: opacity 0.1s;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--accent2);
    padding: 0;
    line-height: 1;
  }
  .pill:hover .del { opacity: 1; }

  .pill-add {
    height: var(--pill-h);
    padding: 0 12px;
    border-radius: 999px;
    border: 1.5px dashed var(--border);
    background: transparent;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .pill-add:hover { border-color: var(--accent); color: var(--accent); }

  /* LOG ENTRY */
  .log-section {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .log-section h3 {
    font-size: 0.9rem;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--accent);
  }

  .selected-pills-display {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 34px;
    margin-bottom: 12px;
  }
  .selected-pill-badge {
    height: 28px;
    padding: 0 10px;
    border-radius: 999px;
    background: var(--accent);
    color: #0e0e10;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    display: inline-flex;
    align-items: center;
    font-weight: 500;
  }
  .no-triggers-hint {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    font-style: italic;
  }

  textarea {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--r);
    padding: 10px 12px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    resize: vertical;
    min-height: 64px;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 10px;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .btn-log {
    background: var(--accent);
    color: #0e0e10;
    border: none;
    border-radius: var(--r);
    padding: 10px 20px;
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-log:hover { opacity: 0.85; }
  .btn-log:disabled { opacity: 0.4; cursor: not-allowed; }

  /* HISTORY */
  .history { display: flex; flex-direction: column; gap: 10px; }
  .entry-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .entry-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .entry-habit {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--accent4);
  }
  .entry-time {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
  }
  .entry-triggers {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 6px;
  }
  .entry-trigger-badge {
    height: 22px;
    padding: 0 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
  }
  .entry-note {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--text);
    opacity: 0.7;
    line-height: 1.5;
  }
  .btn-del-entry {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.75rem;
    padding: 2px 4px;
    transition: color 0.1s;
  }
  .btn-del-entry:hover { color: var(--accent2); }

  /* MODAL */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    width: 100%;
    max-width: 340px;
  }
  .modal h3 { font-size: 1rem; font-weight: 700; margin-bottom: 14px; }
  .modal input {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--r);
    padding: 9px 12px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.82rem;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 12px;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .btn-cancel {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: var(--r);
    padding: 8px 14px;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .btn-confirm {
    background: var(--accent);
    border: none;
    border-radius: var(--r);
    padding: 8px 16px;
    color: #0e0e10;
    font-family: 'Syne', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
  }

  .empty-state {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
    padding: 24px 0;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
  }

  .flash {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #0e0e10;
    font-family: 'DM Mono', monospace; font-size: 0.8rem; font-weight: 500;
    padding: 10px 20px; border-radius: 999px;
    animation: flashAnim 1.8s ease forwards;
    z-index: 200;
    pointer-events: none;
  }
  @keyframes flashAnim {
    0% { opacity:0; transform: translateX(-50%) translateY(10px); }
    15% { opacity:1; transform: translateX(-50%) translateY(0); }
    75% { opacity:1; }
    100% { opacity:0; transform: translateX(-50%) translateY(-6px); }
  }

  .divider { height: 1px; background: var(--border); margin: 20px 0; }
</style>
  <meta name="theme-color" content="#f7f6f2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="imago">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/imago-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

<h1>trigger collector</h1>
<div class="subtitle">map your urges · find your patterns</div>

<!-- HABIT TABS -->
<div class="tabs" id="habitTabs"></div>

<!-- TRIGGER PILLS -->
<div class="section-label">tap to select triggers for this entry</div>
<div class="triggers-wrap" id="triggersWrap"></div>

<!-- LOG ENTRY -->
<div class="log-section">
  <h3>↓ log an episode</h3>
  <div class="section-label" style="margin-bottom:8px">selected triggers</div>
  <div class="selected-pills-display" id="selectedDisplay">
    <span class="no-triggers-hint">none selected yet</span>
  </div>
  <textarea id="noteInput" placeholder="optional note — what's going on right now?"></textarea>
  <button class="btn-log" id="logBtn">log episode</button>
</div>

<div class="divider"></div>

<!-- HISTORY -->
<div class="section-label">recent episodes</div>
<div class="history" id="historyList"></div>

<!-- MODAL -->
<div class="modal-backdrop" id="modal" style="display:none">
  <div class="modal">
    <h3 id="modalTitle">add new</h3>
    <input type="text" id="modalInput" placeholder="name..." maxlength="40">
    <div class="modal-btns">
      <button class="btn-cancel" id="modalCancel">cancel</button>
      <button class="btn-confirm" id="modalConfirm">add</button>
    </div>
  </div>
</div>

<script>
// ── DB SETUP ──────────────────────────────────────────
const db = new Dexie('TriggerCollector');
db.version(1).stores({
  habits:   '++id, name',
  triggers: '++id, habitId, name',
  entries:  '++id, habitId, createdAt'
});

// ── STATE ─────────────────────────────────────────────
let habits = [];
let triggers = [];
let entries = [];
let activeHabitId = null;
let selectedTriggerIds = new Set();
let modalMode = null; // 'habit' | 'trigger'

// ── DEFAULTS ──────────────────────────────────────────
const DEFAULT_HABITS = ['ear picking', 'nose picking', 'beard plucking'];
const DEFAULT_TRIGGERS = {
  'ear picking':   ['bored', 'stressed', 'in bathroom', 'watching screen', 'after shower', 'anxious', 'reading', 'idle hands'],
  'nose picking':  ['bored', 'stressed', 'driving', 'alone', 'watching screen', 'anxious', 'dry air'],
  'beard plucking':['bored', 'stressed', 'thinking hard', 'in front of mirror', 'anxious', 'reading', 'idle hands'],
};

async function seedDefaults() {
  const existing = await db.habits.count();
  if (existing > 0) return;
  for (const name of DEFAULT_HABITS) {
    const hid = await db.habits.add({ name });
    const trigs = DEFAULT_TRIGGERS[name] || [];
    for (const t of trigs) await db.triggers.add({ habitId: hid, name: t });
  }
}

// ── LOAD ──────────────────────────────────────────────
async function loadAll() {
  habits = await db.habits.toArray();
  triggers = await db.triggers.toArray();
  entries = await db.entries.orderBy('createdAt').reverse().limit(30).toArray();
  if (!activeHabitId && habits.length) activeHabitId = habits[0].id;
  render();
}

// ── RENDER ────────────────────────────────────────────
function render() {
  renderTabs();
  renderTriggers();
  renderSelectedDisplay();
  renderHistory();
}

function renderTabs() {
  const wrap = document.getElementById('habitTabs');
  wrap.innerHTML = '';
  for (const h of habits) {
    const btn = document.createElement('button');
    btn.className = 'tab' + (h.id === activeHabitId ? ' active' : '');
    btn.textContent = h.name;
    btn.onclick = () => { activeHabitId = h.id; selectedTriggerIds.clear(); render(); };
    wrap.appendChild(btn);
  }
  const addBtn = document.createElement('button');
  addBtn.className = 'tab-add';
  addBtn.title = 'Add habit';
  addBtn.textContent = '+';
  addBtn.onclick = () => openModal('habit');
  wrap.appendChild(addBtn);
}

function renderTriggers() {
  const wrap = document.getElementById('triggersWrap');
  wrap.innerHTML = '';
  const myTriggers = triggers.filter(t => t.habitId === activeHabitId);
  for (const t of myTriggers) {
    const pill = document.createElement('span');
    pill.className = 'pill' + (selectedTriggerIds.has(t.id) ? ' selected' : '');
    pill.innerHTML = `${t.name}<button class="del" title="delete trigger" data-id="${t.id}">✕</button>`;
    pill.onclick = (e) => {
      if (e.target.classList.contains('del')) return;
      toggleTrigger(t.id);
    };
    pill.querySelector('.del').onclick = (e) => { e.stopPropagation(); deleteTrigger(t.id); };
    wrap.appendChild(pill);
  }
  const addPill = document.createElement('button');
  addPill.className = 'pill-add';
  addPill.innerHTML = '+ trigger';
  addPill.onclick = () => openModal('trigger');
  wrap.appendChild(addPill);
}

function renderSelectedDisplay() {
  const wrap = document.getElementById('selectedDisplay');
  wrap.innerHTML = '';
  if (selectedTriggerIds.size === 0) {
    wrap.innerHTML = '<span class="no-triggers-hint">none selected yet</span>';
    return;
  }
  for (const tid of selectedTriggerIds) {
    const t = triggers.find(x => x.id === tid);
    if (!t) continue;
    const badge = document.createElement('span');
    badge.className = 'selected-pill-badge';
    badge.textContent = t.name;
    wrap.appendChild(badge);
  }
}

function renderHistory() {
  const wrap = document.getElementById('historyList');
  wrap.innerHTML = '';
  const myEntries = entries.filter(e => e.habitId === activeHabitId);
  if (!myEntries.length) {
    wrap.innerHTML = '<div class="empty-state">no episodes logged yet for this habit</div>';
    return;
  }
  for (const e of myEntries) {
    const card = document.createElement('div');
    card.className = 'entry-card';
    const habit = habits.find(h => h.id === e.habitId);
    const time = new Date(e.createdAt).toLocaleString('en-SG', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    const trigBadges = (e.triggerNames || []).map(n =>
      `<span class="entry-trigger-badge">${n}</span>`
    ).join('');
    card.innerHTML = `
      <div class="entry-top">
        <span class="entry-habit">${habit?.name || '?'}</span>
        <span style="display:flex;align-items:center;gap:6px">
          <span class="entry-time">${time}</span>
          <button class="btn-del-entry" data-id="${e.id}" title="delete">✕</button>
        </span>
      </div>
      <div class="entry-triggers">${trigBadges || '<span class="entry-trigger-badge">no triggers tagged</span>'}</div>
      ${e.note ? `<div class="entry-note">${e.note}</div>` : ''}
    `;
    card.querySelector('.btn-del-entry').onclick = () => deleteEntry(e.id);
    wrap.appendChild(card);
  }
}

// ── ACTIONS ───────────────────────────────────────────
function toggleTrigger(id) {
  if (selectedTriggerIds.has(id)) selectedTriggerIds.delete(id);
  else selectedTriggerIds.add(id);
  renderTriggers();
  renderSelectedDisplay();
}

async function deleteTrigger(id) {
  selectedTriggerIds.delete(id);
  await db.triggers.delete(id);
  triggers = triggers.filter(t => t.id !== id);
  render();
}

async function deleteEntry(id) {
  await db.entries.delete(id);
  entries = entries.filter(e => e.id !== id);
  renderHistory();
}

document.getElementById('logBtn').onclick = async () => {
  if (!activeHabitId) return;
  const note = document.getElementById('noteInput').value.trim();
  const triggerNames = [...selectedTriggerIds].map(id => triggers.find(t => t.id === id)?.name).filter(Boolean);
  const entry = {
    habitId: activeHabitId,
    triggerIds: [...selectedTriggerIds],
    triggerNames,
    note,
    createdAt: Date.now()
  };
  await db.entries.add(entry);
  entries.unshift(entry);
  if (entries.length > 30) entries = entries.slice(0, 30);
  selectedTriggerIds.clear();
  document.getElementById('noteInput').value = '';
  render();
  flash('episode logged ✓');
};

// ── MODAL ─────────────────────────────────────────────
function openModal(mode) {
  modalMode = mode;
  document.getElementById('modalTitle').textContent = mode === 'habit' ? 'new habit' : 'new trigger';
  document.getElementById('modalInput').value = '';
  document.getElementById('modal').style.display = 'flex';
  setTimeout(() => document.getElementById('modalInput').focus(), 50);
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }

document.getElementById('modalCancel').onclick = closeModal;
document.getElementById('modal').onclick = (e) => { if (e.target === document.getElementById('modal')) closeModal(); };

document.getElementById('modalInput').onkeydown = (e) => {
  if (e.key === 'Enter') document.getElementById('modalConfirm').click();
  if (e.key === 'Escape') closeModal();
};

document.getElementById('modalConfirm').onclick = async () => {
  const val = document.getElementById('modalInput').value.trim();
  if (!val) return;
  if (modalMode === 'habit') {
    const id = await db.habits.add({ name: val });
    habits.push({ id, name: val });
    activeHabitId = id;
    selectedTriggerIds.clear();
  } else {
    const id = await db.triggers.add({ habitId: activeHabitId, name: val });
    triggers.push({ id, habitId: activeHabitId, name: val });
  }
  closeModal();
  render();
};

// ── FLASH ─────────────────────────────────────────────
function flash(msg) {
  const el = document.createElement('div');
  el.className = 'flash';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1900);
}

// ── INIT ──────────────────────────────────────────────
seedDefaults().then(loadAll);
</script>
  <script src="pwa-register.js"></script>
</body>
</html>
