<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — imago</title>
    <meta name="theme-color" content="#f7f6f2">
    <style>
        :root {
            --bg: #f7f6f2;
            --text: #1a1a18;
            --muted: #6b6b67;
            --border: rgba(0,0,0,0.09);
            --surface: #ffffff;
            --radius: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a18;
                --text: #f0efe9;
                --muted: #a0a09b;
                --border: rgba(255,255,255,0.07);
                --surface: #232321;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        main {
            width: 100%;
            max-width: 340px;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 0.6rem;
            letter-spacing: -0.01em;
        }

        p {
            font-size: 0.9rem;
            color: var(--muted);
            line-height: 1.5;
            margin: 0 0 1.5rem;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }

        a, button {
            font: inherit;
            font-size: 0.85rem;
            padding: 0.55rem 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
        }

        a:hover, button:hover {
            border-color: var(--text);
        }
    </style>
</head>
<body>
    <main>
        <h1>Not saved for offline yet</h1>
        <p>This page needs one visit while you're online. After that it works offline like the rest.</p>
        <div class="actions">
            <button onclick="location.reload()">Retry</button>
            <a href="./index.html">Home</a>
        </div>
    </main>
</body>
</html>
