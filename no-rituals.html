<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>this or that</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX compilation in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="imago-export.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_MOMENTS = [
      {
        id: "wake",
        time: "AM · WAKE",
        options: [
          { id: "a", label: "stretch and read and appreciate the view from my room", presence: true },
          { id: "b", label: "doomscroll and lay a little longer", presence: false },
        ],
      },
      {
        id: "lunch",
        time: "PM · LUNCH SLUMP",
        options: [
          { id: "a", label: "go outside and breathe fresh air and watch the birds and wash plates so you could think more and be free and real and touching greens", presence: true },
          { id: "b", label: "strain your back and sweat your butt, stuck in your laptop pretending to do work", presence: false },
        ],
      },
      {
        id: "boredom-hunger",
        time: "PM · HUNGRY",
        options: [
          { id: "a", label: "comfort movie or tv or book or music", presence: true },
          { id: "b", label: "buy your junk food", presence: false },
        ],
      },
      {
        id: "night",
        time: "PM · NIGHT",
        options: [
          { id: "a", label: "swim and think and float with water playfully", presence: true },
          { id: "b", label: "ah shit here we go again", presence: false },
        ],
      }
    ];

    const STORAGE_KEY = "thisorthat_data";

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : { moments: DEFAULT_MOMENTS, log: [] };
      } catch {
        return { moments: DEFAULT_MOMENTS, log: [] };
      }
    }

    function saveData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch {}
    }

    function getTodayKey() {
      return new Date().toISOString().slice(0, 10);
    }

    const styles = {
      root: {
        minHeight: "100vh",
        background: "#f5f0e8",
        fontFamily: "'Lora', Georgia, serif",
        color: "#2d2a24",
        maxWidth: 520,
        margin: "0 auto",
        padding: "0 0 80px",
      },
      header: {
        padding: "40px 28px 20px",
        borderBottom: "1px solid #ddd6c8",
      },
      title: {
        fontSize: 32,
        fontWeight: 600,
        letterSpacing: "-0.5px",
        color: "#1a1714",
      },
      subtitle: {
        fontSize: 13,
        color: "#9e9080",
        fontStyle: "italic",
        marginTop: 4,
        fontFamily: "'DM Mono', monospace",
      },
      nav: {
        display: "flex",
        gap: 4,
        marginTop: 20,
      },
      navBtn: {
        background: "none",
        border: "1px solid #ccc5b8",
        borderRadius: 20,
        padding: "5px 16px",
        fontSize: 12,
        fontFamily: "'DM Mono', monospace",
        color: "#9e9080",
        cursor: "pointer",
        transition: "all 0.15s",
      },
      navBtnActive: {
        background: "#2d2a24",
        border: "1px solid #2d2a24",
        color: "#f5f0e8",
      },
      strip: {
        padding: "10px 28px",
        fontSize: 12,
        fontFamily: "'DM Mono', monospace",
        color: "#7a7060",
        borderBottom: "1px solid #ede8de",
        background: "#f0ebe0",
      },
      stripMuted: {
        color: "#b0a898",
      },
      moments: {
        padding: "20px 28px",
        display: "flex",
        flexDirection: "column",
        gap: 20,
      },
      card: {
        background: "#faf7f2",
        border: "1px solid #ddd6c8",
        borderRadius: 12,
        padding: "20px 20px 16px",
        transition: "background 0.3s",
      },
      cardFlash: {
        background: "#ede3d0",
      },
      cardTime: {
        fontSize: 10,
        fontFamily: "'DM Mono', monospace",
        letterSpacing: "0.12em",
        color: "#b0a898",
        textTransform: "uppercase",
        marginBottom: 12,
      },
      picked: {
        fontSize: 12,
        fontFamily: "'DM Mono', monospace",
        color: "#7a7060",
        marginBottom: 12,
        fontStyle: "italic",
      },
      pickedTime: {
        color: "#b0a898",
      },
      options: {
        display: "flex",
        flexDirection: "column",
        gap: 8,
      },
      optBtn: {
        background: "none",
        border: "1px solid",
        borderRadius: 8,
        padding: "12px 16px",
        textAlign: "left",
        fontSize: 14,
        fontFamily: "'Lora', Georgia, serif",
        cursor: "pointer",
        display: "flex",
        alignItems: "flex-start",
        gap: 10,
        lineHeight: 1.5,
        transition: "all 0.15s",
      },
      optPresence: {
        borderColor: "#a8c4aa",
        color: "#3a5c3c",
        background: "#f2f8f2",
      },
      optEscape: {
        borderColor: "#d4a8a8",
        color: "#6b3535",
        background: "#fdf5f5",
      },
      optSelected: {
        opacity: 0.5,
      },
      optDot: {
        marginTop: 2,
        flexShrink: 0,
        fontSize: 16,
      },
      logWrap: {
        padding: "20px 28px",
      },
      empty: {
        fontFamily: "'DM Mono', monospace",
        fontSize: 13,
        color: "#b0a898",
        fontStyle: "italic",
        textAlign: "center",
        marginTop: 40,
      },
      logDay: {
        marginBottom: 28,
      },
      logDate: {
        fontFamily: "'DM Mono', monospace",
        fontSize: 11,
        color: "#b0a898",
        letterSpacing: "0.1em",
        marginBottom: 10,
        textTransform: "uppercase",
      },
      logEntry: {
        display: "flex",
        alignItems: "baseline",
        gap: 6,
        fontSize: 13,
        padding: "6px 0",
        borderBottom: "1px solid #ede8de",
      },
      logMoment: {
        fontFamily: "'DM Mono', monospace",
        fontSize: 10,
        color: "#b0a898",
        minWidth: 80,
      },
      logLabel: {
        flex: 1,
        fontStyle: "italic",
        color: "#4a4438",
      },
      logTime: {
        fontFamily: "'DM Mono', monospace",
        fontSize: 10,
        color: "#c0b8a8",
      },
      logStat: {
        fontFamily: "'DM Mono', monospace",
        fontSize: 11,
        color: "#b0a898",
        marginTop: 8,
        fontStyle: "italic",
      },
      editWrap: {
        padding: "20px 28px",
      },
      editNote: {
        fontFamily: "'DM Mono', monospace",
        fontSize: 12,
        color: "#9e9080",
        fontStyle: "italic",
        marginBottom: 20,
      },
      editCard: {
        background: "#faf7f2",
        border: "1px solid #ddd6c8",
        borderRadius: 10,
        padding: "16px",
        marginBottom: 16,
      },
      editCardHeader: {
        display: "flex",
        justifyContent: "space-between",
        alignItems: "center",
        marginBottom: 12,
      },
      editTimeInput: {
        background: "none",
        border: "none",
        borderBottom: "1px solid #ccc5b8",
        fontSize: 11,
        color: "#7a7060",
        letterSpacing: "0.1em",
        textTransform: "uppercase",
        padding: "2px 4px",
        width: "70%",
        outline: "none",
      },
      deleteBtn: {
        background: "none",
        border: "none",
        color: "#c0a898",
        cursor: "pointer",
        fontSize: 14,
        padding: 4,
      },
      editRow: {
        display: "flex",
        alignItems: "flex-start",
        gap: 8,
        marginBottom: 10,
      },
      editInput: {
        flex: 1,
        background: "#f0ebe0",
        border: "1px solid #ddd6c8",
        borderRadius: 6,
        padding: "8px 10px",
        fontSize: 13,
        color: "#2d2a24",
        lineHeight: 1.5,
        outline: "none",
        width: "100%",
      },
      addBtn: {
        background: "none",
        border: "1px dashed #ccc5b8",
        borderRadius: 8,
        padding: "10px 20px",
        fontFamily: "'DM Mono', monospace",
        fontSize: 12,
        color: "#9e9080",
        cursor: "pointer",
        width: "100%",
        marginTop: 4,
      },
      backupSection: {
        marginTop: 40,
        paddingTop: 20,
        borderTop: "1px solid #ddd6c8",
        display: "flex",
        gap: 8,
      },
      backupBtn: {
        flex: 1,
        background: "#ede3d0",
        border: "1px solid #d4c8b0",
        borderRadius: 8,
        padding: "10px",
        fontFamily: "'DM Mono', monospace",
        fontSize: 11,
        color: "#7a7060",
        cursor: "pointer",
        textAlign: "center",
      },
    };

    function App() {
      const [data, setData] = useState(loadData);
      const [view, setView] = useState("choose"); // choose | log | edit
      const [editingMoment, setEditingMoment] = useState(null);
      const [flash, setFlash] = useState(null);
      const [exitingId, setExitingId] = useState(null);

      const todayKey = getTodayKey();
      const todayLog = data.log.filter((e) => e.date === todayKey);

      useEffect(() => {
        saveData(data);
      }, [data]);

      function pick(momentId, optionId) {
        setExitingId(momentId);
        
        setTimeout(() => {
          const moment = data.moments.find((m) => m.id === momentId);
          const option = moment.options.find((o) => o.id === optionId);
          const entry = {
            id: Date.now(),
            date: todayKey,
            time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
            momentId,
            momentTime: moment.time,
            optionId,
            label: option.label,
            presence: option.presence,
          };
          setData((d) => ({ ...d, log: [entry, ...d.log] }));
          setExitingId(null);
        }, 400);
      }

      function deleteLogEntry(id) {
        setData((d) => ({
          ...d,
          log: d.log.filter((e) => e.id !== id),
        }));
      }

      function updateMomentOption(momentId, optionId, newLabel) {
        setData((d) => ({
          ...d,
          moments: d.moments.map((m) =>
            m.id === momentId
              ? {
                  ...m,
                  options: m.options.map((o) =>
                    o.id === optionId ? { ...o, label: newLabel } : o
                  ),
                }
              : m
          ),
        }));
      }

      function addMoment() {
        const id = `custom_${Date.now()}`;
        const newMoment = {
          id,
          time: "NEW · MOMENT",
          options: [
            { id: "a", label: "the presence path", presence: true },
            { id: "b", label: "the escape path", presence: false },
          ],
        };
        setData((d) => ({ ...d, moments: [...d.moments, newMoment] }));
        setEditingMoment(id);
      }

      function deleteMoment(momentId) {
        setData((d) => ({
          ...d,
          moments: d.moments.filter((m) => m.id !== momentId),
        }));
      }

      function updateMomentTime(momentId, newTime) {
        setData((d) => ({
          ...d,
          moments: d.moments.map((m) =>
            m.id === momentId ? { ...m, time: newTime } : m
          ),
        }));
      }

      const presenceCount = todayLog.filter((e) => e.presence).length;
      const escapeCount = todayLog.filter((e) => !e.presence).length;

      function handleExport() {
        ImagoExport.exportJSON(STORAGE_KEY, "no-rituals-backup.json");
      }

      function handleImport() {
        ImagoExport.importJSON(STORAGE_KEY, (importedData) => {
          setData(importedData);
        });
      }

      return (
        <div style={styles.root}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@300;400&display=swap');
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body { background: #f5f0e8; }
            ::selection { background: #c8b89a44; }
            textarea { font-family: 'DM Mono', monospace; resize: none; }
            input { font-family: 'DM Mono', monospace; }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
            @keyframes cardExit { 
              to { 
                opacity: 0; 
                transform: translateX(30px); 
                max-height: 0; 
                margin-bottom: 0; 
                padding-top: 0; 
                padding-bottom: 0; 
                overflow: hidden;
                border-color: transparent;
              } 
            }
            .card-exit { animation: cardExit 0.4s ease forwards; }
          `}</style>

          {/* Header */}
          <div style={styles.header}>
            <div style={styles.title}>this or that</div>
            <div style={styles.subtitle}>for the few days we get to live</div>
            <div style={styles.nav}>
              {["choose", "log", "edit"].map((v) => (
                <button
                  key={v}
                  onClick={() => setView(v)}
                  style={{ ...styles.navBtn, ...(view === v ? styles.navBtnActive : {}) }}
                >
                  {v}
                </button>
              ))}
            </div>
          </div>

          {/* Today summary strip */}
          {todayLog.length > 0 && view === "choose" && (
            <div style={styles.strip}>
              <span style={{ color: "#7a9e7e" }}>●</span> {presenceCount} presence
              {"  "}
              <span style={{ color: "#b07070" }}>●</span> {escapeCount} escape
              {"  "}
              <span style={styles.stripMuted}>today</span>
            </div>
          )}

          {/* CHOOSE VIEW */}
          {view === "choose" && (
            <div style={styles.moments}>
              {data.moments
                .filter((m) => !todayLog.find((e) => e.momentId === m.id) || exitingId === m.id)
                .map((moment) => (
                  <div
                    key={moment.id}
                    className={exitingId === moment.id ? "card-exit" : ""}
                    style={{
                      ...styles.card,
                      ...(flash === moment.id ? styles.cardFlash : {}),
                    }}
                  >
                    <div style={styles.cardTime}>{moment.time}</div>
                    <div style={styles.options}>
                      {moment.options.map((opt) => (
                        <button
                          key={opt.id}
                          onClick={() => pick(moment.id, opt.id)}
                          disabled={!!exitingId}
                          style={{
                            ...styles.optBtn,
                            ...(opt.presence ? styles.optPresence : styles.optEscape),
                            cursor: exitingId ? "default" : "pointer"
                          }}
                        >
                          <span style={styles.optDot}>
                            {opt.presence ? "○" : "◦"}
                          </span>
                          {opt.label}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              {data.moments.filter((m) => !todayLog.find((e) => e.momentId === m.id)).length === 0 && !exitingId && (
                <div style={styles.empty}>all moments captured for today</div>
              )}
            </div>
          )}
          {/* LOG VIEW */}
          {view === "log" && (
            <div style={styles.logWrap}>
              {data.log.length === 0 && (
                <div style={styles.empty}>no picks recorded yet</div>
              )}
              {(() => {
                const byDate = {};
                data.log.forEach((e) => {
                  if (!byDate[e.date]) byDate[e.date] = [];
                  byDate[e.date].push(e);
                });
                return Object.keys(byDate)
                  .sort((a, b) => b.localeCompare(a))
                  .map((date) => (
                    <div key={date} style={styles.logDay}>
                      <div style={styles.logDate}>{date}</div>
                      {byDate[date].map((e) => (
                        <div key={e.id} style={styles.logEntry}>
                          <span style={{ color: e.presence ? "#7a9e7e" : "#b07070", marginRight: 8 }}>
                            ●
                          </span>
                          <span style={styles.logMoment}>{e.momentTime}</span>
                          <span style={styles.logLabel}>{e.label}</span>
                          <span style={styles.logTime}>{e.time}</span>
                          <button 
                            onClick={() => deleteLogEntry(e.id)}
                            style={{...styles.deleteBtn, marginLeft: 10, fontSize: 10}}
                          >
                            ✕
                          </button>
                        </div>
                      ))}                      <div style={styles.logStat}>
                        {byDate[date].filter((e) => e.presence).length} presence ·{" "}
                        {byDate[date].filter((e) => !e.presence).length} escape
                      </div>
                    </div>
                  ));
              })()}
            </div>
          )}

          {/* EDIT VIEW */}
          {view === "edit" && (
            <div style={styles.editWrap}>
              <div style={styles.editNote}>
                these are your decision points. make them honest.
              </div>
              {data.moments.map((moment) => (
                <div key={moment.id} style={styles.editCard}>
                  <div style={styles.editCardHeader}>
                    <input
                      value={moment.time}
                      onChange={(e) => updateMomentTime(moment.id, e.target.value)}
                      style={styles.editTimeInput}
                    />
                    <button
                      onClick={() => deleteMoment(moment.id)}
                      style={styles.deleteBtn}
                    >
                      ✕
                    </button>
                  </div>
                  {moment.options.map((opt) => (
                    <div key={opt.id} style={styles.editRow}>
                      <span style={{ color: opt.presence ? "#7a9e7e" : "#b07070", marginRight: 8, fontSize: 12 }}>
                        {opt.presence ? "presence" : "escape"}
                      </span>
                      <textarea
                        value={opt.label}
                        rows={2}
                        onChange={(e) =>
                          updateMomentOption(moment.id, opt.id, e.target.value)
                        }
                        style={styles.editInput}
                      />
                    </div>
                  ))}
                </div>
              ))}
              <button onClick={addMoment} style={styles.addBtn}>
                + add moment
              </button>

              <div style={styles.backupSection}>
                <button onClick={handleExport} style={styles.backupBtn}>
                  export data
                </button>
                <button onClick={handleImport} style={styles.backupBtn}>
                  import data
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
