<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>story graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --text: #1a1a18;
    --muted: #6b6b67;
    --hint: #a0a09b;
    --border: rgba(0,0,0,0.09);
    --border-med: rgba(0,0,0,0.16);
    --radius: 12px;
    --radius-sm: 8px;
    --purple: #7F77DD;
    --purple-bg: #EEEDFE;
    --purple-border: #AFA9EC;
    --purple-text: #3C3489;
    --teal-bg: #E1F5EE;
    --teal-border: #5DCAA5;
    --teal-text: #085041;
    --coral-bg: #FAECE7;
    --coral-border: #F0997B;
    --coral-text: #712B13;
    --amber-bg: #FAEEDA;
    --amber-border: #FAC775;
    --amber-text: #633806;
  }

  body.dark-mode {
    --bg: #1a1a18;
    --surface: #232321;
    --surface2: #2a2a28;
    --text: #f0efe9;
    --muted: #a0a09b;
    --hint: #6b6b67;
    --border: rgba(255,255,255,0.07);
    --border-med: rgba(255,255,255,0.13);
    --purple-bg: #26215C;
    --purple-border: #534AB7;
    --purple-text: #CECBF6;
    --teal-bg: #04342C;
    --teal-border: #0F6E56;
    --teal-text: #9FE1CB;
    --coral-bg: #4A1B0C;
    --coral-border: #993C1D;
    --coral-text: #F5C4B3;
    --amber-bg: #412402;
    --amber-border: #854F0B;
    --amber-text: #FAC775;
  }

  @media (prefers-color-scheme: dark) {
    body:not(.light-mode) {
      --bg: #1a1a18;
      --surface: #232321;
      --surface2: #2a2a28;
      --text: #f0efe9;
      --muted: #a0a09b;
      --hint: #6b6b67;
      --border: rgba(255,255,255,0.07);
      --border-med: rgba(255,255,255,0.13);
      --purple-bg: #26215C;
      --purple-border: #534AB7;
      --purple-text: #CECBF6;
      --teal-bg: #04342C;
      --teal-border: #0F6E56;
      --teal-text: #9FE1CB;
      --coral-bg: #4A1B0C;
      --coral-border: #993C1D;
      --coral-text: #F5C4B3;
      --amber-bg: #412402;
      --amber-border: #854F0B;
      --amber-text: #FAC775;
    }
  }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s, color 0.2s;
    overflow: hidden;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .nav {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0.9rem 1rem 0.75rem;
    border-bottom: 0.5px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .nav-title { flex: 1; min-width: 0; }
  .nav-title h1 {
    font-size: 18px;
    font-weight: normal;
    letter-spacing: -0.3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-sub {
    font-size: 12px;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin-top: 2px;
  }

  .btn-ghost {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    padding: 6px 4px;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .btn-ghost:hover { color: var(--text); }

  .graph-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .graph-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #graph-svg { width: 100%; height: 100%; display: block; }

  .graph-bottom {
    background: var(--bg);
    border-top: 0.5px solid var(--border);
    padding: 0.75rem 1rem 1rem;
  }

  .graph-info {
    font-size: 12px;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin-bottom: 8px;
    min-height: 18px;
  }

  .graph-tag-row {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  .tag-chip {
    font-size: 12px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 4px 10px;
    border-radius: 20px;
    border: 0.5px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    cursor: pointer;
  }

  .tooltip {
    position: absolute;
    background: var(--surface);
    border: 0.5px solid var(--border-med);
    border-radius: var(--radius-sm);
    padding: 10px 13px;
    max-width: 260px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 20;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }
  .tooltip.visible { opacity: 1; }
  .tooltip-text {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    font-style: italic;
    margin-bottom: 6px;
  }
  .tooltip-meta, .tooltip-note {
    font-size: 11px;
    color: var(--hint);
    line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .tooltip-note { margin-top: 6px; }

  .empty {
    text-align: center;
    padding: 2.5rem 1rem;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.7;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
</style>
</head>
<body>
<div class="app">
  <div class="nav">
    <button class="btn-ghost" onclick="goBack()">← back</button>
    <div class="nav-title">
      <h1 id="book-title">story graph</h1>
      <div class="nav-sub" id="book-meta">loading…</div>
    </div>
    <button class="btn-ghost" onclick="toggleTheme()" title="Toggle theme">◐</button>
  </div>

  <div class="graph-screen">
    <div class="graph-wrap" id="graph-wrap">
      <svg id="graph-svg"></svg>
      <div class="tooltip" id="tooltip">
        <div class="tooltip-text" id="tt-text"></div>
        <div class="tooltip-meta" id="tt-meta"></div>
        <div class="tooltip-note" id="tt-note"></div>
      </div>
    </div>
    <div class="graph-bottom">
      <div class="graph-info" id="graph-info">tap a tag to filter · tap a node to peek</div>
      <div class="graph-tag-row" id="graph-tags"></div>
    </div>
  </div>
</div>

<script>
const TAG_COLORS = ['#AFA9EC','#5DCAA5','#F0997B','#ED93B1','#85B7EB','#97C459','#EF9F27','#7F77DD','#1D9E75','#D85A30'];
const STANCE_LABEL = { yes: 'agree', complicated: 'complicated', no: 'disagree' };

let state = { books: [], currentBookId: null };
let graphFilter = null;

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  loadState();
  renderHeader();
  renderGraph();
  window.addEventListener('resize', renderGraph);
});

function loadState() {
  try {
    const raw = localStorage.getItem('reader_v3');
    if (raw) state = JSON.parse(raw);
  } catch (e) {}
  const params = new URLSearchParams(window.location.search);
  const bookId = params.get('book');
  if (bookId) state.currentBookId = bookId;
}

function currentBook() {
  return state.books.find(b => b.id === state.currentBookId) || state.books[0] || null;
}

function initTheme() {
  const t = localStorage.getItem('theme');
  if (t === 'dark') document.body.classList.add('dark-mode');
  else if (t === 'light') document.body.classList.add('light-mode');
}

function toggleTheme() {
  const isDark = document.body.classList.contains('dark-mode');
  const isLight = document.body.classList.contains('light-mode');
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.body.classList.remove('dark-mode', 'light-mode');
  if (isDark) {
    document.body.classList.add('light-mode');
    localStorage.setItem('theme', 'light');
  } else if (isLight) {
    document.body.classList.add('dark-mode');
    localStorage.setItem('theme', 'dark');
  } else {
    document.body.classList.add(systemDark ? 'light-mode' : 'dark-mode');
    localStorage.setItem('theme', systemDark ? 'light' : 'dark');
  }
  renderGraph();
}

function goBack() {
  const b = currentBook();
  if (b) localStorage.setItem('reader_v3', JSON.stringify({ ...state, currentBookId: b.id }));
  window.location.href = 'story.html';
}

function renderHeader() {
  const title = document.getElementById('book-title');
  const meta = document.getElementById('book-meta');
  const books = state.books || [];
  const graphNotes = getGraphNotes();
  if (!books.length) {
    title.textContent = 'story graph';
    meta.textContent = 'no books yet';
    return;
  }
  title.textContent = 'story graph';
  meta.textContent = `${books.length} book${books.length === 1 ? '' : 's'} · ${graphNotes.length} tagged line${graphNotes.length === 1 ? '' : 's'}`;
}

function getGraphNotes() {
  const items = [];
  (state.books || []).forEach(book => {
    (book.notes || []).forEach(note => {
      const tags = (note.tags || []).filter(Boolean);
      if (!tags.length) return;
      items.push({
        ...note,
        tags,
        bookId: book.id,
        bookTitle: book.title || 'untitled book',
        bookAuthor: book.author || ''
      });
    });
  });
  return items;
}

function getAllTags(notes) {
  const set = new Set();
  notes.forEach(n => (n.tags || []).forEach(t => set.add(t)));
  return [...set].sort();
}

function renderGraph() {
  const wrap = document.getElementById('graph-wrap');
  const svg = document.getElementById('graph-svg');
  const notes = getGraphNotes();
  svg.innerHTML = '';

  const W = wrap.clientWidth || 360;
  const H = wrap.clientHeight || 540;
  const cs = getComputedStyle(document.body);
  const purpleCol = cs.getPropertyValue('--purple').trim() || '#7F77DD';
  const textCol = cs.getPropertyValue('--text').trim() || '#1a1a18';
  const mutedCol = cs.getPropertyValue('--muted').trim() || '#6b6b67';
  const borderMed = cs.getPropertyValue('--border-med').trim() || 'rgba(0,0,0,0.16)';
  const surfaceCol = cs.getPropertyValue('--surface').trim() || '#ffffff';

  const shownNotes = graphFilter
    ? notes.filter(n => (n.tags || []).includes(graphFilter))
    : notes;

  if (!shownNotes.length) {
    const s = d3.select(svg).attr('viewBox', `0 0 ${W} ${H}`);
    s.append('text')
      .attr('x', W / 2)
      .attr('y', H / 2)
      .attr('text-anchor', 'middle')
      .attr('fill', mutedCol)
      .attr('font-size', 14)
      .attr('font-family', '-apple-system, sans-serif')
      .text(notes.length ? 'no tagged lines match this filter' : 'no tagged lines yet');
    renderGraphTags(notes);
    return;
  }

  const allTags = getAllTags(notes);
  const tagColorMap = {};
  allTags.forEach((t, i) => { tagColorMap[t] = TAG_COLORS[i % TAG_COLORS.length]; });

  const books = state.books.filter(book =>
    shownNotes.some(note => note.bookId === book.id)
  );

  const bookNodes = books.map((book, index) => ({
    id: 'b_' + book.id,
    type: 'book',
    book,
    label: book.title || 'untitled book',
    color: TAG_COLORS[index % TAG_COLORS.length],
    r: 10 + shownNotes.filter(note => note.bookId === book.id).length * 0.6
  }));

  const noteNodes = shownNotes.map(n => ({
    id: noteNodeId(n),
    type: 'note',
    note: n,
    r: 4 + Math.min((n.tags || []).length, 4)
  }));

  const tagSet = new Set();
  shownNotes.forEach(n => (n.tags || []).forEach(t => tagSet.add(t)));
  const tagNodes = [...tagSet].map(t => ({
    id: 't_' + t,
    type: 'tag',
    tag: t,
    r: 7 + notes.filter(n => (n.tags || []).includes(t)).length * 0.9,
    color: tagColorMap[t]
  }));

  const nodes = [...bookNodes, ...tagNodes, ...noteNodes];
  const links = [];
  shownNotes.forEach(n => {
    links.push({ source: noteNodeId(n), target: 'b_' + n.bookId, kind: 'book' });
    (n.tags || []).forEach(t => {
      if (tagSet.has(t)) links.push({ source: noteNodeId(n), target: 't_' + t, kind: 'tag' });
    });
  });

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(d => d.kind === 'book' ? 74 : 60).strength(d => d.kind === 'book' ? 0.42 : 0.68))
    .force('charge', d3.forceManyBody().strength(-140))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide().radius(d => d.r + 5));

  const s = d3.select(svg).attr('viewBox', `0 0 ${W} ${H}`);
  const linkSel = s.append('g').selectAll('line').data(links).join('line')
    .attr('stroke', borderMed)
    .attr('stroke-width', d => d.kind === 'book' ? 1.2 : 1)
    .attr('opacity', d => d.kind === 'book' ? 0.32 : 0.5);

  const nodeSel = s.append('g').selectAll('g').data(nodes).join('g')
    .style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (event, d) => {
        if (!event.active) sim.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      })
      .on('drag', (event, d) => {
        d.fx = event.x;
        d.fy = event.y;
      })
      .on('end', (event, d) => {
        if (!event.active) sim.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }));

  nodeSel.append('circle')
    .attr('r', d => d.r)
    .attr('fill', d => {
      if (d.type === 'tag') return d.color;
      if (d.type === 'book') return surfaceCol;
      const tags = d.note.tags || [];
      return tags.length ? tagColorMap[tags[0]] + '55' : purpleCol + '44';
    })
    .attr('stroke', d => d.type === 'tag' ? d.color : d.type === 'book' ? textCol : borderMed)
    .attr('stroke-width', d => d.type === 'tag' ? 1.5 : d.type === 'book' ? 1.4 : 1);

  nodeSel.filter(d => d.type === 'book')
    .append('text')
    .attr('y', d => d.r + 12)
    .attr('text-anchor', 'middle')
    .attr('fill', textCol)
    .attr('font-size', 10)
    .attr('font-family', "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif")
    .text(d => truncate(d.label, 18));

  const tooltip = document.getElementById('tooltip');
  nodeSel.filter(d => d.type === 'note')
    .on('pointerenter', (event, d) => {
      const rect = wrap.getBoundingClientRect();
      const note = d.note;
      document.getElementById('tt-text').textContent = note.text.slice(0, 160) + (note.text.length > 160 ? '…' : '');
      document.getElementById('tt-meta').textContent = [note.bookTitle, note.location, note.stance ? STANCE_LABEL[note.stance] : null, relDate(note.date)].filter(Boolean).join(' · ');
      document.getElementById('tt-note').textContent = note.meaning || note.stanceNote || '';
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      tooltip.style.left = Math.min(x + 12, W - 272) + 'px';
      tooltip.style.top = Math.max(y - 72, 4) + 'px';
      tooltip.classList.add('visible');
    })
    .on('pointerleave', () => tooltip.classList.remove('visible'));

  nodeSel.filter(d => d.type === 'tag')
    .on('pointerenter', (event, d) => {
      const count = notes.filter(n => (n.tags || []).includes(d.tag)).length;
      document.getElementById('graph-info').textContent = `${d.tag} — ${count} line${count === 1 ? '' : 's'}`;
    })
    .on('pointerleave', () => {
      document.getElementById('graph-info').textContent = graphFilter ? `showing ${graphFilter}` : 'tap a tag to filter · tap a node to peek';
    });

  nodeSel.filter(d => d.type === 'book')
    .on('pointerenter', (event, d) => {
      const count = shownNotes.filter(note => note.bookId === d.book.id).length;
      document.getElementById('graph-info').textContent = `${d.book.title} — ${count} tagged line${count === 1 ? '' : 's'}`;
    })
    .on('pointerleave', () => {
      document.getElementById('graph-info').textContent = graphFilter ? `showing ${graphFilter}` : 'tap a tag to filter · tap a node to peek';
    });

  sim.on('tick', () => {
    linkSel
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);
    nodeSel.attr('transform', d => `translate(${clamp(d.x, d.r, W - d.r)},${clamp(d.y, d.r, H - d.r)})`);
  });

  renderGraphTags(notes);
}

function renderGraphTags(notes) {
  const allTags = getAllTags(notes);
  const wrap = document.getElementById('graph-tags');
  if (!allTags.length) {
    wrap.innerHTML = '<span class="empty" style="padding:0;font-size:12px;">tags will appear here once you add some</span>';
    return;
  }

  const tagColorMap = {};
  allTags.forEach((t, i) => { tagColorMap[t] = TAG_COLORS[i % TAG_COLORS.length]; });

  wrap.innerHTML = ['all', ...allTags].map(t => {
    const isAll = t === 'all';
    const isActive = graphFilter === t || (isAll && !graphFilter);
    const color = isAll ? 'var(--muted)' : tagColorMap[t];
    const style = !isAll ? `background:${color}22;color:${color};border-color:${color}44;` : '';
    const activeStyle = `background:${color};color:#fff;border-color:${color};`;
    return `<button class="tag-chip" style="${isActive ? activeStyle : style}" onclick="setGraphFilter('${esc(t)}')">${esc(t)}</button>`;
  }).join('');
}

function setGraphFilter(tag) {
  graphFilter = tag === 'all' ? null : tag;
  document.getElementById('graph-info').textContent = graphFilter ? `showing ${graphFilter}` : 'tap a tag to filter · tap a node to peek';
  renderGraph();
}

function relDate(ts) {
  const d = Math.floor((Date.now() - ts) / 86400000);
  if (d === 0) return 'today';
  if (d === 1) return 'yesterday';
  if (d < 7) return d + 'd ago';
  if (d < 30) return Math.floor(d / 7) + 'w ago';
  return Math.floor(d / 30) + 'mo ago';
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function truncate(s, max) {
  const text = String(s || '');
  return text.length > max ? text.slice(0, max - 1) + '…' : text;
}

function noteNodeId(note) {
  return 'n_' + note.bookId + '_' + note.id;
}
</script>
</body>
</html>
